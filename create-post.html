<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-DARK Create</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#08090d;
color:white;
font-family:Arial;
padding-bottom:80px
}
header{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
border-bottom:1px solid #292b35
}
.logo{font-size:25px;font-weight:bold}
main{
max-width:600px;
margin:25px auto;
padding:0 18px
}
.card{
background:#111219;
border:1px solid #292b35;
border-radius:20px;
padding:18px
}
h1{font-size:28px}
.user{
display:flex;
gap:12px;
align-items:center;
margin-bottom:20px
}
.avatar{
width:48px;
height:48px;
border-radius:50%;
border:2px solid #8b52ff
}
.handle{color:#888}
.choose{
border:2px dashed #454855;
border-radius:16px;
padding:35px 10px;
text-align:center;
cursor:pointer;
background:#181a22
}
.choose div{font-size:45px}
input[type=file]{display:none}
.preview{
display:none;
margin-top:18px;
background:#000;
border-radius:15px;
overflow:hidden
}
video{
width:100%;
max-height:420px
}
textarea,input[type=text]{
width:100%;
margin-top:15px;
padding:14px;
border-radius:12px;
border:1px solid #30333e;
background:#191b23;
color:white;
font-size:16px;
outline:none
}
textarea{
height:110px;
resize:none
}
.buttons{
display:flex;
gap:10px;
margin-top:18px
}
button{
flex:1;
padding:14px;
border:0;
border-radius:12px;
font-weight:bold;
font-size:16px
}
.cancel{background:#252731;color:white}
.post{background:white;color:black}
.post:disabled{opacity:.4}
.status{
text-align:center;
color:#aaa;
margin-top:15px
}
nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:#090a0e;
border-top:1px solid #292b35;
display:flex;
justify-content:space-around;
align-items:center;
font-size:27px
}
.plus{
background:white;
color:black;
padding:8px 20px;
border-radius:15px
}
</style>
</head>

<body>

<header>
<div class="logo">X-DARK</div>
<div>✦</div>
</header>

<main>

<h1>Create</h1>

<div class="card">

<div class="user">
<img class="avatar"
src="https://i.pravatar.cc/100?img=12">
<div>
<b>X-Dark User</b>
<div class="handle">@Darkwing2</div>
</div>
</div>

<label class="choose" for="videoInput">
<div>🎬</div>
<b>Choose Video</b>
<p>MP4 • MOV • WEBM</p>
</label>

<input
id="videoInput"
type="file"
accept="video/mp4,video/quicktime,video/webm">

<div class="preview" id="preview">
<video id="video"
controls
playsinline></video>
</div>

<textarea
id="caption"
placeholder="Write something..."
maxlength="500"></textarea>

<input
id="tags"
type="text"
placeholder="#india #xdark">

<div class="buttons">

<button
class="cancel"
onclick="location.href='index.html'">
Cancel
</button>

<button
class="post"
id="postBtn"
onclick="uploadVideo()"
disabled>
🚀 Post
</button>

</div>

<div class="status" id="status"></div>

</div>
</main>

<nav>
<span onclick="location.href='index.html'">⌂</span>
<span>⌕</span>
<span class="plus">+</span>
<span>♡</span>
<span onclick="location.href='profile.html'">◉</span>
</nav>

<script>

let selectedFile=null;

const input=
document.getElementById("videoInput");

input.onchange=()=>{

const file=input.files[0];

if(!file)return;

selectedFile=file;

const video=
document.getElementById("video");

video.src=
URL.createObjectURL(file);

document.getElementById("preview")
.style.display="block";

document.getElementById("postBtn")
.disabled=false;

document.getElementById("status")
.innerText="Video ready ✓";

};

async function uploadVideo(){

if(!selectedFile)return;

const btn=
document.getElementById("postBtn");

const status=
document.getElementById("status");

btn.disabled=true;
btn.innerText="Uploading...";

const data=new FormData();

data.append("video",selectedFile);

data.append(
"caption",
document.getElementById("caption").value
);

data.append(
"tags",
document.getElementById("tags").value
);

try{

const response=
await fetch("/api/upload",{
method:"POST",
body:data
});

const result=
await response.json();

if(!response.ok)
throw new Error(result.message);

status.innerText=
"Uploaded successfully ✓";

setTimeout(()=>{
location.href="index.html";
},800);

}catch(error){

status.innerText=
"Upload failed: "+error.message;

btn.disabled=false;
btn.innerText="🚀 Post";

}

}

</script>

</body>
</html>
