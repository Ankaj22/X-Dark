<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-DARK Create Post</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#08090d;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

/* HEADER */
.header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #282a34;
}

.back{
  font-size:32px;
  cursor:pointer;
}

.header h1{
  font-size:24px;
}

/* MAIN */
.container{
  padding:25px 20px 100px;
  max-width:600px;
  margin:auto;
}

.title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:25px;
}

/* USER */
.user{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #8b52ff;
  object-fit:cover;
}

.user strong{
  font-size:17px;
}

.user small{
  display:block;
  color:#858895;
  margin-top:4px;
}

/* UPLOAD BOX */
.upload{
  border:2px dashed #444753;
  border-radius:18px;
  min-height:220px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
  cursor:pointer;
  background:#101117;
}

.upload:hover{
  border-color:#8b52ff;
}

.upload-icon{
  font-size:55px;
  margin-bottom:12px;
}

.upload h3{
  font-size:19px;
  margin-bottom:8px;
}

.upload p{
  color:#858895;
  font-size:14px;
}

#fileInput{
  display:none;
}

/* PREVIEW */
.preview{
  display:none;
  margin-top:20px;
  background:#101117;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #292b35;
}

.preview img,
.preview video{
  width:100%;
  max-height:420px;
  object-fit:contain;
  background:#000;
  display:block;
}

.file-info{
  padding:12px 15px;
  color:#aaa;
  font-size:13px;
}

/* CAPTION */
.caption{
  margin-top:20px;
}

.caption textarea{
  width:100%;
  height:120px;
  resize:none;
  background:#101117;
  border:1px solid #30323c;
  border-radius:14px;
  padding:15px;
  color:#fff;
  font-size:16px;
  outline:none;
}

.caption textarea:focus{
  border-color:#8b52ff;
}

.counter{
  text-align:right;
  color:#777b89;
  font-size:12px;
  margin-top:5px;
}

/* BUTTONS */
.buttons{
  display:flex;
  gap:12px;
  margin-top:22px;
}

.cancel,
.post{
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cancel{
  background:#20222b;
  color:#fff;
}

.post{
  background:#fff;
  color:#000;
}

.post:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* STATUS */
.status{
  text-align:center;
  margin-top:18px;
  color:#8b52ff;
  font-size:14px;
}

/* BOTTOM */
.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#090a0e;
  border-top:1px solid #282a34;
  display:flex;
  align-items:center;
  justify-content:space-around;
}

.nav{
  font-size:27px;
  color:#858a99;
  cursor:pointer;
}

.nav.active{
  color:#fff;
}

.add{
  width:58px;
  height:48px;
  border-radius:16px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="back" onclick="goHome()">‹</div>

  <h1>CREATE POST</h1>

  <div>✦</div>

</div>


<div class="container">

  <div class="title">
    Create a new post 🚀
  </div>


  <!-- USER -->
  <div class="user">

    <img
      class="avatar"
      src="https://i.pravatar.cc/100?img=12"
    >

    <div>
      <strong>X-Dark User</strong>
      <small>@Darkwing2</small>
    </div>

  </div>


  <!-- UPLOAD -->
  <label class="upload" for="fileInput">

    <div class="upload-icon">
      ＋
    </div>

    <h3>
      Add photo or video
    </h3>

    <p>
      MP4, MOV, WEBM, JPG, PNG supported
    </p>

  </label>

  <input
    type="file"
    id="fileInput"
    accept="image/*,video/*"
  >


  <!-- PREVIEW -->
  <div class="preview" id="preview">

    <img id="imagePreview">

    <video
      id="videoPreview"
      controls
      playsinline
    ></video>

    <div class="file-info" id="fileInfo"></div>

  </div>


  <!-- CAPTION -->
  <div class="caption">

    <textarea
      id="caption"
      maxlength="500"
      placeholder="Write a caption..."
    ></textarea>

    <div class="counter">
      <span id="count">0</span>/500
    </div>

  </div>


  <!-- BUTTONS -->
  <div class="buttons">

    <button
      class="cancel"
      onclick="goHome()"
    >
      Cancel
    </button>

    <button
      class="post"
      id="postButton"
      onclick="publishPost()"
      disabled
    >
      🚀 Post
    </button>

  </div>


  <div
    class="status"
    id="status"
  ></div>

</div>


<!-- BOTTOM NAV -->
<div class="bottom">

  <div
    class="nav"
    onclick="goHome()"
  >
    ⌂
  </div>

  <div class="nav">
    ⌕
  </div>

  <div class="add">
    +
  </div>

  <div class="nav">
    ♡
  </div>

  <div
    class="nav"
    onclick="goProfile()"
  >
    ◉
  </div>

</div>


<script>

let selectedFile = null;
let selectedURL = null;


/* HOME */
function goHome(){

  window.location.href = "index.html";

}


/* PROFILE */
function goProfile(){

  window.location.href = "profile.html";

}


/* FILE SELECT */
document
.getElementById("fileInput")
.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  selectedFile = file;

  selectedURL = URL.createObjectURL(file);

  const preview =
    document.getElementById("preview");

  const image =
    document.getElementById("imagePreview");

  const video =
    document.getElementById("videoPreview");

  const info =
    document.getElementById("fileInfo");


  preview.style.display = "block";


  if(file.type.startsWith("video/")){

    image.style.display = "none";

    video.style.display = "block";

    video.src = selectedURL;

  }

  else if(file.type.startsWith("image/")){

    video.style.display = "none";

    image.style.display = "block";

    image.src = selectedURL;

  }


  info.innerText =
    file.name +
    " • " +
    formatSize(file.size);


  document
  .getElementById("postButton")
  .disabled = false;

});


/* FILE SIZE */
function formatSize(bytes){

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){
    return (bytes / 1024).toFixed(1) + " KB";
  }

  return (bytes / (1024 * 1024)).toFixed(1) + " MB";

}


/* CAPTION COUNTER */
document
.getElementById("caption")
.addEventListener("input", function(){

  document
  .getElementById("count")
  .innerText = this.value.length;

});


/* PUBLISH */
function publishPost(){

  if(!selectedFile){

    alert("Please select a photo or video first.");

    return;

  }


  const caption =
    document
    .getElementById("caption")
    .value
    .trim();


  const post = {

    id: Date.now(),

    type:
      selectedFile.type.startsWith("video/")
      ? "video"
      : "image",

    name: selectedFile.name,

    url: selectedURL,

    caption:
      caption || "My new X-DARK post 🚀",

    created:
      new Date().toISOString()

  };


  /*
    IMPORTANT:

    Browser localStorage cannot safely store
    the actual large video file.

    We save the post information here for now.
    Later we will connect real cloud storage.
  */

  localStorage.setItem(
    "xdark_last_post",
    JSON.stringify(post)
  );


  document
  .getElementById("status")
  .innerText =
    "Post created successfully! 🚀";


  document
  .getElementById("postButton")
  .disabled = true;


  setTimeout(function(){

    window.location.href =
      "index.html";

  },1000);

}

</script>

</body>
</html>
