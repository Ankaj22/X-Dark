<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>X-Dark</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050505;
  color:#fff;
  overflow-x:hidden;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:#080808;
  padding-bottom:70px;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:60px;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(5,5,5,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #222;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#ff1744;
}

.headerBtn{
  background:#151515;
  border:1px solid #333;
  color:white;
  padding:9px 16px;
  border-radius:22px;
  font-size:14px;
}

/* MAIN */

main{
  padding-top:60px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* FEED */

.feed{
  height:calc(100vh - 60px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.videoCard{
  position:relative;
  height:calc(100vh - 60px);
  min-height:600px;
  background:#000;
  overflow:hidden;
  scroll-snap-align:start;
}

.videoCard video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.videoOverlay{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:linear-gradient(
    transparent 40%,
    rgba(0,0,0,.12) 58%,
    rgba(0,0,0,.92) 100%
  );
}

/* PLAY */

.playBtn{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:8;
  width:65px;
  height:65px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:28px;
  display:none;
}

/* SOUND */

.muted{
  position:absolute;
  top:16px;
  right:15px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:white;
  font-size:20px;
  z-index:10;
}

/* VIDEO INFO */

.videoInfo{
  position:absolute;
  left:16px;
  right:90px;
  bottom:28px;
  z-index:7;
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:9px;
}

.caption{
  font-size:14px;
  line-height:1.4;
  margin-bottom:12px;
}

.followBtn{
  background:#ff1744;
  color:white;
  padding:9px 17px;
  border-radius:20px;
  font-weight:bold;
}

/* ACTIONS */

.actions{
  position:absolute;
  right:9px;
  bottom:28px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.action{
  width:55px;
  min-height:52px;
  background:transparent;
  color:white;
  font-size:28px;
  text-align:center;
}

.action small{
  display:block;
  font-size:11px;
  margin-top:3px;
}

.likeBtn{
  transition:transform .15s;
}

.likeBtn.liked{
  transform:scale(1.08);
}

/* AUTH */

.authBox{
  padding:35px 22px;
}

.authBox h1{
  font-size:34px;
  margin-bottom:8px;
}

.authBox p{
  color:#999;
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:16px;
  margin-bottom:12px;
  border-radius:13px;
  border:1px solid #333;
  background:#151515;
  color:white;
  outline:none;
  font-size:15px;
}

.input:focus{
  border-color:#ff1744;
}

.primary{
  width:100%;
  padding:16px;
  border-radius:13px;
  background:#ff1744;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}

.google{
  width:100%;
  padding:16px;
  border-radius:13px;
  background:white;
  color:#111;
  font-weight:bold;
  font-size:15px;
}

.switch{
  text-align:center;
  margin-top:22px;
  color:#999;
}

.switch span{
  color:#ff1744;
  font-weight:bold;
}

/* UPLOAD */

.uploadBox{
  padding:28px 18px;
}

.uploadBox h2{
  margin-bottom:20px;
}

.fileInput{
  width:100%;
  padding:15px;
  background:#151515;
  border:1px dashed #555;
  color:white;
  border-radius:12px;
  margin-bottom:15px;
}

.progress{
  height:8px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progressBar{
  width:0%;
  height:100%;
  background:#ff1744;
}

.status{
  color:#999;
  font-size:13px;
}

/* PROFILE */

.profile{
  padding:30px 18px;
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ff1744;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:20px auto 14px;
  font-size:36px;
  font-weight:bold;
}

.profile h2{
  margin-bottom:7px;
}

.profile p{
  color:#888;
}

.profileBtns{
  margin-top:28px;
}

.profileBtns button{
  width:100%;
  padding:15px;
  background:#191919;
  color:white;
  border:1px solid #333;
  border-radius:12px;
}

/* NAV */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:70px;
  background:rgba(5,5,5,.97);
  border-top:1px solid #222;
  z-index:60;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

nav button{
  background:none;
  color:#888;
  font-size:27px;
}

nav button.active{
  color:#ff1744;
}

/* EMPTY */

.empty{
  padding:100px 20px;
  text-align:center;
  color:#777;
}

.empty h2{
  color:#aaa;
  margin-bottom:8px;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  z-index:100;
  display:none;
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:22px;
  font-size:13px;
  max-width:85%;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">X-<span>DARK</span></div>
  <button id="authHeaderBtn" class="headerBtn">Login</button>
</header>

<main>

<!-- HOME -->

<section id="homePage" class="page active">

  <div id="feed" class="feed">

    <div class="empty">
      Loading X-Dark...
    </div>

  </div>

</section>


<!-- LOGIN -->

<section id="loginPage" class="page">

  <div class="authBox">

    <h1>Welcome Back</h1>
    <p>Login to X-Dark</p>

    <input
      id="loginEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button id="loginBtn" class="primary">
      Login
    </button>

    <button id="googleBtn" class="google">
      🔵 Continue with Google
    </button>

    <div class="switch">
      Don't have an account?
      <span id="showSignup">Sign up</span>
    </div>

  </div>

</section>


<!-- SIGNUP -->

<section id="signupPage" class="page">

  <div class="authBox">

    <h1>Create Account</h1>
    <p>Join X-Dark</p>

    <input
      id="signupName"
      class="input"
      type="text"
      placeholder="Username"
    >

    <input
      id="signupEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="signupPassword"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button id="signupBtn" class="primary">
      Create Account
    </button>

    <div class="switch">
      Already have an account?
      <span id="showLogin">Login</span>
    </div>

  </div>

</section>


<!-- UPLOAD -->

<section id="uploadPage" class="page">

  <div class="uploadBox">

    <h2>Upload Video 🎬</h2>

    <input
      id="videoFile"
      class="fileInput"
      type="file"
      accept="video/mp4,video/webm,video/quicktime,video/x-matroska"
    >

    <input
      id="caption"
      class="input"
      type="text"
      maxlength="150"
      placeholder="Write a caption..."
    >

    <button id="uploadBtn" class="primary">
      Upload to X-Dark
    </button>

    <div class="progress">
      <div id="progressBar" class="progressBar"></div>
    </div>

    <div id="uploadStatus" class="status">
      Maximum video size: 100 MB
    </div>

  </div>

</section>


<!-- PROFILE -->

<section id="profilePage" class="page">

  <div class="profile">

    <div id="avatar" class="avatar">
      ?
    </div>

    <h2 id="profileName">
      Guest
    </h2>

    <p id="profileEmail">
      Not logged in
    </p>

    <div class="profileBtns">
      <button id="logoutBtn">
        Logout
      </button>
    </div>

  </div>

</section>

</main>


<nav>

  <button
    class="navBtn active"
    data-page="homePage"
  >
    ⌂
  </button>

  <button
    class="navBtn"
    data-page="uploadPage"
  >
    ＋
  </button>

  <button
    class="navBtn"
    data-page="profilePage"
  >
    ♙
  </button>

</nav>

<div id="toast"></div>

</div>


<script type="module">

/* ==============================
   FIREBASE
============================== */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  getDoc,
  query,
  orderBy,
  serverTimestamp,
  doc,
  setDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ==============================
   FIREBASE CONFIG
============================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
    "darkwing-a717a.firebaseapp.com",

  projectId:
    "darkwing-a717a",

  storageBucket:
    "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
    "352453390196",

  appId:
    "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
    "G-5RVX9NET3W"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ==============================
   CLOUDINARY
============================== */

const CLOUD_NAME =
  "lrpb7uuy";

const UPLOAD_PRESET =
  "x_dark_videos";

const CLOUDINARY_URL =
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* ==============================
   HELPERS
============================== */

const $ =
  id => document.getElementById(id);


function toast(message){

  const box =
    $("toast");

  box.textContent =
    message;

  box.style.display =
    "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      ()=>{
        box.style.display =
          "none";
      },
      2500
    );

}


/* ==============================
   PAGE SYSTEM
============================== */

function showPage(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove(
        "active"
      );
    });


  $(pageId)
    .classList.add(
      "active"
    );


  document
    .querySelectorAll(".navBtn")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.page ===
        pageId
      );

    });

}


/* ==============================
   NAVIGATION
============================== */

document
  .querySelectorAll(".navBtn")
  .forEach(btn=>{

    btn.onclick =
      ()=>{

        const page =
          btn.dataset.page;


        if(
          page === "uploadPage" &&
          !auth.currentUser
        ){

          toast(
            "Login required to upload"
          );

          showPage(
            "loginPage"
          );

          return;
        }


        showPage(page);

      };

  });


$("authHeaderBtn").onclick =
()=>{

  if(auth.currentUser){

    showPage(
      "profilePage"
    );

  }else{

    showPage(
      "loginPage"
    );

  }

};


/* ==============================
   SIGN UP
============================== */

$("signupBtn").onclick =
async ()=>{

  const name =
    $("signupName")
      .value
      .trim();

  const email =
    $("signupEmail")
      .value
      .trim();

  const password =
    $("signupPassword")
      .value;


  if(
    !name ||
    !email ||
    !password
  ){

    toast(
      "Fill all fields"
    );

    return;
  }


  if(
    password.length < 6
  ){

    toast(
      "Password must be 6+ characters"
    );

    return;
  }


  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );


    toast(
      "Account created 🎉"
    );


    showPage(
      "homePage"
    );


  }catch(error){

    console.error(error);

    toast(
      friendlyError(error)
    );

  }

};


/* ==============================
   LOGIN
============================== */

$("loginBtn").onclick =
async ()=>{

  const email =
    $("loginEmail")
      .value
      .trim();

  const password =
    $("loginPassword")
      .value;


  if(
    !email ||
    !password
  ){

    toast(
      "Enter email and password"
    );

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    toast(
      "Login successful ✅"
    );


    showPage(
      "homePage"
    );


  }catch(error){

    console.error(error);

    toast(
      friendlyError(error)
    );

  }

};


/* ==============================
   GOOGLE LOGIN
============================== */

$("googleBtn").onclick =
async ()=>{

  try{

    const provider =
      new GoogleAuthProvider();


    await signInWithPopup(
      auth,
      provider
    );


    toast(
      "Google login successful ✅"
    );


    showPage(
      "homePage"
    );


  }catch(error){

    console.error(error);

    toast(
      friendlyError(error)
    );

  }

};


/* ==============================
   AUTH SWITCH
============================== */

$("showSignup").onclick =
()=>showPage(
  "signupPage"
);


$("showLogin").onclick =
()=>showPage(
  "loginPage"
);


/* ==============================
   FRIENDLY ERRORS
============================== */

function friendlyError(error){

  const code =
    error?.code || "";


  if(
    code.includes(
      "auth/invalid-credential"
    )
  ){

    return "Email or password is incorrect";

  }


  if(
    code.includes(
      "auth/email-already-in-use"
    )
  ){

    return "Email already registered";

  }


  if(
    code.includes(
      "auth/invalid-email"
    )
  ){

    return "Invalid email";

  }


  if(
    code.includes(
      "auth/popup-closed-by-user"
    )
  ){

    return "Google login cancelled";

  }


  return (
    error?.message ||
    "Something went wrong"
  );

}


/* ==============================
   AUTH STATE
============================== */

onAuthStateChanged(
  auth,
  user=>{

    if(user){

      $("authHeaderBtn")
        .textContent =
        "Profile";


      const name =
        user.displayName ||
        "X-Dark User";


      $("profileName")
        .textContent =
        name;


      $("profileEmail")
        .textContent =
        user.email || "";


      $("avatar")
        .textContent =
        name
          .charAt(0)
          .toUpperCase();

    }else{

      $("authHeaderBtn")
        .textContent =
        "Login";


      $("profileName")
        .textContent =
        "Guest";


      $("profileEmail")
        .textContent =
        "Not logged in";


      $("avatar")
        .textContent =
        "?";

    }

  }
);


/* ==============================
   LOGOUT
============================== */

$("logoutBtn").onclick =
async ()=>{

  try{

    await signOut(auth);

    toast(
      "Logged out"
    );

    showPage(
      "homePage"
    );

  }catch(error){

    toast(
      "Logout failed"
    );

  }

};


/* ==============================
   CLOUDINARY UPLOAD
============================== */

$("uploadBtn").onclick =
()=>{

  if(!auth.currentUser){

    toast(
      "Please login first"
    );

    showPage(
      "loginPage"
    );

    return;
  }


  const file =
    $("videoFile")
      .files[0];


  const caption =
    $("caption")
      .value
      .trim();


  if(!file){

    toast(
      "Select a video"
    );

    return;
  }


  if(
    file.size >
    100 * 1024 * 1024
  ){

    toast(
      "Video must be under 100 MB"
    );

    return;
  }


  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  $("progressBar")
    .style.width =
    "0%";


  $("uploadStatus")
    .textContent =
    "Uploading video...";


  const xhr =
    new XMLHttpRequest();


  xhr.open(
    "POST",
    CLOUDINARY_URL
  );


  xhr.upload.onprogress =
    event=>{

      if(
        event.lengthComputable
      ){

        const percent =
          Math.round(
            event.loaded /
            event.total *
            100
          );


        $("progressBar")
          .style.width =
          percent + "%";


        $("uploadStatus")
          .textContent =
          `Uploading ${percent}%`;

      }

    };


  xhr.onload =
    async ()=>{

      if(
        xhr.status >= 200 &&
        xhr.status < 300
      ){

        try{

          const data =
            JSON.parse(
              xhr.responseText
            );


          const videoUrl =
            data.secure_url;


          $("uploadStatus")
            .textContent =
            "Saving video...";


          await addDoc(
            collection(
              db,
              "videos"
            ),
            {

              videoUrl:
                videoUrl,

              caption:
                caption,

              username:
                auth.currentUser
                  .displayName ||
                "X-Dark User",

              userId:
                auth.currentUser.uid,

              comments:
                0,

              createdAt:
                serverTimestamp()

            }
          );


          $("progressBar")
            .style.width =
            "100%";


          $("uploadStatus")
            .textContent =
            "Upload complete ✅";


          $("videoFile")
            .value = "";


          $("caption")
            .value = "";


          toast(
            "Video uploaded 🎉"
          );


          await loadVideos();


          setTimeout(
            ()=>{
              showPage(
                "homePage"
              );
            },
            700
          );


        }catch(error){

          console.error(error);

          toast(
            "Firestore save failed"
          );

        }

      }else{

        toast(
          "Cloudinary upload failed"
        );

      }

    };


  xhr.onerror =
    ()=>{

      toast(
        "Network error"
      );

    };


  xhr.send(
    formData
  );

};


/* ==============================
   LOAD VIDEOS
============================== */

async function loadVideos(){

  const feed =
    $("feed");


  feed.innerHTML = `
    <div class="empty">
      Loading videos...
    </div>
  `;


  try{

    const q =
      query(
        collection(
          db,
          "videos"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await getDocs(q);


    if(
      snapshot.empty
    ){

      feed.innerHTML = `
        <div class="empty">
          <h2>No videos yet</h2>
          <p>Be the first to upload 🚀</p>
        </div>
      `;

      return;
    }


    feed.innerHTML = "";


    for(
      const videoDoc
      of snapshot.docs
    ){

      await createVideoCard(
        videoDoc.data(),
        videoDoc.id
      );

    }


    activateVideos();


  }catch(error){

    console.error(
      "Feed error:",
      error
    );


    feed.innerHTML = `
      <div class="empty">
        <h2>Feed unavailable</h2>
        <p>Unable to load videos.</p>
      </div>
    `;

  }

}


/* ==============================
   VIDEO CARD
============================== */

async function createVideoCard(
  data,
  videoId
){

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "videoCard";


  /* VIDEO */

  const video =
    document.createElement(
      "video"
    );

  video.src =
    data.videoUrl || "";

  video.playsInline =
    true;

  video.loop =
    true;

  video.muted =
    true;

  video.preload =
    "metadata";


  /* OVERLAY */

  const overlay =
    document.createElement(
      "div"
    );

  overlay.className =
    "videoOverlay";


  /* PLAY */

  const playBtn =
    document.createElement(
      "button"
    );

  playBtn.className =
    "playBtn";

  playBtn.textContent =
    "▶";


  /* SOUND */

  const muteBtn =
    document.createElement(
      "button"
    );

  muteBtn.className =
    "muted";

  muteBtn.textContent =
    "🔇";


  /* INFO */

  const info =
    document.createElement(
      "div"
    );

  info.className =
    "videoInfo";


  const username =
    document.createElement(
      "div"
    );

  username.className =
    "username";

  username.textContent =
    "@" +
    (
      data.username ||
      "user"
    );


  const caption =
    document.createElement(
      "div"
    );

  caption.className =
    "caption";

  caption.textContent =
    data.caption || "";


  const follow =
    document.createElement(
      "button"
    );

  follow.className =
    "followBtn";

  follow.textContent =
    "Follow";


  info.append(
    username,
    caption,
    follow
  );


  /* ACTIONS */

  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "actions";


  /* LIKE */

  const likeBtn =
    document.createElement(
      "button"
    );

  likeBtn.className =
    "action likeBtn";


  const likeIcon =
    document.createElement(
      "span"
    );

  likeIcon.textContent =
    "🤍";


  const likeCount =
    document.createElement(
      "small"
    );

  likeCount.textContent =
    "0";


  likeBtn.append(
    likeIcon,
    likeCount
  );


  /* COMMENT */

  const commentBtn =
    document.createElement(
      "button"
    );

  commentBtn.className =
    "action commentBtn";


  const commentIcon =
    document.createElement(
      "span"
    );

  commentIcon.textContent =
    "💬";


  const commentCount =
    document.createElement(
      "small"
    );

  commentCount.textContent =
    data.comments || 0;


  commentBtn.append(
    commentIcon,
    commentCount
  );


  /* SHARE */

  const shareBtn =
    document.createElement(
      "button"
    );

  shareBtn.className =
    "action shareBtn";


  const shareIcon =
    document.createElement(
      "span"
    );

  shareIcon.textContent =
    "↗️";


  const shareText =
    document.createElement(
      "small"
    );

  shareText.textContent =
    "Share";


  shareBtn.append(
    shareIcon,
    shareText
  );


  actions.append(
    likeBtn,
    commentBtn,
    shareBtn
  );


  card.append(
    video,
    overlay,
    playBtn,
    muteBtn,
    info,
    actions
  );


  $("feed")
    .appendChild(card);


  /* ==========================
     VIDEO EVENTS
  ========================== */

  video.addEventListener(
    "click",
    ()=>{

      if(video.paused){

        video.play()
          .catch(()=>{});

        playBtn.style.display =
          "none";

      }else{

        video.pause();

        playBtn.style.display =
          "block";

      }

    }
  );


  playBtn.onclick =
    ()=>{

      video.play()
        .then(()=>{
          playBtn.style.display =
            "none";
        })
        .catch(()=>{});

    };


  video.addEventListener(
    "error",
    ()=>{

      playBtn.textContent =
        "⚠️";

      playBtn.style.display =
        "block";

    }
  );


  /* SOUND */

  muteBtn.onclick =
    ()=>{

      video.muted =
        !video.muted;


      muteBtn.textContent =
        video.muted
          ? "🔇"
          : "🔊";

    };


  /* ==========================
     LOAD REAL LIKES
  ========================== */

  let liked =
    false;


  const likesRef =
    collection(
      db,
      "videos",
      videoId,
      "likes"
    );


  try{

    const likesSnapshot =
      await getDocs(
        likesRef
      );


    likeCount.textContent =
      likesSnapshot.size;


    if(auth.currentUser){

      liked =
        likesSnapshot.docs.some(
          likeDoc =>
            likeDoc.id ===
            auth.currentUser.uid
        );

    }


    setLikeAppearance(
      likeIcon,
      likeBtn,
      liked
    );


  }catch(error){

    console.error(
      "Like load error:",
      error
    );

  }


  /* ==========================
     LIKE / UNLIKE
  ========================== */

  likeBtn.onclick =
    async ()=>{

      if(!auth.currentUser){

        toast(
          "Login to like ❤️"
        );

        showPage(
          "loginPage"
        );

        return;
      }


      const uid =
        auth.currentUser.uid;


      const likeRef =
        doc(
          db,
          "videos",
          videoId,
          "likes",
          uid
        );


      likeBtn.disabled =
        true;


      try{

        const existing =
          await getDoc(
            likeRef
          );


        if(
          existing.exists()
        ){

          await deleteDoc(
            likeRef
          );


          liked =
            false;


          let count =
            parseInt(
              likeCount.textContent
            ) || 0;


          count =
            Math.max(
              0,
              count - 1
            );


          likeCount.textContent =
            count;


          setLikeAppearance(
            likeIcon,
            likeBtn,
            false
          );


          toast(
            "Like removed"
          );


        }else{

          await setDoc(
            likeRef,
            {

              userId:
                uid,

              createdAt:
                serverTimestamp()

            }
          );


          liked =
            true;


          let count =
            parseInt(
              likeCount.textContent
            ) || 0;


          count++;


          likeCount.textContent =
            count;


          setLikeAppearance(
            likeIcon,
            likeBtn,
            true
          );


          toast(
            "Liked ❤️"
          );

        }


      }catch(error){

        console.error(
          "Like error:",
          error
        );


        toast(
          "Like failed"
        );

      }


      likeBtn.disabled =
        false;

    };


  /* ==========================
     COMMENTS
  ========================== */

  commentBtn.onclick =
    ()=>{

      if(!auth.currentUser){

        toast(
          "Login to comment"
        );

        showPage(
          "loginPage"
        );

        return;
      }


      toast(
        "Comments will be added next 💬"
      );

    };


  /* ==========================
     SHARE
  ========================== */

  shareBtn.onclick =
    async ()=>{

      try{

        if(
          navigator.share
        ){

          await navigator.share({

            title:
              "X-Dark Video",

            text:
              data.caption ||
              "Watch this on X-Dark",

            url:
              data.videoUrl

          });

        }else{

          await navigator.clipboard
            .writeText(
              data.videoUrl
            );


          toast(
            "Video link copied 🔗"
          );

        }

      }catch(error){

        console.log(
          "Share cancelled"
        );

      }

    };


  /* ==========================
     FOLLOW
  ========================== */

  follow.onclick =
    ()=>{

      if(!auth.currentUser){

        toast(
          "Login to follow"
        );

        showPage(
          "loginPage"
        );

        return;
      }


      toast(
        "Follow system coming next 👥"
      );

    };

}


/* ==============================
   LIKE APPEARANCE
============================== */

function setLikeAppearance(
  icon,
  button,
  liked
){

  icon.textContent =
    liked
      ? "❤️"
      : "🤍";


  button.classList.toggle(
    "liked",
    liked
  );

}


/* ==============================
   AUTOPLAY
============================== */

function activateVideos(){

  const videos =
    document.querySelectorAll(
      ".videoCard video"
    );


  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(
          entry=>{

            const video =
              entry.target;

            const card =
              video.closest(
                ".videoCard"
              );

            const play =
              card.querySelector(
                ".playBtn"
              );


            if(
              entry.isIntersecting
            ){

              video.play()
                .then(()=>{

                  play.style.display =
                    "none";

                })
                .catch(()=>{

                  play.style.display =
                    "block";

                });

            }else{

              video.pause();

              play.style.display =
                "none";

            }

          }
        );

      },
      {
        threshold:.65
      }
    );


  videos.forEach(
    video=>{
      observer.observe(video);
    }
  );

}


/* ==============================
   START
============================== */

loadVideos();

</script>

</body>
</html>
