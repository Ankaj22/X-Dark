<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>X-Dark</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  border:0;
  background:none;
  color:white;
  cursor:pointer;
}

/* APP */

#app{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
}

/* TOP BAR */

.topbar{
  position:fixed;
  z-index:30;
  top:0;
  left:0;
  right:0;

  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.65),
    transparent
  );
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#ff1744;
}

.topIcon{
  width:38px;
  height:38px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.10);
  backdrop-filter:blur(12px);
}

.topIcon svg{
  width:21px;
  height:21px;
}

/* FEED */

#feed{
  width:100%;
  height:100dvh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.videoCard{
  position:relative;
  width:100%;
  height:100dvh;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  overflow:hidden;
  background:#050505;
}

.video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  background:#000;
}

/* GRADIENT */

.videoCard:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.78) 0%,
      rgba(0,0,0,.25) 30%,
      transparent 62%
    );
}

/* USER INFO */

.info{
  position:absolute;
  z-index:10;

  left:15px;
  right:90px;
  bottom:86px;
}

.userRow{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:9px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;

  background:linear-gradient(135deg,#ff1744,#7c4dff);

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
  font-size:14px;

  border:2px solid rgba(255,255,255,.9);
}

.username{
  font-size:15px;
  font-weight:800;
}

.followBtn{
  padding:5px 10px;
  border:1px solid rgba(255,255,255,.7);
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.caption{
  font-size:14px;
  line-height:1.35;
  margin-bottom:7px;
}

.music{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:12px;
  opacity:.9;
}

/* RIGHT ACTIONS */

.actions{
  position:absolute;
  z-index:15;

  right:10px;
  bottom:82px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:18px;
}

.action{
  width:48px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.actionButton{
  width:43px;
  height:43px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:rgba(0,0,0,.18);
  backdrop-filter:blur(8px);

  transition:.18s;
}

.actionButton:active{
  transform:scale(.82);
}

.actionButton svg{
  width:25px;
  height:25px;

  fill:none;
  stroke:white;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.count{
  font-size:11px;
  font-weight:700;
}

.like.active svg{
  fill:#ff1744;
  stroke:#ff1744;
}

.bookmark.active svg{
  fill:white;
}

.profileAction{
  position:relative;
}

.profileAction .avatar{
  width:43px;
  height:43px;
}

.plus{
  position:absolute;

  right:-2px;
  bottom:-3px;

  width:17px;
  height:17px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ff1744;

  font-size:14px;
  font-weight:900;

  border:2px solid #000;
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  z-index:40;

  bottom:0;
  left:0;
  right:0;

  height:65px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:linear-gradient(
    to top,
    rgba(0,0,0,.82),
    transparent
  );

  padding-bottom:5px;
}

.navItem{
  width:50px;
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.navItem svg{
  width:24px;
  height:24px;

  fill:none;
  stroke:#fff;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.uploadBtn{
  width:46px;
  height:34px;

  border-radius:11px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
  color:#000;
}

.uploadBtn svg{
  stroke:#000;
  width:23px;
  height:23px;
}

/* UPLOAD */

#uploadInput{
  display:none;
}

/* LOADING */

#loading{
  position:fixed;
  z-index:100;

  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
}

.loader{
  width:42px;
  height:42px;

  border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* LOGIN */

#loginScreen{
  position:fixed;
  z-index:200;

  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  padding:25px;

  background:
    radial-gradient(circle at top,#241020,#050505 55%);
}

.loginBox{
  width:100%;
  max-width:380px;

  padding:28px 22px;

  border-radius:24px;

  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);

  backdrop-filter:blur(20px);
}

.loginBox h1{
  font-size:30px;
  margin-bottom:6px;
}

.loginBox p{
  color:#aaa;
  font-size:13px;
  margin-bottom:22px;
}

.input{
  width:100%;

  height:48px;

  margin-bottom:10px;
  padding:0 14px;

  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);

  outline:none;

  background:rgba(255,255,255,.08);
  color:white;
}

.loginButton{
  width:100%;
  height:48px;

  border-radius:12px;

  background:#fff;
  color:#000;

  font-weight:800;
}

.googleButton{
  width:100%;
  height:48px;

  margin-top:10px;

  border-radius:12px;

  background:#181818;

  border:1px solid #333;

  font-weight:700;
}

/* COMMENTS */

#commentSheet{
  position:fixed;
  z-index:150;

  left:0;
  right:0;
  bottom:0;

  height:min(72dvh,620px);

  background:#111;

  border-radius:24px 24px 0 0;

  transform:translateY(105%);

  transition:transform .28s cubic-bezier(.2,.8,.2,1);

  box-shadow:0 -10px 40px rgba(0,0,0,.55);

  display:flex;
  flex-direction:column;
}

#commentSheet.open{
  transform:translateY(0);
}

.commentHeader{
  height:58px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  border-bottom:1px solid rgba(255,255,255,.08);
}

.commentHeader:before{
  content:"";

  position:absolute;
  top:8px;

  width:38px;
  height:4px;

  border-radius:10px;

  background:#555;
}

.commentTitle{
  font-size:15px;
  font-weight:800;
}

.closeComments{
  position:absolute;
  right:14px;

  width:35px;
  height:35px;

  border-radius:50%;

  background:#222;

  font-size:20px;
}

#commentsList{
  flex:1;

  overflow-y:auto;

  padding:12px 15px 20px;
}

.comment{
  display:flex;
  gap:10px;

  margin-bottom:18px;
}

.commentAvatar{
  flex-shrink:0;

  width:34px;
  height:34px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(135deg,#ff1744,#651fff);

  font-size:12px;
  font-weight:800;
}

.commentBody{
  flex:1;
}

.commentUser{
  font-size:12px;
  color:#aaa;
  font-weight:700;

  margin-bottom:3px;
}

.commentText{
  font-size:14px;
  line-height:1.35;
}

.emptyComments{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:50px 20px;
}

/* COMMENT INPUT */

.commentInputArea{
  flex-shrink:0;

  display:flex;
  gap:8px;

  padding:10px 12px;

  padding-bottom:max(10px,env(safe-area-inset-bottom));

  border-top:1px solid rgba(255,255,255,.08);

  background:#111;
}

#commentInput{
  flex:1;

  height:43px;

  border:1px solid #292929;

  border-radius:22px;

  padding:0 15px;

  outline:none;

  background:#1c1c1c;
  color:white;

  font-size:14px;
}

#sendComment{
  width:43px;
  height:43px;

  flex-shrink:0;

  border-radius:50%;

  background:#fff;
  color:#000;

  display:flex;
  align-items:center;
  justify-content:center;
}

#sendComment svg{
  width:20px;
  height:20px;

  fill:none;
  stroke:#000;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* OVERLAY */

#sheetOverlay{
  position:fixed;
  z-index:140;

  inset:0;

  background:rgba(0,0,0,.55);

  opacity:0;
  pointer-events:none;

  transition:.25s;
}

#sheetOverlay.show{
  opacity:1;
  pointer-events:auto;
}

/* TOAST */

#toast{
  position:fixed;
  z-index:300;

  left:50%;
  bottom:85px;

  transform:translateX(-50%) translateY(20px);

  padding:10px 15px;

  border-radius:12px;

  background:rgba(20,20,20,.92);

  font-size:13px;

  opacity:0;
  pointer-events:none;

  transition:.25s;

  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div id="app">

  <!-- TOP -->

  <div class="topbar">

    <div class="logo">
      X<span>-Dark</span>
    </div>

    <button class="topIcon" onclick="showToast('Search coming soon')">

      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

    </button>

  </div>


  <!-- FEED -->

  <main id="feed"></main>


  <!-- BOTTOM NAV -->

  <nav class="bottomNav">

    <button class="navItem">

      <svg viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v11h14V9"></path>
        <path d="M9 20v-6h6v6"></path>
      </svg>

    </button>


    <button class="navItem">

      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

    </button>


    <label class="navItem">

      <div class="uploadBtn">

        <svg viewBox="0 0 24 24">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>

      </div>

      <input id="uploadInput"
             type="file"
             accept="video/mp4,video/webm,video/quicktime">

    </label>


    <button class="navItem">

      <svg viewBox="0 0 24 24">
        <path d="M20 21a8 8 0 0 0-16 0"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>

    </button>


    <button class="navItem">

      <svg viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
        <path d="M20 4v6h-6"></path>
      </svg>

    </button>

  </nav>

</div>


<!-- LOADING -->

<div id="loading">
  <div class="loader"></div>
</div>


<!-- LOGIN -->

<div id="loginScreen">

  <div class="loginBox">

    <h1>Welcome to X-Dark</h1>

    <p>Login to continue</p>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button
      class="loginButton"
      onclick="login()">
      Login
    </button>

    <button
      class="googleButton"
      onclick="googleLogin()">
      Continue with Google
    </button>

  </div>

</div>


<!-- COMMENT OVERLAY -->

<div id="sheetOverlay"
     onclick="closeComments()">
</div>


<!-- COMMENTS -->

<section id="commentSheet">

  <div class="commentHeader">

    <div class="commentTitle">
      Comments
    </div>

    <button
      class="closeComments"
      onclick="closeComments()">
      ×
    </button>

  </div>


  <div id="commentsList">
  </div>


  <div class="commentInputArea">

    <input
      id="commentInput"
      type="text"
      maxlength="500"
      placeholder="Add a comment..."
    >

    <button
      id="sendComment"
      onclick="sendComment()">

      <svg viewBox="0 0 24 24">
        <path d="M22 2 11 13"></path>
        <path d="m22 2-7 20-4-9-9-4Z"></path>
      </svg>

    </button>

  </div>

</section>


<div id="toast"></div>


<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  doc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
  "darkwing-a717a.firebaseapp.com",

  projectId:
  "darkwing-a717a",

  storageBucket:
  "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
  "352453390196",

  appId:
  "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
  "G-5RVX9NET3W"
};


/* CLOUDINARY */

const CLOUD_NAME = "lrpb7uuy";

const UPLOAD_PRESET = "x_dark_videos";

const CLOUDINARY_URL =
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* INIT */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* GLOBAL */

let currentUser = null;

let activeVideoId = null;


/* AUTH */

onAuthStateChanged(auth,(user)=>{

  currentUser = user;

  if(user){

    document.getElementById("loginScreen").style.display="none";

  }else{

    document.getElementById("loginScreen").style.display="flex";

  }

  loadVideos();

});


/* LOGIN */

window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    showToast("Enter email and password");

    return;
  }

  try{

    showLoading(true);

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    showToast(error.message);

  }finally{

    showLoading(false);

  }

};


/* GOOGLE LOGIN */

window.googleLogin = async function(){

  try{

    showLoading(true);

    const provider =
      new GoogleAuthProvider();

    await signInWithPopup(
      auth,
      provider
    );

  }catch(error){

    showToast(error.message);

  }finally{

    showLoading(false);

  }

};


/* LOAD VIDEOS */

async function loadVideos(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML="";

  try{

    const q = query(
      collection(db,"videos"),
      orderBy("createdAt","desc")
    );

    const snapshot =
      await getDocs(q);

    if(snapshot.empty){

      createDemo();

      return;
    }

    snapshot.forEach(item=>{

      createVideoCard(
        item.id,
        item.data()
      );

    });

    activateVideos();

  }catch(error){

    console.error(error);

    createDemo();

  }

}


/* CREATE VIDEO */

function createVideoCard(id,data){

  const feed =
    document.getElementById("feed");

  const card =
    document.createElement("article");

  card.className="videoCard";

  const username =
    data.username ||
    data.userEmail ||
    "X-Dark User";

  const initials =
    username
      .replace("@","")
      .slice(0,2)
      .toUpperCase();

  const likes =
    Number(data.likes || 0);

  const comments =
    Number(data.comments || 0);

  card.innerHTML=`

    <video
      class="video"
      src="${data.url}"
      loop
      playsinline
      preload="metadata">
    </video>


    <div class="info">

      <div class="userRow">

        <div class="avatar">
          ${initials}
        </div>

        <div class="username">
          @${escapeHTML(username.replace("@",""))}
        </div>

        <button
          class="followBtn"
          onclick="toggleFollow(this)">
          Follow
        </button>

      </div>


      <div class="caption">
        ${escapeHTML(data.caption || "Welcome to X-Dark")}
      </div>


      <div class="music">
        ♫ Original audio
      </div>

    </div>


    <div class="actions">

      <div class="action profileAction">

        <button
          class="avatar"
          onclick="showToast('Profile coming soon')">
          ${initials}
        </button>

        <div class="plus">+</div>

      </div>


      <!-- LIKE -->

      <div class="action">

        <button
          class="actionButton like"
          data-id="${id}"
          onclick="likeVideo(this)">

          <svg viewBox="0 0 24 24">
            <path d="
              M20.8 8.7
              C20.8 5.7 18.5 3.5 15.6 3.5
              C13.9 3.5 12.5 4.4 11.7 5.7
              C10.9 4.4 9.5 3.5 7.8 3.5
              C4.9 3.5 2.6 5.7 2.6 8.7
              C2.6 13.4 7.4 17.1 12 20.5
              C16 17.1 20.8 13.4 20.8 8.7Z">
            </path>
          </svg>

        </button>

        <span
          class="count likeCount">
          ${formatCount(likes)}
        </span>

      </div>


      <!-- COMMENTS -->

      <div class="action">

        <button
          class="actionButton"
          onclick="openComments('${id}')">

          <svg viewBox="0 0 24 24">
            <path d="
              M20 11.5
              a7.5 7.5 0 0 1-7.5 7.5
              H8l-4 3
              1.3-4.3
              A7.5 7.5 0 1 1 20 11.5Z">
            </path>
          </svg>

        </button>

        <span
          class="count commentCount">
          ${formatCount(comments)}
        </span>

      </div>


      <!-- SAVE -->

      <div class="action">

        <button
          class="actionButton bookmark"
          onclick="toggleBookmark(this)">

          <svg viewBox="0 0 24 24">
            <path d="
              M6 4.5
              A2.5 2.5 0 0 1 8.5 2h7
              A2.5 2.5 0 0 1 18 4.5V21l-6-3.5L6 21Z">
            </path>
          </svg>

        </button>

      </div>


      <!-- SHARE -->

      <div class="action">

        <button
          class="actionButton"
          onclick="shareVideo('${id}')">

          <svg viewBox="0 0 24 24">
            <circle cx="18" cy="5" r="2.5"></circle>
            <circle cx="6" cy="12" r="2.5"></circle>
            <circle cx="18" cy="19" r="2.5"></circle>

            <path d="m8.2 10.8 7.5-4.2"></path>
            <path d="m8.2 13.2 7.5 4.2"></path>
          </svg>

        </button>

      </div>

    </div>

  `;

  feed.appendChild(card);

}


/* DEMO */

function createDemo(){

  const demo={

    url:
    "https://cdn.coverr.co/videos/coverr-a-woman-walking-in-the-city-1573/1080p.mp4",

    username:"x_dark",

    caption:"Welcome to X-Dark 🚀",

    likes:128,

    comments:12

  };

  createVideoCard(
    "demo",
    demo
  );

  activateVideos();

}


/* LIKE */

window.likeVideo = async function(button){

  if(!currentUser){

    showToast("Please login first");

    return;
  }

  if(button.classList.contains("active"))
    return;

  const id =
    button.dataset.id;

  button.classList.add("active");

  const card =
    button.closest(".videoCard");

  const count =
    card.querySelector(".likeCount");

  let number =
    parseInt(count.innerText.replace(/[^\d]/g,"")) || 0;

  number++;

  count.innerText =
    formatCount(number);

  try{

    await updateDoc(
      doc(db,"videos",id),
      {
        likes:increment(1)
      }
    );

  }catch(error){

    console.error(error);

  }

};


/* COMMENTS OPEN */

window.openComments = async function(id){

  activeVideoId=id;

  const sheet =
    document.getElementById("commentSheet");

  const overlay =
    document.getElementById("sheetOverlay");

  sheet.classList.add("open");

  overlay.classList.add("show");

  document.getElementById("commentInput").focus();

  await loadComments(id);

};


/* CLOSE */

window.closeComments=function(){

  document
    .getElementById("commentSheet")
    .classList.remove("open");

  document
    .getElementById("sheetOverlay")
    .classList.remove("show");

  activeVideoId=null;

};


/* LOAD COMMENTS */

async function loadComments(videoId){

  const list =
    document.getElementById("commentsList");

  list.innerHTML=
    `<div class="emptyComments">Loading comments...</div>`;

  try{

    const commentsRef =
      collection(
        db,
        "videos",
        videoId,
        "comments"
      );

    const q =
      query(
        commentsRef,
        orderBy("createdAt","asc")
      );

    const snapshot =
      await getDocs(q);

    list.innerHTML="";

    if(snapshot.empty){

      list.innerHTML=
        `<div class="emptyComments">
          No comments yet.<br>
          Be the first to comment ✨
        </div>`;

      return;
    }

    snapshot.forEach(item=>{

      const data =
        item.data();

      addCommentToUI(data);

    });

  }catch(error){

    console.error(error);

    list.innerHTML=
      `<div class="emptyComments">
        Unable to load comments
      </div>`;

  }

}


/* ADD COMMENT UI */

function addCommentToUI(data){

  const list =
    document.getElementById("commentsList");

  const username =
    data.username ||
    data.userEmail ||
    "User";

  const initials =
    username
      .replace("@","")
      .slice(0,2)
      .toUpperCase();

  const div =
    document.createElement("div");

  div.className="comment";

  div.innerHTML=`

    <div class="commentAvatar">
      ${escapeHTML(initials)}
    </div>

    <div class="commentBody">

      <div class="commentUser">
        @${escapeHTML(username.replace("@",""))}
      </div>

      <div class="commentText">
        ${escapeHTML(data.text || "")}
      </div>

    </div>

  `;

  list.appendChild(div);

  list.scrollTop =
    list.scrollHeight;

}


/* SEND COMMENT */

window.sendComment = async function(){

  if(!currentUser){

    showToast("Please login first");

    return;
  }

  if(!activeVideoId){

    return;
  }

  const input =
    document.getElementById("commentInput");

  const text =
    input.value.trim();

  if(!text){

    return;
  }

  try{

    const username =
      currentUser.displayName ||
      currentUser.email?.split("@")[0] ||
      "User";

    const commentData={

      userId:
        currentUser.uid,

      username:
        username,

      userEmail:
        currentUser.email || "",

      text:
        text,

      createdAt:
        serverTimestamp()

    };


    /* SAVE COMMENT */

    await addDoc(
      collection(
        db,
        "videos",
        activeVideoId,
        "comments"
      ),
      commentData
    );


    /* UPDATE COMMENT COUNT */

    await updateDoc(
      doc(db,"videos",activeVideoId),
      {
        comments:increment(1)
      }
    );


    /* SHOW COMMENT */

    addCommentToUI({
      ...commentData,
      createdAt:new Date()
    });


    input.value="";


    /* UPDATE FEED COUNT */

    const card =
      document.querySelector(
        `.videoCard`
      );

    document
      .querySelectorAll(".videoCard")
      .forEach(c=>{

        const commentButton =
          c.querySelector(
            '[onclick*="' +
            activeVideoId +
            '"]'
          );

        if(commentButton){

          const count =
            c.querySelector(".commentCount");

          let n =
            parseInt(
              count.innerText.replace(/[^\d]/g,"")
            ) || 0;

          count.innerText =
            formatCount(n+1);

        }

      });


    showToast("Comment added ✓");

  }catch(error){

    console.error(error);

    showToast("Comment failed");

  }

};


/* ENTER TO SEND */

document
  .getElementById("commentInput")
  .addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){

      sendComment();

    }

  });


/* BOOKMARK */

window.toggleBookmark=function(button){

  button.classList.toggle("active");

  if(button.classList.contains("active")){

    showToast("Saved");

  }else{

    showToast("Removed from saved");

  }

};


/* FOLLOW */

window.toggleFollow=function(button){

  if(button.innerText==="Follow"){

    button.innerText="Following";

    showToast("Following");

  }else{

    button.innerText="Follow";

  }

};


/* SHARE */

window.shareVideo=async function(id){

  const url =
    location.origin +
    location.pathname +
    "?video=" +
    id;

  try{

    if(navigator.share){

      await navigator.share({

        title:"X-Dark",

        text:"Watch this on X-Dark",

        url:url

      });

    }else{

      await navigator.clipboard.writeText(url);

      showToast("Link copied");

    }

  }catch(error){}

};


/* VIDEO AUTOPLAY */

function activateVideos(){

  const videos =
    document.querySelectorAll(".video");

  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const video =
            entry.target;

          if(entry.isIntersecting){

            videos.forEach(v=>{

              if(v!==video){

                v.pause();

              }

            });

            video.muted=false;

            video.play()
              .catch(()=>{

                video.muted=true;

                video.play().catch(()=>{});

              });

          }else{

            video.pause();

          }

        });

      },
      {
        threshold:.7
      }
    );

  videos.forEach(video=>{

    observer.observe(video);

  });

}


/* AUDIO UNLOCK */

document.addEventListener(
  "pointerdown",
  ()=>{

    document
      .querySelectorAll(".video")
      .forEach(video=>{

        if(
          video.paused === false &&
          video.muted
        ){

          video.muted=false;

          video.play().catch(()=>{});

        }

      });

  },
  {once:true}
);


/* UPLOAD */

document
  .getElementById("uploadInput")
  .addEventListener(
    "change",
    uploadVideo
  );


async function uploadVideo(event){

  if(!currentUser){

    showToast("Please login first");

    event.target.value="";

    return;
  }

  const file =
    event.target.files[0];

  if(!file)
    return;


  if(file.size > 100 * 1024 * 1024){

    showToast("Video must be under 100 MB");

    event.target.value="";

    return;
  }


  try{

    showLoading(true);


    const form =
      new FormData();

    form.append(
      "file",
      file
    );

    form.append(
      "upload_preset",
      UPLOAD_PRESET
    );


    /* CLOUDINARY */

    const response =
      await fetch(
        CLOUDINARY_URL,
        {
          method:"POST",
          body:form
        }
      );


    const result =
      await response.json();


    if(!result.secure_url){

      throw new Error(
        "Cloudinary upload failed"
      );

    }


    /* FIRESTORE */

    await addDoc(
      collection(db,"videos"),
      {

        url:
          result.secure_url,

        userId:
          currentUser.uid,

        username:
          currentUser.displayName ||
          currentUser.email?.split("@")[0] ||
          "User",

        userEmail:
          currentUser.email || "",

        caption:
          "New X-Dark video 🚀",

        likes:0,

        comments:0,

        createdAt:
          serverTimestamp()

      }
    );


    showToast("Video uploaded ✓");

    await loadVideos();


  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Upload failed"
    );

  }finally{

    showLoading(false);

    event.target.value="";

  }

}


/* HELPERS */

function formatCount(number){

  number =
    Number(number)||0;

  if(number >= 1000000){

    return(
      (number/1000000)
      .toFixed(1)
      .replace(".0","")+
      "M"
    );

  }

  if(number >= 1000){

    return(
      (number/1000)
      .toFixed(1)
      .replace(".0","")+
      "K"
    );

  }

  return number.toString();

}


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showLoading(show){

  document
    .getElementById("loading")
    .style.display =
      show ? "flex" : "none";

}


window.showToast=function(message){

  const toast =
    document.getElementById("toast");

  toast.innerText=message;

  toast.classList.add("show");

  setTimeout(()=>{

    toast.classList.remove("show");

  },1800);

};
