<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>X-Dark</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

html,body{
  background:#000;
  color:#fff;
  width:100%;
  min-height:100%;
}

body{
  overflow:hidden;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  width:100%;
  max-width:600px;
  height:100vh;
  margin:auto;
  background:#000;
  position:relative;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:70px;
  background:rgba(0,0,0,.97);
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  z-index:100;
}

.logo{
  font-size:29px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#ff1744;
}

.headerBtn{
  color:#fff;
  background:#171717;
  border:1px solid #333;
  border-radius:25px;
  padding:11px 19px;
  font-size:15px;
}

/* MAIN */

main{
  width:100%;
  height:100vh;
  padding-top:70px;
  padding-bottom:70px;
}

.page{
  display:none;
  width:100%;
  height:100%;
}

.page.active{
  display:block;
}

/* FEED */

.feed{
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
}

.videoCard{
  position:relative;
  width:100%;
  height:calc(100vh - 140px);
  min-height:500px;
  background:#000;
  overflow:hidden;
  scroll-snap-align:start;
}

/*
  IMPORTANT:
  contain = complete video frame visible.
  Nothing will be cropped.
*/

.videoCard video{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.videoOverlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    transparent 45%,
    rgba(0,0,0,.08) 60%,
    rgba(0,0,0,.88) 100%
  );
  z-index:2;
}

/* PLAY */

.playBtn{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:65px;
  height:65px;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:26px;
  z-index:20;
  display:none;
}

/* SOUND */

.soundBtn{
  position:absolute;
  right:15px;
  top:15px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:20px;
  z-index:20;
}

/* VIDEO INFO */

.videoInfo{
  position:absolute;
  left:20px;
  right:90px;
  bottom:25px;
  z-index:10;
}

.username{
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
}

.caption{
  font-size:16px;
  line-height:1.4;
  margin-bottom:14px;
}

.followBtn{
  background:#ff1744;
  color:#fff;
  padding:10px 18px;
  border-radius:22px;
  font-weight:bold;
}

/* ACTIONS */

.actions{
  position:absolute;
  right:8px;
  bottom:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
  z-index:30;
}

.action{
  width:60px;
  min-height:60px;
  background:transparent;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.action small{
  font-size:12px;
  color:#fff;
  margin-top:3px;
}

.likeIcon{
  transition:.15s;
}

.likeBtn.liked .likeIcon{
  transform:scale(1.12);
}

/* EMPTY */

.empty{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
}

.empty h2{
  color:#aaa;
  margin-bottom:8px;
}

/* AUTH */

.authBox{
  padding:40px 22px;
  overflow-y:auto;
  height:100%;
}

.authBox h1{
  font-size:36px;
  margin-bottom:8px;
}

.authBox p{
  color:#999;
  font-size:18px;
  margin-bottom:28px;
}

.input{
  width:100%;
  height:55px;
  margin-bottom:14px;
  padding:0 17px;
  border-radius:14px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  font-size:16px;
  outline:none;
}

.input:focus{
  border-color:#ff1744;
}

.primary{
  width:100%;
  height:55px;
  border-radius:14px;
  background:#ff1744;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  margin-bottom:14px;
}

.google{
  width:100%;
  height:55px;
  border-radius:14px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:bold;
}

.switch{
  text-align:center;
  margin-top:24px;
  color:#999;
  font-size:16px;
}

.switch span{
  color:#ff1744;
  font-weight:bold;
  cursor:pointer;
}

/* UPLOAD */

.uploadBox{
  padding:35px 20px;
  height:100%;
  overflow-y:auto;
}

.uploadBox h2{
  font-size:28px;
  margin-bottom:25px;
}

.fileInput{
  width:100%;
  padding:16px;
  background:#151515;
  border:1px dashed #555;
  border-radius:13px;
  color:#fff;
  margin-bottom:15px;
}

.progress{
  width:100%;
  height:8px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progressBar{
  height:100%;
  width:0%;
  background:#ff1744;
}

.status{
  color:#999;
  font-size:14px;
}

/* PROFILE */

.profile{
  height:100%;
  padding:45px 20px;
  text-align:center;
  overflow-y:auto;
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#ff1744;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:25px auto 18px;
  font-size:42px;
  font-weight:bold;
}

.profile h2{
  font-size:26px;
  margin-bottom:8px;
}

.profile p{
  color:#888;
  font-size:16px;
}

.logoutBtn{
  width:100%;
  padding:16px;
  margin-top:30px;
  background:#181818;
  border:1px solid #333;
  color:#fff;
  border-radius:13px;
  font-size:16px;
}

/* NAV */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:70px;
  background:rgba(0,0,0,.98);
  border-top:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:100;
}

.navBtn{
  background:none;
  color:#777;
  font-size:30px;
}

.navBtn.active{
  color:#ff1744;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 20px;
  border-radius:25px;
  display:none;
  z-index:500;
  font-size:14px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">X-<span>DARK</span></div>
  <button id="authHeaderBtn" class="headerBtn">
    Login
  </button>
</header>

<main>

<!-- HOME -->

<section id="homePage" class="page active">

  <div id="feed" class="feed">

    <div class="empty">
      <h2>Loading X-Dark...</h2>
    </div>

  </div>

</section>


<!-- LOGIN -->

<section id="loginPage" class="page">

  <div class="authBox">

    <h1>Welcome Back</h1>

    <p>Login to X-Dark</p>

    <input
      id="loginEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button id="loginBtn" class="primary">
      Login
    </button>

    <button id="googleBtn" class="google">
      🔵 Continue with Google
    </button>

    <div class="switch">
      Don't have an account?
      <span id="showSignup">
        Sign up
      </span>
    </div>

  </div>

</section>


<!-- SIGNUP -->

<section id="signupPage" class="page">

  <div class="authBox">

    <h1>Create Account</h1>

    <p>Join X-Dark</p>

    <input
      id="signupName"
      class="input"
      type="text"
      placeholder="Username"
    >

    <input
      id="signupEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="signupPassword"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button id="signupBtn" class="primary">
      Create Account
    </button>

    <div class="switch">
      Already have an account?
      <span id="showLogin">
        Login
      </span>
    </div>

  </div>

</section>


<!-- UPLOAD -->

<section id="uploadPage" class="page">

  <div class="uploadBox">

    <h2>Upload Video 🎬</h2>

    <input
      id="videoFile"
      class="fileInput"
      type="file"
      accept="video/*"
    >

    <input
      id="caption"
      class="input"
      type="text"
      maxlength="150"
      placeholder="Write a caption..."
    >

    <button id="uploadBtn" class="primary">
      Upload to X-Dark
    </button>

    <div class="progress">
      <div
        id="progressBar"
        class="progressBar"
      ></div>
    </div>

    <div id="uploadStatus" class="status">
      Maximum video size: 100 MB
    </div>

  </div>

</section>


<!-- PROFILE -->

<section id="profilePage" class="page">

  <div class="profile">

    <div id="avatar" class="avatar">
      ?
    </div>

    <h2 id="profileName">
      Guest
    </h2>

    <p id="profileEmail">
      Not logged in
    </p>

    <button id="logoutBtn" class="logoutBtn">
      Logout
    </button>

  </div>

</section>

</main>


<nav>

  <button
    class="navBtn active"
    data-page="homePage"
  >
    ⌂
  </button>

  <button
    class="navBtn"
    data-page="uploadPage"
  >
    ＋
  </button>

  <button
    class="navBtn"
    data-page="profilePage"
  >
    ♙
  </button>

</nav>

<div id="toast"></div>

</div>


<script type="module">

/* FIREBASE */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  getDoc,
  query,
  orderBy,
  serverTimestamp,
  doc,
  setDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
  "darkwing-a717a.firebaseapp.com",

  projectId:
  "darkwing-a717a",

  storageBucket:
  "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
  "352453390196",

  appId:
  "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
  "G-5RVX9NET3W"
};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* CLOUDINARY */

const CLOUD_NAME =
"lrpb7uuy";

const UPLOAD_PRESET =
"x_dark_videos";

const UPLOAD_URL =
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* HELPERS */

const $ =
id => document.getElementById(id);


function toast(message){

  const t =
  $("toast");

  t.textContent =
  message;

  t.style.display =
  "block";

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
  setTimeout(
    ()=>{
      t.style.display =
      "none";
    },
    2500
  );
}


/* PAGE */

function showPage(id){

  document
  .querySelectorAll(".page")
  .forEach(
    p =>
    p.classList.remove("active")
  );


  $(id)
  .classList.add("active");


  document
  .querySelectorAll(".navBtn")
  .forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.page === id
    );

  });

}


/* NAV */

document
.querySelectorAll(".navBtn")
.forEach(btn=>{

  btn.onclick =
  ()=>{

    const page =
    btn.dataset.page;


    if(
      page === "uploadPage" &&
      !auth.currentUser
    ){

      toast(
        "Login required to upload"
      );

      showPage(
        "loginPage"
      );

      return;
    }


    showPage(page);

  };

});


$("authHeaderBtn").onclick =
()=>{

  showPage(
    auth.currentUser
    ? "profilePage"
    : "loginPage"
  );

};


/* SIGNUP */

$("signupBtn").onclick =
async ()=>{

  const name =
  $("signupName").value.trim();

  const email =
  $("signupEmail").value.trim();

  const password =
  $("signupPassword").value;


  if(
    !name ||
    !email ||
    !password
  ){

    toast(
      "Fill all fields"
    );

    return;
  }


  if(
    password.length < 6
  ){

    toast(
      "Password must be 6+ characters"
    );

    return;
  }


  try{

    const result =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );


    toast(
      "Account created 🎉"
    );


    showPage(
      "homePage"
    );


  }catch(error){

    console.error(error);

    toast(
      friendlyError(error)
    );

  }

};


/* LOGIN */

$("loginBtn").onclick =
async ()=>{

  const email =
  $("loginEmail").value.trim();

  const password =
  $("loginPassword").value;


  if(
    !email ||
    !password
  ){

    toast(
      "Enter email and password"
    );

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    toast(
      "Login successful ✅"
    );


    showPage(
      "homePage"
    );


  }catch(error){

    console.error(error);

    toast(
      friendlyError(error)
    );

  }

};


/* GOOGLE */

$("googleBtn").onclick =
async ()=>{

  try{

    const provider =
    new GoogleAuthProvider();


    await signInWithPopup(
      auth,
      provider
    );


    toast(
      "Google login successful ✅"
    );


    showPage(
      "homePage"
    );


  }catch(error){

    console.error(error);

    toast(
      friendlyError(error)
    );

  }

};


/* SWITCH */

$("showSignup").onclick =
()=>showPage(
  "signupPage"
);


$("showLogin").onclick =
()=>showPage(
  "loginPage"
);


/* AUTH */

onAuthStateChanged(
  auth,
  user=>{

    if(user){

      $("authHeaderBtn")
      .textContent =
      "Profile";


      const name =
      user.displayName ||
      "X-Dark User";


      $("profileName")
      .textContent =
      name;


      $("profileEmail")
      .textContent =
      user.email || "";


      $("avatar")
      .textContent =
      name.charAt(0)
      .toUpperCase();

    }else{

      $("authHeaderBtn")
      .textContent =
      "Login";


      $("profileName")
      .textContent =
      "Guest";


      $("profileEmail")
      .textContent =
      "Not logged in";


      $("avatar")
      .textContent =
      "?";

    }

  }
);


/* LOGOUT */

$("logoutBtn").onclick =
async ()=>{

  await signOut(auth);

  toast(
    "Logged out"
  );

  showPage(
    "homePage"
  );

};


/* CLOUDINARY UPLOAD */

$("uploadBtn").onclick =
()=>{

  if(!auth.currentUser){

    toast(
      "Login required"
    );

    showPage(
      "loginPage"
    );

    return;
  }


  const file =
  $("videoFile").files[0];

  const caption =
  $("caption").value.trim();


  if(!file){

    toast(
      "Select a video"
    );

    return;
  }


  if(
    file.size >
    100 * 1024 * 1024
  ){

    toast(
      "Video must be under 100 MB"
    );

    return;
  }


  const form =
  new FormData();


  form.append(
    "file",
    file
  );


  form.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  const xhr =
  new XMLHttpRequest();


  xhr.open(
    "POST",
    UPLOAD_URL
  );


  xhr.upload.onprogress =
  e=>{

    if(e.lengthComputable){

      const percent =
      Math.round(
        e.loaded /
        e.total *
        100
      );


      $("progressBar")
      .style.width =
      percent + "%";


      $("uploadStatus")
      .textContent =
      `Uploading ${percent}%`;

    }

  };


  xhr.onload =
  async ()=>{

    if(
      xhr.status >= 200 &&
      xhr.status < 300
    ){

      try{

        const data =
        JSON.parse(
          xhr.responseText
        );


        await addDoc(
          collection(
            db,
            "videos"
          ),
          {

            videoUrl:
            data.secure_url,

            caption:
            caption,

            username:
            auth.currentUser
            .displayName ||
            "X-Dark User",

            userId:
            auth.currentUser.uid,

            comments:
            0,

            createdAt:
            serverTimestamp()

          }
        );


        $("progressBar")
        .style.width =
        "100%";


        $("uploadStatus")
        .textContent =
        "Upload complete ✅";


        $("videoFile")
        .value = "";


        $("caption")
        .value = "";


        toast(
          "Video uploaded 🎉"
        );


        await loadVideos();


        setTimeout(
          ()=>{
            showPage(
              "homePage"
            );
          },
          500
        );


      }catch(error){

        console.error(error);

        toast(
          "Could not save video"
        );

      }

    }else{

      toast(
        "Cloudinary upload failed"
      );

    }

  };


  xhr.onerror =
  ()=>toast(
    "Network error"
  );


  xhr.send(form);

};


/* LOAD FEED */

async function loadVideos(){

  const feed =
  $("feed");


  try{

    const q =
    query(
      collection(
        db,
        "videos"
      ),
      orderBy(
        "createdAt",
        "desc"
      )
    );


    const snapshot =
    await getDocs(q);


    if(
      snapshot.empty
    ){

      feed.innerHTML = `
        <div class="empty">
          <h2>No videos yet</h2>
          <p>Be the first to upload 🚀</p>
        </div>
      `;

      return;
    }


    feed.innerHTML = "";


    for(
      const item
      of snapshot.docs
    ){

      await createVideo(
        item.id,
        item.data()
      );

    }


    activateVideos();


  }catch(error){

    console.error(
      error
    );


    feed.innerHTML = `
      <div class="empty">
        <h2>Feed unavailable</h2>
        <p>Firestore rules need to allow access.</p>
      </div>
    `;

  }

}


/* CREATE VIDEO */

async function createVideo(
  videoId,
  data
){

  const card =
  document.createElement(
    "div"
  );

  card.className =
  "videoCard";


  const video =
  document.createElement(
    "video"
  );

  video.src =
  data.videoUrl;

  video.loop =
  true;

  video.muted =
  true;

  video.playsInline =
  true;

  video.preload =
  "metadata";


  const overlay =
  document.createElement(
    "div"
  );

  overlay.className =
  "videoOverlay";


  const play =
  document.createElement(
    "button"
  );

  play.className =
  "playBtn";

  play.textContent =
  "▶";


  const sound =
  document.createElement(
    "button"
  );

  sound.className =
  "soundBtn";

  sound.textContent =
  "🔇";


  const info =
  document.createElement(
    "div"
  );

  info.className =
  "videoInfo";


  const username =
  document.createElement(
    "div"
  );

  username.className =
  "username";

  username.textContent =
  "@" +
  (
    data.username ||
    "user"
  );


  const caption =
  document.createElement(
    "div"
  );

  caption.className =
  "caption";

  caption.textContent =
  data.caption ||
  "";


  const follow =
  document.createElement(
    "button"
  );

  follow.className =
  "followBtn";

  follow.textContent =
  "Follow";


  info.append(
    username,
    caption,
    follow
  );


  /* ACTIONS */

  const actions =
  document.createElement(
    "div"
  );

  actions.className =
  "actions";


  /* LIKE */

  const like =
  document.createElement(
    "button"
  );

  like.className =
  "action likeBtn";


  const heart =
  document.createElement(
    "span"
  );

  heart.className =
  "likeIcon";

  heart.textContent =
  "🤍";


  const count =
  document.createElement(
    "small"
  );

  count.textContent =
  "0";


  like.append(
    heart,
    count
  );


  /* COMMENT */

  const comment =
  document.createElement(
    "button"
  );

  comment.className =
  "action";


  const commentIcon =
  document.createElement(
    "span"
  );

  commentIcon.textContent =
  "💬";


  const commentCount =
  document.createElement(
    "small"
  );

  commentCount.textContent =
  data.comments || 0;


  comment.append(
    commentIcon,
    commentCount
  );


  /* SHARE */

  const share =
  document.createElement(
    "button"
  );

  share.className =
  "action";


  const shareIcon =
  document.createElement(
    "span"
  );

  shareIcon.textContent =
  "↗️";


  const shareText =
  document.createElement(
    "small"
  );

  shareText.textContent =
  "Share";


  share.append(
    shareIcon,
    shareText
  );


  actions.append(
    like,
    comment,
    share
  );


  card.append(
    video,
    overlay,
    play,
    sound,
    info,
    actions
  );


  $("feed")
  .appendChild(card);


  /* PLAY */

  video.onclick =
  ()=>{

    if(video.paused){

      video.play()
      .then(()=>{
        play.style.display =
        "none";
      })
      .catch(()=>{});

    }else{

      video.pause();

      play.style.display =
      "block";

    }

  };


  play.onclick =
  ()=>{

    video.play()
    .then(()=>{
      play.style.display =
      "none";
    })
    .catch(()=>{});

  };


  /* SOUND */

  sound.onclick =
  ()=>{

    video.muted =
    !video.muted;

    sound.textContent =
    video.muted
    ? "🔇"
    : "🔊";

  };


  /* FIRESTORE LIKES */

  const likesRef =
  collection(
    db,
    "videos",
    videoId,
    "likes"
  );


  let liked =
  false;


  try{

    const snap =
    await getDocs(
      likesRef
    );


    count.textContent =
    snap.size;


    if(auth.currentUser){

      liked =
      snap.docs.some(
        d =>
        d.id ===
        auth.currentUser.uid
      );

    }


    updateLike(
      like,
      heart,
      liked
    );


  }catch(error){

    console.error(
      "Like load:",
      error
    );

  }


  /* LIKE CLICK */

  like.onclick =
  async ()=>{

    if(!auth.currentUser){

      toast(
        "Login to like ❤️"
      );

      showPage(
        "loginPage"
      );

      return;
    }


    const uid =
    auth.currentUser.uid;


    const ref =
    doc(
      db,
      "videos",
      videoId,
      "likes",
      uid
    );


    like.disabled =
    true;


    try{

      const existing =
      await getDoc(ref);


      if(existing.exists()){

        await deleteDoc(ref);

        liked =
        false;

        count.textContent =
        Math.max(
          0,
          Number(count.textContent)-1
        );


        updateLike(
          like,
          heart,
          false
        );


      }else{

        await setDoc(
          ref,
          {
            userId:uid,
            createdAt:
            serverTimestamp()
          }
        );


        liked =
        true;

        count.textContent =
        Number(count.textContent)+1;


        updateLike(
          like,
          heart,
          true
        );

      }

    }catch(error){

      console.error(
        error
      );

      toast(
        "Like failed"
      );

    }


    like.disabled =
    false;

  };


  /* COMMENT */

  comment.onclick =
  ()=>{

    if(!auth.currentUser){

      toast(
        "Login to comment"
      );

      showPage(
        "loginPage"
      );

      return;
    }


    toast(
      "Comments coming next 💬"
    );

  };


  /* SHARE */

  share.onclick =
  async ()=>{

    try{

      if(navigator.share){

        await navigator.share({

          title:"X-Dark",

          text:
          data.caption ||
          "Watch on X-Dark",

          url:
          data.videoUrl

        });

      }else{

        await navigator.clipboard
        .writeText(
          data.videoUrl
        );

        toast(
          "Link copied 🔗"
        );

      }

    }catch(e){}

  };


  /* FOLLOW */

  follow.onclick =
  ()=>{

    if(!auth.currentUser){

      toast(
        "Login to follow"
      );

      showPage(
        "loginPage"
      );

      return;
    }


    toast(
      "Follow system coming next"
    );

  };

}


/* LIKE UI */

function updateLike(
  button,
  heart,
  liked
){

  if(liked){

    heart.textContent =
    "❤️";

    button.classList.add(
      "liked"
    );

  }else{

    heart.textContent =
    "🤍";

    button.classList.remove(
      "liked"
    );

  }

}


/* AUTOPLAY */

function activateVideos(){

  const videos =
  document.querySelectorAll(
    ".videoCard video"
  );


  const observer =
  new IntersectionObserver(
    entries=>{

      entries.forEach(
        entry=>{

          const video =
          entry.target;

          const card =
          video.closest(
            ".videoCard"
          );

          const play =
          card.querySelector(
            ".playBtn"
          );


          if(
            entry.isIntersecting
          ){

            video.play()
            .then(()=>{
              play.style.display =
              "none";
            })
            .catch(()=>{
              play.style.display =
              "block";
            });

          }else{

            video.pause();

            play.style.display =
            "none";

          }

        }
      );

    },
    {
      threshold:.65
    }
  );


  videos.forEach(
    video =>
    observer.observe(video)
  );

}


/* ERRORS */

function friendlyError(error){

  const code =
  error?.code || "";


  if(
    code.includes(
      "invalid-credential"
    )
  )
    return "Email or password is incorrect";


  if(
    code.includes(
      "email-already-in-use"
    )
  )
    return "Email already registered";


  if(
    code.includes(
      "invalid-email"
    )
  )
    return "Invalid email";


  if(
    code.includes(
      "popup-closed"
    )
  )
    return "Google login cancelled";


  return (
    error?.message ||
    "Something went wrong"
  );

}


/* START */

loadVideos();

</script>
