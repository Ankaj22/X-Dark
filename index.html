<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X Dark</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{overflow:hidden}

.app{
  max-width:600px;
  height:100vh;
  margin:auto;
  position:relative;
  background:#050505;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #222;
  background:#050505;
}

header h1{
  font-size:22px;
  letter-spacing:2px;
}

.feed{
  height:calc(100vh - 130px);
  overflow-y:auto;
}

.reel{
  height:calc(100vh - 130px);
  min-height:500px;
  position:relative;
  background:#151515;
  overflow:hidden;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#111;
}

.empty-video{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
  color:#777;
  font-size:50px;
}

.empty-video span{
  font-size:15px;
}

.info{
  position:absolute;
  left:15px;
  right:80px;
  bottom:25px;
  z-index:4;
  text-shadow:0 2px 5px #000;
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.follow{
  color:#ff3158;
  margin-left:8px;
}

.caption{
  font-size:15px;
  line-height:1.5;
}

.actions{
  position:absolute;
  right:12px;
  bottom:25px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.action{
  border:0;
  background:none;
  color:#fff;
  font-size:28px;
}

.action small{
  display:block;
  font-size:11px;
  margin-top:3px;
}

.like.active{
  color:#ff3158;
}

.bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:#050505;
  border-top:1px solid #222;
  z-index:20;
}

.bottom button{
  border:0;
  background:none;
  color:#aaa;
  font-size:25px;
}

.bottom .active{
  color:#fff;
}

.add{
  width:50px;
  height:40px;
  border-radius:11px;
  background:#fff !important;
  color:#000 !important;
  font-size:29px !important;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.modal.open{
  display:flex;
}

.upload-box{
  width:100%;
  max-width:600px;
  padding:22px;
  background:#111;
  border-radius:22px 22px 0 0;
  border-top:1px solid #333;
}

.upload-box h2{
  margin-bottom:18px;
}

.close{
  float:right;
  border:0;
  background:none;
  color:#fff;
  font-size:28px;
}

.file-label{
  display:block;
  padding:18px;
  text-align:center;
  border:1px dashed #555;
  border-radius:14px;
  color:#bbb;
  margin-bottom:15px;
}

input[type=file]{
  display:none;
}

.preview{
  width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:12px;
  background:#000;
  display:none;
  margin-bottom:15px;
}

.caption-input{
  width:100%;
  padding:14px;
  border:1px solid #333;
  border-radius:12px;
  background:#080808;
  color:#fff;
  outline:none;
  margin-bottom:12px;
}

.publish{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#000;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>𝕏 DARK</h1>
</header>

<main class="feed" id="feed">

<section class="reel">

<div class="empty-video">
  🎬
  <span>No videos yet</span>
</div>

<div class="info">
  <div class="username">
    @xdark_official
    <span class="follow">Follow</span>
  </div>

  <div class="caption">
    Welcome to X Dark 🚀
  </div>
</div>

<div class="actions">

<button class="action like" onclick="like(this)">
  ♡
  <small>0</small>
</button>

<button class="action">
  💬
  <small>0</small>
</button>

<button class="action" onclick="sharePage()">
  ↗
  <small>Share</small>
</button>

</div>

</section>

</main>

<nav class="bottom">

<button class="active">⌂</button>
<button>⌕</button>

<button class="add" onclick="openUpload()">
  +
</button>

<button>♡</button>
<button>♙</button>

</nav>

</div>


<!-- UPLOAD MODAL -->

<div class="modal" id="uploadModal">

<div class="upload-box">

<button class="close" onclick="closeUpload()">×</button>

<h2>Create a video</h2>

<label class="file-label" for="videoInput">
  🎬 Select video
</label>

<input
  id="videoInput"
  type="file"
  accept="video/*"
>

<video
  id="preview"
  class="preview"
  controls
  playsinline>
</video>

<input
  id="caption"
  class="caption-input"
  type="text"
  maxlength="150"
  placeholder="Write a caption..."
>

<button
  class="publish"
  onclick="publishVideo()">
  Publish Video
</button>

</div>

</div>


<script>

const modal =
document.getElementById("uploadModal");

const videoInput =
document.getElementById("videoInput");

const preview =
document.getElementById("preview");

const feed =
document.getElementById("feed");

let selectedVideo = null;


/* OPEN UPLOAD */

function openUpload(){

modal.classList.add("open");

}


/* CLOSE UPLOAD */

function closeUpload(){

modal.classList.remove("open");

}


/* SELECT VIDEO */

videoInput.addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

if(!file.type.startsWith("video/")){

alert("Please select a video file.");

return;

}

if(file.size > 100 * 1024 * 1024){

alert("Video must be smaller than 100 MB.");

videoInput.value="";

return;

}

selectedVideo = file;

const url =
URL.createObjectURL(file);

preview.src = url;

preview.style.display="block";

});


/* PUBLISH */

function publishVideo(){

if(!selectedVideo){

alert("Please select a video first.");

return;

}

const url =
URL.createObjectURL(selectedVideo);

const caption =
document.getElementById("caption").value.trim();

const reel =
document.createElement("section");

reel.className="reel";

reel.innerHTML = `

<video
  src="${url}"
  controls
  playsinline
  loop>
</video>

<div class="info">

<div class="username">
  @you
  <span class="follow">Follow</span>
</div>

<div class="caption">
  ${escapeHTML(caption || "My new X Dark video 🔥")}
</div>

</div>

<div class="actions">

<button
class="action like"
onclick="like(this)">
♡
<small>0</small>
</button>

<button class="action">
💬
<small>0</small>
</button>

<button
class="action"
onclick="sharePage()">
↗
<small>Share</small>
</button>

</div>
`;

feed.prepend(reel);

closeUpload();

videoInput.value="";

preview.src="";

preview.style.display="none";

document.getElementById("caption").value="";

selectedVideo=null;

}


/* LIKE */

function like(button){

button.classList.toggle("active");

const counter =
button.querySelector("small");

let count =
Number(counter.textContent) || 0;

if(button.classList.contains("active")){

count++;

button.firstChild.textContent="♥";

}else{

count=Math.max(0,count-1);

button.firstChild.textContent="♡";

}

counter.textContent=count;

}


/* SHARE */

async function sharePage(){

try{

if(navigator.share){

await navigator.share({

title:"X Dark",
text:"Check this video on X Dark",
url:location.href

});

}else{

await navigator.clipboard.writeText(location.href);

alert("Link copied!");

}

}catch(e){}

}


/* SAFE TEXT */

function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
