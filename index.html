<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>X-DARK</title>

<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

button{
  border:0;
  outline:0;
  font-family:inherit;
  cursor:pointer;
}


/* =========================
   MAIN APP
========================= */

#app{
  position:fixed;
  inset:0;
  background:#000;
  overflow:hidden;
}


/* =========================
   TOP BAR
========================= */

.top-bar{

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:70px;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    env(safe-area-inset-top)
    18px
    0
    18px;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.75),
      rgba(0,0,0,.12),
      transparent
    );

  pointer-events:none;
}


.logo{

  pointer-events:auto;

  font-size:27px;

  font-weight:900;

  letter-spacing:-1.5px;

  text-shadow:
    0 2px 7px rgba(0,0,0,.8);
}


.logo-dark{
  color:#ff1744;
}


.login-btn{

  pointer-events:auto;

  padding:9px 18px;

  border-radius:25px;

  color:#fff;

  background:rgba(20,20,20,.72);

  border:1px solid rgba(255,255,255,.25);

  font-size:14px;

  backdrop-filter:blur(10px);
}


/* =========================
   FEED
========================= */

.feed{

  position:absolute;

  top:0;
  left:0;
  right:0;

  bottom:70px;

  overflow-y:auto;

  overflow-x:hidden;

  scroll-snap-type:y mandatory;

  scrollbar-width:none;

  background:#000;
}


.feed::-webkit-scrollbar{
  display:none;
}


/* =========================
   VIDEO CARD
========================= */

.video-card{

  position:relative;

  width:100%;

  height:100%;

  min-height:100%;

  overflow:hidden;

  background:#000;

  scroll-snap-align:start;

  scroll-snap-stop:always;
}


/* VIDEO */

.video-card video{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  display:block;

  background:#000;

  object-fit:cover;

  object-position:center center;
}


/* =========================
   VIDEO DARK GRADIENT
========================= */

.video-gradient{

  position:absolute;

  inset:0;

  z-index:2;

  pointer-events:none;

  background:

    linear-gradient(
      to bottom,
      rgba(0,0,0,.32) 0%,
      transparent 17%,
      transparent 62%,
      rgba(0,0,0,.15) 72%,
      rgba(0,0,0,.82) 100%
    );
}


/* =========================
   CENTER AUDIO BUTTON
========================= */

.audio-button{

  position:absolute;

  z-index:20;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  width:58px;

  height:58px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#fff;

  font-size:25px;

  background:rgba(0,0,0,.48);

  border:1px solid rgba(255,255,255,.25);

  backdrop-filter:blur(5px);

  box-shadow:
    0 5px 25px rgba(0,0,0,.35);
}


/* =========================
   PLAY BUTTON
========================= */

.play-button{

  position:absolute;

  z-index:21;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  width:58px;

  height:58px;

  border-radius:50%;

  display:none;

  align-items:center;

  justify-content:center;

  background:rgba(0,0,0,.65);

  color:#fff;

  font-size:22px;
}

.play-button.show{
  display:flex;
}


/* =========================
   RIGHT ACTION AREA
========================= */

.actions{

  position:absolute;

  z-index:15;

  right:12px;

  bottom:55px;

  width:55px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:14px;
}


/* =========================
   PROFILE MINI ICON
========================= */

.mini-profile{

  width:44px;

  height:44px;

  border-radius:50%;

  background:#151515;

  border:2px solid #fff;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  font-weight:800;

  position:relative;

  box-shadow:
    0 2px 8px rgba(0,0,0,.6);
}


.profile-plus{

  position:absolute;

  bottom:-7px;

  left:50%;

  transform:translateX(-50%);

  width:19px;

  height:19px;

  border-radius:50%;

  background:#ff1744;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:15px;

  font-weight:bold;

  border:1px solid #000;
}


/* =========================
   ACTION BUTTON
========================= */

.action-button{

  width:52px;

  min-height:48px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:2px;

  background:transparent;

  color:#fff;

  text-shadow:
    0 2px 6px #000;

  font-size:24px;
}


.action-icon{

  font-size:27px;

  line-height:29px;

  filter:
    drop-shadow(
      0 2px 4px #000
    );
}


.action-count{

  font-size:11px;

  line-height:14px;

  color:#fff;
}


/* =========================
   MUSIC
========================= */

.music-button{

  margin-top:2px;
}

.music-disc{

  width:40px;

  height:40px;

  border-radius:50%;

  border:2px solid #fff;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#151515;

  font-size:19px;

  animation:spin 5s linear infinite;
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   USER INFO
========================= */

.video-info{

  position:absolute;

  z-index:14;

  left:18px;

  right:82px;

  bottom:20px;

  text-shadow:
    0 2px 7px rgba(0,0,0,.9);
}


.username{

  font-size:16px;

  font-weight:800;

  margin-bottom:7px;
}


.caption{

  font-size:13px;

  color:#eee;

  margin-bottom:11px;

  line-height:18px;
}


.follow-button{

  padding:8px 18px;

  border-radius:22px;

  background:#ff1744;

  color:#fff;

  font-size:13px;

  font-weight:700;

  box-shadow:
    0 4px 15px rgba(0,0,0,.25);
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

  position:absolute;

  z-index:100;

  left:0;

  right:0;

  bottom:0;

  height:70px;

  display:flex;

  align-items:center;

  justify-content:space-around;

  background:
    rgba(0,0,0,.96);

  border-top:
    1px solid rgba(255,255,255,.12);

  padding-bottom:
    env(safe-area-inset-bottom);
}


.nav-button{

  width:33.33%;

  height:65px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:transparent;

  color:#888;

  font-size:28px;
}


.nav-button.active{
  color:#ff1744;
}


/* CENTER PLUS */

.plus-button{

  width:43px;

  height:43px;

  border-radius:13px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#171717;

  color:#fff;

  border:
    1px solid rgba(255,255,255,.3);

  font-size:28px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.5);
}


/* =========================
   PAGES
========================= */

.page{

  position:absolute;

  inset:0;

  z-index:200;

  display:none;

  background:#000;

  overflow-y:auto;

  padding:
    85px
    20px
    30px;
}


.page.open{
  display:block;
}


.page-title{

  font-size:32px;

  font-weight:800;

  margin-bottom:7px;
}


.page-subtitle{

  color:#888;

  font-size:16px;

  margin-bottom:24px;
}


.input{

  width:100%;

  height:52px;

  padding:0 15px;

  margin-bottom:12px;

  border-radius:13px;

  border:1px solid #333;

  background:#151515;

  color:#fff;

  font-size:15px;

  outline:none;
}


.input:focus{

  border-color:#ff1744;
}


.primary-button{

  width:100%;

  height:52px;

  margin-bottom:12px;

  border-radius:13px;

  background:#ff1744;

  color:#fff;

  font-size:16px;

  font-weight:700;
}


.google-button{

  width:100%;

  height:52px;

  border-radius:13px;

  background:#fff;

  color:#111;

  font-weight:700;

  font-size:15px;
}


.switch-text{

  text-align:center;

  color:#888;

  margin-top:20px;

  font-size:14px;
}


.switch-text b{
  color:#ff1744;
}


/* =========================
   UPLOAD
========================= */

.upload-title{

  font-size:28px;

  font-weight:800;

  margin-bottom:22px;
}


.file-input{

  width:100%;

  padding:15px;

  border-radius:13px;

  background:#151515;

  border:1px dashed #555;

  color:#fff;

  margin-bottom:13px;
}


.progress{

  width:100%;

  height:7px;

  border-radius:8px;

  background:#222;

  overflow:hidden;

  margin-top:10px;
}


.progress-bar{

  height:100%;

  width:0%;

  background:#ff1744;
}


.upload-status{

  color:#888;

  font-size:13px;

  margin-top:10px;
}


/* =========================
   PROFILE PAGE
========================= */

.profile-page{

  text-align:center;
}


.big-avatar{

  width:90px;

  height:90px;

  border-radius:50%;

  background:#ff1744;

  display:flex;

  align-items:center;

  justify-content:center;

  margin:25px auto 18px;

  font-size:38px;

  font-weight:800;
}


.profile-email{

  color:#888;

  font-size:15px;

  margin-top:8px;
}


.logout-button{

  width:100%;

  height:50px;

  margin-top:25px;

  border-radius:13px;

  background:#171717;

  border:1px solid #333;

  color:#fff;
}


/* =========================
   EMPTY
========================= */

.empty{

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#777;
}


.empty strong{

  display:block;

  font-size:20px;

  color:#aaa;

  margin-bottom:6px;
}


/* =========================
   TOAST
========================= */

.toast{

  position:absolute;

  z-index:500;

  left:50%;

  bottom:85px;

  transform:translateX(-50%);

  padding:10px 16px;

  border-radius:22px;

  background:#222;

  color:#fff;

  font-size:13px;

  display:none;

  white-space:nowrap;
}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

  .logo{
    font-size:24px;
  }

  .actions{
    right:6px;
    gap:10px;
  }

  .action-icon{
    font-size:24px;
  }

  .video-info{
    left:14px;
  }

}


/* =========================
   LARGE PHONES
========================= */

@media(min-width:600px){

  .feed{
    max-width:600px;
    margin:auto;
  }

  .top-bar{
    max-width:600px;
    margin:auto;
  }

  .bottom-nav{
    max-width:600px;
    margin:auto;
  }

}

</style>
</head>


<body>

<div id="app">


<!-- ==================================================
     TOP BAR
================================================== -->

<header class="top-bar">

  </div>

  <button
    id="topButton"
    class="login-btn">
    Login
  </button>

<!-- ==================================================
     VIDEO FEED
================================================== -->

<main
  id="feed"
  class="feed">

  <div class="empty">

    <div>

      <strong>
        Loading X-Dark...

      Please wait

    </div>

  </div>

</main>


<!-- ==================================================
     LOGIN PAGE
================================================== -->

<section
  id="loginPage"
  class="page">

  <div class="page-subtitle">

  </div>


  <input
    id="loginEmail"

    type="email"
    placeholder="Email">

    id="loginPassword"

    type="password"

<section

  </div>

  <div class="page-subtitle">

  </div>


  <input
    id="signupName"

    id="signupPassword"

  <button
    id="signupButton"
    class="primary-button">

  </button>


  <div class="switch-text">

    Already have an account?

    <b id="openLogin">

    </b>

<!-- ==================================================

<section

  <div class="upload-title">

  </div>


  <input

  <input

    placeholder="Write a caption...">


  <button
    id="uploadButton"
    class="primary-button">

  </button>


  <div class="progress">

      id="progressBar"

  </div>

<!-- ==================================================
     PROFILE PAGE

<section

  class="page profile-page">


  <div
    id="bigAvatar"
    class="big-avatar">
    X
  </div>


  <div
    id="profileName"

  </div>


  <div
    id="profileEmail"

    Not logged in

  </div>

    id="logoutButton"

  </button>

<!-- ==================================================
     BOTTOM NAV
================================================== -->

<nav
  id="bottomNav"
  class="bottom-nav">


  <button
    class="nav-button active"
    data-page="home">

    ⌂

  </button>


  <button
    class="nav-button"
    data-page="upload">

    <span class="plus-button">
      ＋
    </span>

  </button>


  <button
    class="nav-button"

    ♙

  </button>


</nav>


<!-- TOAST -->

<div
  id="toast"
  class="toast">
</div>


</div>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script type="module">


/* ==================================================
   FIREBASE IMPORTS
================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  doc,
  getDoc,
  setDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
  "darkwing-a717a.firebaseapp.com",

  projectId:
  "darkwing-a717a",

  storageBucket:
  "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
  "352453390196",

  appId:
  "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
  "G-5RVX9NET3W"

};


const firebaseApp =
initializeApp(firebaseConfig);


const auth =
getAuth(firebaseApp);


const db =
getFirestore(firebaseApp);


/* ==================================================
   CLOUDINARY
================================================== */

const CLOUD_NAME =
"lrpb7uuy";


const UPLOAD_PRESET =
"x_dark_videos";


const CLOUDINARY_URL =
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* ==================================================
   SHORT SELECTOR
================================================== */

const $ =
id => document.getElementById(id);


/* ==================================================
   TOAST
================================================== */

function showToast(message){

  const toast =
  $("toast");

  toast.textContent =
  message;

  toast.style.display =
  "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
  setTimeout(() => {

    toast.style.display =
    "none";

  },2200);

}


/* ==================================================
   PAGE NAVIGATION
================================================== */

function showPage(name){

  document
  .querySelectorAll(".page")
  .forEach(
    page =>
    page.classList.remove("open")
  );


  if(name === "home"){

    $("feed").style.display =
    "block";

    $("bottomNav").style.display =
    "flex";

    return;

  }


  $("feed").style.display =
  "none";

  $("bottomNav").style.display =
  "none";


  const target =
  $(name + "Page");


  if(target){

    target.classList.add(
      "open"
    );

  }

}


/* ==================================================
   TOP BUTTON
================================================== */

$("topButton").onclick =
() => {

  if(auth.currentUser){

    showPage(
      "profile"
    );

  }else{

    showPage(
      "login"
    );

  }

};


/* ==================================================
   LOGIN / SIGNUP SWITCH
================================================== */

$("openSignup").onclick =
() =>
showPage("signup");


$("openLogin").onclick =
() =>
showPage("login");


/* ==================================================
   BOTTOM NAV
================================================== */

document
.querySelectorAll(".nav-button")
.forEach(
  button => {

    button.onclick =
    () => {

      const page =
      button.dataset.page;


      if(
        page === "upload" &&
        !auth.currentUser
      ){

        showToast(
          "Login required"
        );

        showPage(
          "login"
        );

        return;

      }


      showPage(page);


      document
      .querySelectorAll(".nav-button")
      .forEach(
        item =>
        item.classList.remove(
          "active"
        )
      );


      button.classList.add(
        "active"
      );

    };

  }
);


/* ==================================================
   SIGNUP
================================================== */

$("signupButton").onclick =
async () => {

  const username =
  $("signupName")
  .value
  .trim();


  const email =
  $("signupEmail")
  .value
  .trim();


  const password =
  $("signupPassword")
  .value;


  if(
    !username ||
    !email ||
    !password
  ){

    showToast(
      "Fill all fields"
    );

    return;

  }


  if(password.length < 6){

    showToast(
      "Password must be 6+ characters"
    );

    return;

  }


  try{

    const result =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    await updateProfile(
      result.user,
      {
        displayName:
        username
      }
    );


    showToast(
      "Account created ✅"
    );


    showPage(
      "home"
    );


    await loadVideos();


  }catch(error){

    console.error(error);


    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      showToast(
        "Email already registered"
      );

    }else{

      showToast(
        "Signup failed"
      );

    }

  }

};


/* ==================================================
   LOGIN
================================================== */

$("loginButton").onclick =
async () => {

  const email =
  $("loginEmail")
  .value
  .trim();


  const password =
  $("loginPassword")
  .value;


  if(!email || !password){

    showToast(
      "Enter email and password"
    );

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    showToast(
      "Login successful ✅"
    );


    showPage(
      "home"
    );


  }catch(error){

    console.error(error);

    showToast(
      "Wrong email or password"
    );

  }

};


/* ==================================================
   GOOGLE LOGIN
================================================== */

$("googleButton").onclick =
async () => {

  try{

    const provider =
    new GoogleAuthProvider();


    await signInWithPopup(
      auth,
      provider
    );


    showToast(
      "Google login successful ✅"
    );


    showPage(
      "home"
    );


  }catch(error){

    console.error(error);

    showToast(
      "Google login cancelled"
    );

  }

};


/* ==================================================
   LOGOUT
================================================== */

$("logoutButton").onclick =
async () => {

  await signOut(
    auth
  );


  showToast(
    "Logged out"
  );


  showPage(
    "home"
  );

};


/* ==================================================
   AUTH STATE
================================================== */

onAuthStateChanged(
  auth,
  user => {

    $("topButton").textContent =
    user
    ? "Profile"
    : "Login";


    $("profileName").textContent =
    user
    ? (
        user.displayName ||
        "X-Dark User"
      )
    : "Guest";


    $("profileEmail").textContent =
    user
    ? (
        user.email ||
        ""
      )
    : "Not logged in";


    const text =
    user
    ? (
        user.displayName ||
        user.email ||
        "X"
      )
    : "X";


    $("bigAvatar").textContent =
    text
    .charAt(0)
    .toUpperCase();

  }
);


/* ==================================================
   UPLOAD VIDEO
================================================== */

$("uploadButton").onclick =
() => {

  if(!auth.currentUser){

    showPage(
      "login"
    );

    return;

  }


  const file =
  $("videoFile").files[0];


  if(!file){

    showToast(
      "Select a video"
    );

    return;

  }


  if(
    file.size >
    100 *
    1024 *
    1024
  ){

    showToast(
      "Video must be under 100 MB"
    );

    return;

  }


  $("uploadStatus").textContent =
  "Uploading 0%";


  $("progressBar").style.width =
  "0%";


  const form =
  new FormData();


  form.append(
    "file",
    file
  );


  form.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  const xhr =
  new XMLHttpRequest();


  xhr.open(
    "POST",
    CLOUDINARY_URL
  );


  xhr.upload.onprogress =
  event => {

    if(
      event.lengthComputable
    ){

      const percent =
      Math.round(
        event.loaded /
        event.total *
        100
      );


      $("progressBar")
      .style
      .width =
      percent + "%";


      $("uploadStatus")
      .textContent =
      "Uploading " +
      percent +
      "%";

    }

  };


  xhr.onload =
  async () => {

    if(
      xhr.status < 200 ||
      xhr.status >= 300
    ){

      showToast(
        "Cloudinary upload failed"
      );

      return;

    }


    try{

      const data =
      JSON.parse(
        xhr.responseText
      );


      await addDoc(
        collection(
          db,
          "videos"
        ),
        {

          videoUrl:
          data.secure_url,

          caption:
          $("videoCaption")
          .value
          .trim()
          ||
          "#xdark",

          username:
          auth.currentUser
          .displayName
          ||
          "X-Dark User",

          userId:
          auth.currentUser
          .uid,

          createdAt:
          serverTimestamp()

        }
      );


      $("progressBar")
      .style
      .width =
      "100%";


      $("uploadStatus")
      .textContent =
      "Upload complete ✅";


      $("videoFile")
      .value =
      "";


      $("videoCaption")
      .value =
      "";


      showToast(
        "Video uploaded 🎉"
      );


      await loadVideos();


      showPage(
        "home"
      );


    }catch(error){

      console.error(error);

      showToast(
        "Database save failed"
      );

    }

  };


  xhr.onerror =
  () => {

    showToast(
      "Network error"
    );

  };


  xhr.send(
    form
  );

};


/* ==================================================
   LOAD VIDEOS
================================================== */

async function loadVideos(){

  const feed =
  $("feed");


  feed.innerHTML =
  "";


  try{

    const result =
    await getDocs(
      query(
        collection(
          db,
          "videos"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      )
    );


    if(result.empty){

      createDemoVideo(
        feed
      );

      return;

    }


    result.forEach(
      item => {

        createVideoCard(
          feed,
          item.id,
          item.data()
        );

      }
    );


    activateVideoObserver();


  }catch(error){

    console.error(error);


    feed.innerHTML = `

      <div class="empty">

        <div>

          <strong>
            Feed unavailable
          </strong>

          Check Firestore Rules

        </div>

      </div>

    `;

  }

}


/* ==================================================
   DEMO VIDEO
================================================== */

function createDemoVideo(feed){

  createVideoCard(
    feed,
    "demo",
    {

      videoUrl:
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",

      username:
      "Dark wing",

      caption:
      "#xdark"

    }
  );


  activateVideoObserver();

}


/* ==================================================
   CREATE VIDEO CARD
================================================== */

function createVideoCard(
  feed,
  id,
  data
){

  const card =
  document.createElement(
    "article"
  );


  card.className =
  "video-card";


  const username =
  safeHTML(
    data.username ||
    "X-Dark User"
  );


  const initial =
  username
  .replace(
    /[^a-zA-Z0-9]/g,
    ""
  )
  .charAt(0)
  .toUpperCase()
  ||
  "X";


  card.innerHTML = `

    <video
      playsinline
      webkit-playsinline
      muted
      loop
      preload="auto"
      src="${safeHTML(data.videoUrl)}">
    </video>


    <div class="video-gradient">
    </div>


    <!-- CENTER AUDIO -->

    <button
      class="audio-button"
      aria-label="Mute">

      🔇

    </button>


    <!-- PLAY -->

    <button
      class="play-button">

      ▶

    </button>


    <!-- RIGHT ACTIONS -->

    <div class="actions">


      <!-- PROFILE -->

      <div class="mini-profile">

        ${initial}

        <span class="profile-plus">
          +
        </span>

      </div>


      <!-- LIKE -->

      <button
        class="action-button like-button">

        <span class="action-icon">
          ♡
        </span>

        <span class="action-count">
          0
        </span>

      </button>


      <!-- COMMENT -->

      <button
        class="action-button comment-button">

        <span class="action-icon">
          💬
        </span>

        <span class="action-count">
          0
        </span>

      </button>


      <!-- SAVE -->

      <button
        class="action-button save-button">

        <span class="action-icon">
          ♡
        </span>

        <span class="action-count">
          0
        </span>

      </button>


      <!-- SHARE -->

      <button
        class="action-button share-button">

        <span class="action-icon">
          ➤
        </span>

        <span class="action-count">
          Share
        </span>

      </button>


      <!-- MUSIC -->

      <button
        class="action-button music-button">

        <span class="music-disc">
          ♪
        </span>

        <span class="action-count">
          Original
        </span>

      </button>


    </div>


    <!-- USER INFO -->

    <div class="video-info">


      <div class="username">
        @${username}
      </div>


      <div class="caption">
        ${safeHTML(
          data.caption ||
          "#xdark"
        )}
      </div>


      <button class="follow-button">
        Follow
      </button>


    </div>

  `;


  feed.appendChild(
    card
  );


  const video =
  card.querySelector(
    "video"
  );


  const audio =
  card.querySelector(
    ".audio-button"
  );


  const play =
  card.querySelector(
    ".play-button"
  );


  /* ==========================================
     VIDEO LOADED
  ========================================== */

  video.addEventListener(
    "loadeddata",
    () => {

      video
      .play()
      .catch(
        () => {

          play.classList.add(
            "show"
          );

        }
      );

    }
  );


  /* ==========================================
     VIDEO ERROR
  ========================================== */

  video.addEventListener(
    "error",
    () => {

      play.classList.add(
        "show"
      );

    }
  );


  /* ==========================================
     VIDEO CLICK
  ========================================== */

  video.onclick =
  () => {

    if(video.paused){

      video
      .play()
      .then(
        () =>
        play.classList.remove(
          "show"
        )
      );

    }else{

      video.pause();

      play.classList.add(
        "show"
      );

    }

  };


  /* ==========================================
     PLAY BUTTON
  ========================================== */

  play.onclick =
  () => {

    video
    .play()
    .then(
      () =>
      play.classList.remove(
        "show"
      )
    );

  };


  /* ==========================================
     AUDIO BUTTON
  ========================================== */

  audio.onclick =
  event => {

    event.stopPropagation();


    video.muted =
    !video.muted;


    audio.textContent =
    video.muted
    ? "🔇"
    : "🔊";

  };


  /* ==========================================
     LIKE
  ========================================== */

  const like =
  card.querySelector(
    ".like-button"
  );


  const likeIcon =
  like.querySelector(
    ".action-icon"
  );


  const likeCount =
  like.querySelector(
    ".action-count"
  );


  if(id !== "demo"){

    getDocs(
      collection(
        db,
        "videos",
        id,
        "likes"
      )
    )
    .then(
      snapshot => {

        likeCount.textContent =
        snapshot.size;


        if(
          auth.currentUser &&
          snapshot.docs.some(
            item =>
            item.id ===
            auth.currentUser.uid
          )
        ){

          likeIcon.textContent =
          "♥";

          likeIcon.style.color =
          "#ff1744";

        }

      }
    )
    .catch(
      () => {}
    );

  }


  like.onclick =
  async event => {

    event.stopPropagation();


    if(id === "demo"){

      showToast(
        "Login to like ❤️"
      );

      return;

    }


    if(!auth.currentUser){

      showPage(
        "login"
      );

      return;

    }


    const reference =
    doc(
      db,
      "videos",
      id,
      "likes",
      auth.currentUser.uid
    );


    try{

      const existing =
      await getDoc(
        reference
      );


      if(existing.exists()){

        await deleteDoc(
          reference
        );


        likeIcon.textContent =
        "♡";

        likeIcon.style.color =
        "#fff";


        likeCount.textContent =
        Math.max(
          0,
          Number(
            likeCount.textContent
          ) - 1
        );

      }else{

        await setDoc(
          reference,
          {

            userId:
            auth.currentUser.uid,

            createdAt:
            serverTimestamp()

          }
        );


        likeIcon.textContent =
        "♥";

        likeIcon.style.color =
        "#ff1744";


        likeCount.textContent =
        Number(
          likeCount.textContent
        ) + 1;

      }

    }catch(error){

      console.error(error);

      showToast(
        "Like failed"
      );

    }

  };


  /* ==========================================
     COMMENT
  ========================================== */

  card
  .querySelector(
    ".comment-button"
  )
  .onclick =
  () => {

    showToast(
      "Comments coming next 💬"
    );

  };


  /* ==========================================
     SAVE
  ========================================== */

  card
  .querySelector(
    ".save-button"
  )
  .onclick =
  event => {

    event.stopPropagation();

    showToast(
      "Saved 🔖"
    );

  };


  /* ==========================================
     FOLLOW
  ========================================== */

  card
  .querySelector(
    ".follow-button"
  )
  .onclick =
  () => {

    if(!auth.currentUser){

      showPage(
        "login"
      );

      return;

    }


    showToast(
      "Follow coming next"
    );

  };


  /* ==========================================
     SHARE
  ========================================== */

  card
  .querySelector(
    ".share-button"
  )
  .onclick =
  async event => {

    event.stopPropagation();


    try{

      if(
        navigator.share
      ){

        await navigator.share({

          title:
          "X-Dark",

          text:
          data.caption ||
          "#xdark",

          url:
          data.videoUrl

        });

      }else{

        await navigator.clipboard.writeText(
          data.videoUrl
        );

        showToast(
          "Link copied 🔗"
        );

      }

    }catch(error){}

  };

}


/* ==================================================
   VIDEO OBSERVER
================================================== */

function activateVideoObserver(){

  const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(
        entry => {

          const video =
          entry.target;


          const card =
          video.closest(
            ".video-card"
          );


          const play =
          card
          ? card.querySelector(
              ".play-button"
            )
          : null;


          if(
            entry.isIntersecting
          ){

            video
            .play()
            .then(
              () => {

                if(play){

                  play.classList.remove(
                    "show"
                  );

                }

              }
            )
            .catch(
              () => {

                if(play){

                  play.classList.add(
                    "show"
                  );

                }

              }
            );

          }else{

            video.pause();

          }

        }
      );

    },
    {
      threshold:.7
    }
  );


  document
  .querySelectorAll(
    ".video-card video"
  )
  .forEach(
    video =>
    observer.observe(
      video
    )
  );

}


/* ==================================================
   HTML SECURITY
================================================== */

function safeHTML(value){

  return String(value)
  .replace(
    /[&<>"']/g,
    character => {

      const map = {

        "&":
        "&amp;",

        "<":
        "&lt;",

        ">":
        "&gt;",

        '"':
        "&quot;",

        "'":
        "&#039;"

      };


      return map[
        character
      ];

    }
  );

}

   START APP

loadVideos();
