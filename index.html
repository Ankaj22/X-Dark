<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Dark</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

html,body{
  background:#050505;
  color:#fff;
  min-height:100%;
}

body{
  overflow-x:hidden;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:#080808;
  padding-bottom:70px;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:60px;
  background:rgba(5,5,5,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  z-index:50;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#ff1744;
}

.headerBtn{
  background:#151515;
  color:#fff;
  border:1px solid #333;
  padding:9px 16px;
  border-radius:22px;
  font-size:14px;
}

/* PAGES */

main{
  padding-top:60px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* FEED */

.feed{
  height:calc(100vh - 60px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.videoCard{
  height:calc(100vh - 60px);
  min-height:600px;
  position:relative;
  scroll-snap-align:start;
  background:#000;
  overflow:hidden;
}

.videoCard video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.videoOverlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      transparent 42%,
      rgba(0,0,0,.1) 58%,
      rgba(0,0,0,.92) 100%
    );
  pointer-events:none;
}

.videoInfo{
  position:absolute;
  left:16px;
  right:90px;
  bottom:28px;
  z-index:5;
}

.username{
  font-size:17px;
  font-weight:700;
  margin-bottom:9px;
}

.caption{
  font-size:14px;
  line-height:1.45;
  margin-bottom:12px;
}

.followBtn{
  background:#ff1744;
  color:#fff;
  padding:8px 16px;
  border-radius:20px;
  font-weight:700;
}

.actions{
  position:absolute;
  right:9px;
  bottom:28px;
  display:flex;
  flex-direction:column;
  gap:16px;
  z-index:10;
}

.action{
  width:55px;
  min-height:50px;
  color:#fff;
  background:transparent;
  text-align:center;
  font-size:27px;
}

.action small{
  display:block;
  font-size:11px;
  color:#fff;
  margin-top:3px;
}

.likeBtn.liked{
  transform:scale(1.05);
}

.muted{
  position:absolute;
  top:16px;
  right:15px;
  width:43px;
  height:43px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:20px;
  z-index:12;
}

/* AUTH */

.authBox{
  padding:35px 22px;
}

.authBox h1{
  font-size:34px;
  margin-bottom:8px;
}

.authBox p{
  color:#999;
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:16px;
  margin-bottom:12px;
  border-radius:13px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  outline:none;
  font-size:15px;
}

.input:focus{
  border-color:#ff1744;
}

.primary{
  width:100%;
  padding:16px;
  background:#ff1744;
  color:#fff;
  border-radius:13px;
  font-size:16px;
  font-weight:700;
  margin-bottom:12px;
}

.google{
  width:100%;
  padding:16px;
  background:#fff;
  color:#111;
  border-radius:13px;
  font-size:15px;
  font-weight:700;
}

.switch{
  margin-top:22px;
  text-align:center;
  color:#999;
}

.switch span{
  color:#ff1744;
  font-weight:700;
  cursor:pointer;
}

/* UPLOAD */

.uploadBox{
  padding:28px 18px;
}

.uploadBox h2{
  margin-bottom:20px;
}

.fileInput{
  width:100%;
  padding:15px;
  background:#151515;
  border:1px dashed #555;
  color:#fff;
  border-radius:12px;
  margin-bottom:15px;
}

.progress{
  height:8px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progressBar{
  height:100%;
  width:0%;
  background:#ff1744;
  transition:width .2s;
}

.status{
  color:#aaa;
  font-size:13px;
}

/* PROFILE */

.profile{
  padding:30px 18px;
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ff1744;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:900;
  margin:20px auto 14px;
}

.profile h2{
  margin-bottom:7px;
}

.profile p{
  color:#888;
}

.profileBtns{
  margin-top:28px;
}

.profileBtns button{
  width:100%;
  padding:15px;
  border-radius:12px;
  background:#191919;
  color:#fff;
  border:1px solid #333;
}

/* NAV */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:70px;
  background:rgba(5,5,5,.97);
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:60;
}

nav button{
  background:none;
  color:#888;
  font-size:26px;
}

nav button.active{
  color:#ff1744;
}

/* EMPTY */

.empty{
  padding:100px 20px;
  text-align:center;
  color:#777;
}

.empty h2{
  color:#aaa;
  margin-bottom:8px;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:22px;
  display:none;
  z-index:100;
  font-size:13px;
  max-width:85%;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">X-<span>DARK</span></div>
  <button class="headerBtn" id="authHeaderBtn">Login</button>
</header>

<main>

<!-- HOME -->

<section id="homePage" class="page active">

  <div id="feed" class="feed">

    <div class="empty">
      Loading X-Dark...
    </div>

  </div>

</section>


<!-- LOGIN -->

<section id="loginPage" class="page">

  <div class="authBox">

    <h1>Welcome Back</h1>
    <p>Login to X-Dark</p>

    <input
      id="loginEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      id="loginBtn"
    >
      Login
    </button>

    <button
      class="google"
      id="googleBtn"
    >
      🔵 Continue with Google
    </button>

    <div class="switch">
      Don't have an account?
      <span id="showSignup">Sign up</span>
    </div>

  </div>

</section>


<!-- SIGNUP -->

<section id="signupPage" class="page">

  <div class="authBox">

    <h1>Create Account</h1>
    <p>Join X-Dark</p>

    <input
      id="signupName"
      class="input"
      type="text"
      placeholder="Username"
    >

    <input
      id="signupEmail"
      class="input"
      type="email"
      placeholder="Email"
    >

    <input
      id="signupPassword"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      id="signupBtn"
    >
      Create Account
    </button>

    <div class="switch">
      Already have an account?
      <span id="showLogin">Login</span>
    </div>

  </div>

</section>


<!-- UPLOAD -->

<section id="uploadPage" class="page">

  <div class="uploadBox">

    <h2>Upload Video 🎬</h2>

    <input
      id="videoFile"
      class="fileInput"
      type="file"
      accept="video/mp4,video/webm,video/quicktime,video/x-matroska"
    >

    <input
      id="caption"
      class="input"
      type="text"
      maxlength="150"
      placeholder="Write a caption..."
    >

    <button
      class="primary"
      id="uploadBtn"
    >
      Upload to X-Dark
    </button>

    <div class="progress">
      <div
        id="progressBar"
        class="progressBar"
      ></div>
    </div>

    <div
      id="uploadStatus"
      class="status"
    >
      Maximum video size: 100 MB
    </div>

  </div>

</section>


<!-- PROFILE -->

<section id="profilePage" class="page">

  <div class="profile">

    <div
      id="avatar"
      class="avatar"
    >
      ?
    </div>

    <h2 id="profileName">
      Guest
    </h2>

    <p id="profileEmail">
      Not logged in
    </p>

    <div class="profileBtns">

      <button id="logoutBtn">
        Logout
      </button>

    </div>

  </div>

</section>

</main>


<!-- BOTTOM NAV -->

<nav>

  <button
    class="navBtn active"
    data-page="homePage"
  >
    ⌂
  </button>

  <button
    class="navBtn"
    data-page="uploadPage"
  >
    ＋
  </button>

  <button
    class="navBtn"
    data-page="profilePage"
  >
    ♙
  </button>

</nav>


<div id="toast"></div>

</div>


<script type="module">

/* =====================================
   FIREBASE APP
===================================== */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


/* =====================================
   FIREBASE AUTH
===================================== */

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =====================================
   FIRESTORE
===================================== */

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  getDoc,
  query,
  orderBy,
  serverTimestamp,
  doc,
  setDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
    "darkwing-a717a.firebaseapp.com",

  projectId:
    "darkwing-a717a",

  storageBucket:
    "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
    "352453390196",

  appId:
    "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
    "G-5RVX9NET3W"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================
   CLOUDINARY
===================================== */

const CLOUD_NAME =
  "lrpb7uuy";

const UPLOAD_PRESET =
  "x_dark_videos";

const CLOUDINARY_URL =
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* =====================================
   HELPER
===================================== */

const $ = id =>
  document.getElementById(id);


function toast(message){

  const box =
    $("toast");

  box.textContent =
    message;

  box.style.display =
    "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{

      box.style.display =
        "none";

    },2500);
}


/* =====================================
   PAGE NAVIGATION
===================================== */

function showPage(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page=>{

      page.classList.remove("active");

    });

  $(pageId)
    .classList.add("active");


  document
    .querySelectorAll(".navBtn")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.page === pageId
      );

    });


  window.scrollTo(0,0);
}


/* =====================================
   BOTTOM NAV
===================================== */

document
  .querySelectorAll(".navBtn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        const page =
          btn.dataset.page;


        if(
          page === "uploadPage" &&
          !auth.currentUser
        ){

          toast(
            "Login required to upload"
          );

          showPage("loginPage");

          return;
        }


        showPage(page);

      }
    );

  });


/* =====================================
   HEADER AUTH BUTTON
===================================== */

$("authHeaderBtn").onclick =
()=>{

  if(auth.currentUser){

    showPage("profilePage");

  }else{

    showPage("loginPage");

  }

};


/* =====================================
   SIGNUP
===================================== */

$("signupBtn").onclick =
async ()=>{

  const name =
    $("signupName")
      .value
      .trim();

  const email =
    $("signupEmail")
      .value
      .trim();

  const password =
    $("signupPassword")
      .value;


  if(
    !name ||
    !email ||
    !password
  ){

    toast(
      "Fill all fields"
    );

    return;
  }


  if(password.length < 6){

    toast(
      "Password must be 6+ characters"
    );

    return;
  }


  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );


    toast(
      "Account created 🎉"
    );


    updateProfileUI(
      result.user
    );


    showPage("homePage");


  }catch(error){

    console.error(error);

    toast(
      getFriendlyError(error)
    );

  }

};


/* =====================================
   LOGIN
===================================== */

$("loginBtn").onclick =
async ()=>{

  const email =
    $("loginEmail")
      .value
      .trim();

  const password =
    $("loginPassword")
      .value;


  if(
    !email ||
    !password
  ){

    toast(
      "Enter email and password"
    );

    return;
  }


  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    updateProfileUI(
      result.user
    );


    toast(
      "Login successful ✅"
    );


    showPage("homePage");


  }catch(error){

    console.error(error);

    toast(
      getFriendlyError(error)
    );

  }

};


/* =====================================
   GOOGLE LOGIN
===================================== */

$("googleBtn").onclick =
async ()=>{

  try{

    const provider =
      new GoogleAuthProvider();


    await signInWithPopup(
      auth,
      provider
    );


    toast(
      "Google login successful ✅"
    );


    showPage("homePage");


  }catch(error){

    console.error(error);

    toast(
      getFriendlyError(error)
    );

  }

};


/* =====================================
   LOGIN / SIGNUP SWITCH
===================================== */

$("showSignup").onclick =
()=>{

  showPage(
    "signupPage"
  );

};


$("showLogin").onclick =
()=>{

  showPage(
    "loginPage"
  );

};


/* =====================================
   FRIENDLY FIREBASE ERRORS
===================================== */

function getFriendlyError(error){

  const code =
    error?.code || "";


  if(
    code.includes(
      "auth/invalid-credential"
    )
  ){

    return "Email or password is incorrect";

  }


  if(
    code.includes(
      "auth/email-already-in-use"
    )
  ){

    return "Email already registered";

  }


  if(
    code.includes(
      "auth/invalid-email"
    )
  ){

    return "Invalid email";

  }


  if(
    code.includes(
      "auth/popup-closed-by-user"
    )
  ){

    return "Google login cancelled";

  }


  return error?.message ||
    "Something went wrong";

}


/* =====================================
   AUTH STATE
===================================== */

onAuthStateChanged(
  auth,
  user=>{

    updateProfileUI(user);

  }
);


function updateProfileUI(user){

  if(user){

    $("authHeaderBtn")
      .textContent =
      "Profile";


    const name =
      user.displayName ||
      "X-Dark User";


    $("profileName")
      .textContent =
      name;


    $("profileEmail")
      .textContent =
      user.email || "";


    $("avatar")
      .textContent =
      name
        .charAt(0)
        .toUpperCase();


  }else{

    $("authHeaderBtn")
      .textContent =
      "Login";


    $("profileName")
      .textContent =
      "Guest";


    $("profileEmail")
      .textContent =
      "Not logged in";


    $("avatar")
      .textContent =
      "?";

  }

}


/* =====================================
   LOGOUT
===================================== */

$("logoutBtn").onclick =
async ()=>{

  try{

    await signOut(auth);

    toast(
      "Logged out"
    );

    showPage(
      "homePage"
    );

  }catch(error){

    toast(
      "Logout failed"
    );

  }

};


/* =====================================
   CLOUDINARY UPLOAD
===================================== */

$("uploadBtn").onclick =
()=>{

  if(!auth.currentUser){

    toast(
      "Please login first"
    );

    showPage(
      "loginPage"
    );

    return;
  }


  const file =
    $("videoFile")
      .files[0];


  const caption =
    $("caption")
      .value
      .trim();


  if(!file){

    toast(
      "Select a video"
    );

    return;
  }


  if(
    file.size >
    100 * 1024 * 1024
  ){

    toast(
      "Video must be under 100 MB"
    );

    return;
  }


  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  $("progressBar")
    .style.width =
    "0%";


  $("uploadStatus")
    .textContent =
    "Uploading video...";


  const xhr =
    new XMLHttpRequest();


  xhr.open(
    "POST",
    CLOUDINARY_URL
  );


  xhr.upload.onprogress =
    event=>{

      if(
        event.lengthComputable
      ){

        const percent =
          Math.round(
            event.loaded /
            event.total *
            100
          );


        $("progressBar")
          .style.width =
          percent + "%";


        $("uploadStatus")
          .textContent =
          `Uploading ${percent}%`;

      }

    };


  xhr.onload =
    async ()=>{

      if(
        xhr.status >= 200 &&
        xhr.status < 300
      ){

        try{

          const data =
            JSON.parse(
              xhr.responseText
            );


          const videoUrl =
            data.secure_url;


          $("uploadStatus")
            .textContent =
            "Saving video...";


          await addDoc(
            collection(
              db,
              "videos"
            ),
            {

              videoUrl:
                videoUrl,

              caption:
                caption,

              username:
                auth.currentUser
                  .displayName ||
                "X-Dark User",

              userId:
                auth.currentUser
                  .uid,

              likes:
                0,

              comments:
                0,

              createdAt:
                serverTimestamp()

            }
          );


          $("progressBar")
            .style.width =
            "100%";


          $("uploadStatus")
            .textContent =
            "Upload complete ✅";


          $("videoFile")
            .value = "";


          $("caption")
            .value = "";


          toast(
            "Video uploaded 🎉"
          );


          await loadVideos();


          setTimeout(
            ()=>{
              showPage(
                "homePage"
              );
            },
            800
          );


        }catch(error){

          console.error(error);

          $("uploadStatus")
            .textContent =
            "Firestore error";


          toast(
            getFriendlyError(error)
          );

        }


      }else{

        $("uploadStatus")
          .textContent =
          "Cloudinary upload failed";


        toast(
          "Cloudinary upload failed"
        );

      }

    };


  xhr.onerror =
    ()=>{

      $("uploadStatus")
        .textContent =
        "Network error";


      toast(
        "Network error"
      );

    };


  xhr.send(
    formData
  );

};


/* =====================================
   LOAD GLOBAL VIDEOS
===================================== */

async function loadVideos(){

  const feed =
    $("feed");


  feed.innerHTML = `
    <div class="empty">
      Loading videos...
    </div>
  `;


  try{

    const videosQuery =
      query(
        collection(
          db,
          "videos"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await getDocs(
        videosQuery
      );


    if(snapshot.empty){

      feed.innerHTML = `
        <div class="empty">
          <h2>No videos yet</h2>
          <p>Be the first to upload 🚀</p>
        </div>
      `;

      return;
    }


    feed.innerHTML = "";


    for(
      const docSnap of snapshot.docs
    ){

      const data =
        docSnap.data();


      await createVideoCard(
        data,
        docSnap.id
      );

    }


    activateVideos();


  }catch(error){

    console.error(error);

    feed.innerHTML = `
      <div class="empty">
        <h2>Feed unavailable</h2>
        <p>Unable to load videos.</p>
      </div>
    `;

  }

}


/* =====================================
   CREATE VIDEO CARD
===================================== */

async function createVideoCard(
  data,
  id
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "videoCard";


  const video =
    document.createElement(
      "video"
    );


  video.src =
    data.videoUrl || "";

  video.playsInline =
    true;

  video.loop =
    true;

  video.muted =
    true;

  video.preload =
    "metadata";


  const overlay =
    document.createElement(
      "div"
    );

  overlay.className =
    "videoOverlay";


  const mute =
    document.createElement(
      "button"
    );

  mute.className =
    "muted";

  mute.textContent =
    "🔇";


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "videoInfo";


  const username =
    document.createElement(
      "div"
    );

  username.className =
    "username";

  username.textContent =
    "@" +
    (data.username ||
      "user");


  const caption =
    document.createElement(
      "div"
    );

  caption.className =
    "caption";

  caption.textContent =
    data.caption || "";


  const follow =
    document.createElement(
      "button"
    );

  follow.className =
    "followBtn";

  follow.textContent =
    "Follow";


  info.append(
    username,
    caption,
    follow
  );


  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "actions";


  /* LIKE BUTTON */

  const likeBtn =
    document.createElement(
      "button"
    );

  likeBtn.className =
    "action likeBtn";

  likeBtn.innerHTML =
    "🤍";


  const likeCount =
    document.createElement(
      "small"
    );

  likeCount.textContent =
    "0";


  likeBtn.append(
    likeCount
  );


  /* COMMENT */

  const commentBtn =
    document.createElement(
      "button"
    );

  commentBtn.className =
    "action commentBtn";

  commentBtn.innerHTML =
    "💬";


  const commentCount =
    document.createElement(
      "small"
    );

  commentCount.textContent =
    data.comments || 0;


  commentBtn.append(
    commentCount
  );


  /* SHARE */

  const shareBtn =
    document.createElement(
      "button"
    );

  shareBtn.className =
    "action shareBtn";

  shareBtn.innerHTML =
    "↗️";


  const shareText =
    document.createElement(
      "small"
    );

  shareText.textContent =
    "Share";


  shareBtn.append(
    shareText
  );


  actions.append(
    likeBtn,
    commentBtn,
    shareBtn
  );


  card.append(
    video,
    overlay,
    mute,
    info,
    actions
  );


  $("feed")
    .appendChild(card);


  /* =================================
     MUTE
  ================================= */

  mute.onclick =
    ()=>{

      video.muted =
        !video.muted;


      mute.textContent =
        video.muted
          ? "🔇"
          : "🔊";

    };


  /* =================================
     LOAD REAL LIKES
  ================================= */

  let liked =
    false;


  try{

    const likesSnapshot =
      await getDocs(
        collection(
          db,
          "videos",
          id,
          "likes"
        )
      );


    likeCount.textContent =
      likesSnapshot.size;


    if(auth.currentUser){

      liked =
        likesSnapshot.docs.some(
          likeDoc =>
            likeDoc.id ===
            auth.currentUser.uid
        );

    }


    updateLikeUI(
      likeBtn,
      liked
    );


  }catch(error){

    console.error(
      "Like loading error:",
      error
    );

  }


  /* =================================
     REAL LIKE / UNLIKE
  ================================= */

  likeBtn.onclick =
    async ()=>{

      if(!auth.currentUser){

        toast(
          "Login to like ❤️"
        );

        showPage(
          "loginPage"
        );

        return;
      }


      const userId =
        auth.currentUser.uid;


      const likeRef =
        doc(
          db,
          "videos",
          id,
          "likes",
          userId
        );


      likeBtn.disabled =
        true;


      try{

        const currentLike =
          await getDoc(
            likeRef
          );


        if(
          currentLike.exists()
        ){

          await deleteDoc(
            likeRef
          );


          liked =
            false;


          let count =
            parseInt(
              likeCount.textContent
            ) || 0;


          likeCount.textContent =
            Math.max(
              0,
              count - 1
            );


          updateLikeUI(
            likeBtn,
            false
          );


          toast(
            "Like removed"
          );


        }else{

          await setDoc(
            likeRef,
            {

              userId:
                userId,

              createdAt:
                serverTimestamp()

            }
          );


          liked =
            true;


          let count =
            parseInt(
              likeCount.textContent
            ) || 0;


          likeCount.textContent =
            count + 1;


          updateLikeUI(
            likeBtn,
            true
          );


          toast(
            "Liked ❤️"
          );

        }


      }catch(error){

        console.error(
          "Like error:",
          error
        );


        toast(
          "Like failed"
        );

      }


      likeBtn.disabled =
        false;

    };


  /* =================================
     COMMENT BUTTON
  ================================= */

  commentBtn.onclick =
    ()=>{

      if(!auth.currentUser){

        toast(
          "Login to comment"
        );

        showPage(
          "loginPage"
        );

        return;
      }


      toast(
        "Comments coming next 💬"
      );

    };


  /* =================================
     SHARE
  ================================= */

  shareBtn.onclick =
    async ()=>{

      try{

        if(
          navigator.share
        ){

          await navigator.share({

            title:
              "X-Dark Video",

            text:
              data.caption ||
              "Watch this on X-Dark",

            url:
              data.videoUrl

          });

        }else{

          await navigator.clipboard
            .writeText(
              data.videoUrl
            );


          toast(
            "Video link copied 🔗"
          );

        }

      }catch(error){

        console.log(
          "Share cancelled"
        );

      }

    };


  /* =================================
     FOLLOW
  ================================= */

  follow.onclick =
    ()=>{

      if(!auth.currentUser){

        toast(
          "Login to follow"
        );

        showPage(
          "loginPage"
        );

        return;
      }


      toast(
        "Follow system coming next 👥"
      );

    };

}


/* =====================================
   LIKE UI
===================================== */

function updateLikeUI(
  button,
  liked
){

  if(liked){

    button.innerHTML =
      "❤️";

    button.classList.add(
      "liked"
    );

  }else{

    button.innerHTML =
      "🤍";

    button.classList.remove(
      "liked"
    );

  }

}


/* =====================================
   AUTO PLAY
===================================== */

function activateVideos(){

  const videos =
    document.querySelectorAll(
      ".videoCard video"
    );


  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(
          entry=>{

            const video =
              entry.target;


            if(
              entry.isIntersecting
            ){

              video
                .play()
                .catch(
                  ()=>{}
                );

            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:.65
      }
    );


  videos.forEach(
    video=>{
      observer.observe(video);
    }
  );

}


/* =====================================
   START APP
===================================== */

loadVideos();

</script>

</body>
</html>
