<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X-DARK</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

#app{
  position:fixed;
  inset:0;
  background:#000;
}

/* ================= TOP BAR ================= */

.top{
  position:absolute;
  z-index:50;
  top:0;
  left:0;
  right:0;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(#000c,#0000);
  pointer-events:none;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  text-shadow:0 1px 4px #000;
}

.logo b{
  color:#ff1744;
}

.profileBtn{
  pointer-events:auto;
  color:#fff;
  background:#151515d9;
  border:1px solid #444;
  border-radius:24px;
  padding:9px 17px;
  font-size:14px;
}

/* ================= FEED ================= */

.feed{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:68px;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  background:#000;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

.card{
  position:relative;
  width:100%;
  height:100%;
  min-height:100%;
  scroll-snap-align:start;
  overflow:hidden;
  background:#000;
}

/* IMPORTANT VIDEO FIX */

.card video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  background:#000;
  display:block;
}

.gradient{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.35) 0%,
      transparent 20%,
      transparent 58%,
      rgba(0,0,0,.75) 100%
    );
}

.sound{
  position:absolute;
  z-index:20;
  right:12px;
  top:72px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#000a;
  color:#fff;
  font-size:20px;
}

.play{
  position:absolute;
  z-index:20;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:64px;
  height:64px;
  border-radius:50%;
  background:#000b;
  color:#fff;
  font-size:25px;
  display:none;
}

.play.show{
  display:block;
}

/* ================= USER INFO ================= */

.info{
  position:absolute;
  z-index:10;
  left:18px;
  right:90px;
  bottom:15px;
}

.user{
  font-size:17px;
  font-weight:800;
  margin-bottom:7px;
  text-shadow:0 1px 5px #000;
}

.caption{
  font-size:14px;
  margin-bottom:11px;
  text-shadow:0 1px 5px #000;
}

.follow{
  background:#ff1744;
  color:#fff;
  border-radius:22px;
  padding:8px 18px;
  font-weight:700;
  font-size:14px;
}

/* ================= RIGHT BUTTONS ================= */

.actions{
  position:absolute;
  z-index:12;
  right:7px;
  bottom:20px;
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.action{
  width:60px;
  background:none;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-shadow:0 1px 5px #000;
}

.icon{
  font-size:29px;
  line-height:31px;
}

.count{
  font-size:12px;
  margin-top:2px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  border:2px solid #fff;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  position:relative;
}

.plus{
  position:absolute;
  bottom:-8px;
  left:50%;
  transform:translateX(-50%);
  width:21px;
  height:21px;
  border-radius:50%;
  background:#ff1744;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #000;
}

/* ================= BOTTOM BAR ================= */

.bottom{
  position:absolute;
  z-index:60;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:#050505f5;
  border-top:1px solid #222;
}

.nav{
  width:33%;
  height:68px;
  background:none;
  color:#888;
  font-size:29px;
}

.nav.active{
  color:#ff1744;
}

.add{
  width:43px;
  height:40px;
  border-radius:12px;
  background:#171717;
  border:1px solid #444;
  color:#fff;
  font-size:27px;
}

/* ================= PAGES ================= */

.page{
  display:none;
  position:absolute;
  z-index:100;
  inset:0;
  background:#000;
  padding:82px 20px 25px;
  overflow:auto;
}

.page.open{
  display:block;
}

h1{
  font-size:34px;
  margin-bottom:7px;
}

.sub{
  color:#888;
  font-size:17px;
  margin-bottom:24px;
}

.input{
  width:100%;
  height:53px;
  margin-bottom:12px;
  padding:0 15px;
  background:#151515;
  color:#fff;
  border:1px solid #333;
  border-radius:13px;
  outline:none;
}

.primary{
  width:100%;
  height:53px;
  margin-bottom:12px;
  background:#ff1744;
  color:#fff;
  border-radius:13px;
  font-weight:700;
}

.google{
  width:100%;
  height:53px;
  background:#fff;
  color:#111;
  border-radius:13px;
  font-weight:700;
}

.switch{
  text-align:center;
  color:#888;
  margin-top:20px;
}

.switch b{
  color:#ff1744;
}

/* ================= UPLOAD ================= */

.uploadTitle{
  font-size:28px;
  margin-bottom:22px;
}

.file{
  width:100%;
  padding:16px;
  background:#151515;
  border:1px dashed #555;
  border-radius:13px;
  color:#fff;
  margin-bottom:13px;
}

.status{
  color:#888;
  font-size:13px;
  margin-top:10px;
}

.progress{
  height:7px;
  background:#222;
  border-radius:8px;
  overflow:hidden;
  margin-top:13px;
}

.bar{
  height:100%;
  width:0;
  background:#ff1744;
}

/* ================= PROFILE ================= */

.profilePage{
  text-align:center;
}

.avatarBig{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ff1744;
  margin:20px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:800;
}

.logout{
  width:100%;
  height:50px;
  margin-top:25px;
  background:#171717;
  color:#fff;
  border:1px solid #333;
  border-radius:13px;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  text-align:center;
}

.empty b{
  display:block;
  color:#aaa;
  font-size:21px;
  margin-bottom:6px;
}

.toast{
  position:absolute;
  z-index:300;
  bottom:82px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  padding:10px 16px;
  border-radius:22px;
  display:none;
  font-size:13px;
  white-space:nowrap;
}
</style>
</head>

<body>

<div id="app">

<!-- TOP BAR -->
<div class="top">
  <div class="logo">
    X-<b>DARK</b>
  </div>

  <button id="topBtn" class="profileBtn">
    Login
  </button>
</div>


<!-- VIDEO FEED -->
<div id="feed" class="feed">

  <div class="empty">
    <div>
      <b>Loading X-Dark...</b>
      Please wait
    </div>
  </div>

</div>


<!-- LOGIN -->
<section id="loginPage" class="page">

  <h1>Welcome Back</h1>

  <div class="sub">
    Login to X-Dark
  </div>

  <input
    id="le"
    class="input"
    type="email"
    placeholder="Email"
  >

  <input
    id="lp"
    class="input"
    type="password"
    placeholder="Password"
  >

  <button id="login" class="primary">
    Login
  </button>

  <button id="google" class="google">
    🔵 Continue with Google
  </button>

  <div class="switch">
    Don't have an account?
    <b id="toSignup">Sign up</b>
  </div>

</section>


<!-- SIGN UP -->
<section id="signupPage" class="page">

  <h1>Create Account</h1>

  <div class="sub">
    Join X-Dark
  </div>

  <input
    id="sn"
    class="input"
    placeholder="Username"
  >

  <input
    id="se"
    class="input"
    type="email"
    placeholder="Email"
  >

  <input
    id="sp"
    class="input"
    type="password"
    placeholder="Password"
  >

  <button id="signup" class="primary">
    Create Account
  </button>

  <div class="switch">
    Already have an account?
    <b id="toLogin">Login</b>
  </div>

</section>


<!-- UPLOAD -->
<section id="uploadPage" class="page">

  <div class="uploadTitle">
    Upload Video 🎬
  </div>

  <input
    id="vf"
    class="file"
    type="file"
    accept="video/*"
  >

  <input
    id="vc"
    class="input"
    maxlength="150"
    placeholder="Write a caption..."
  >

  <button id="upload" class="primary">
    Upload to X-Dark
  </button>

  <div class="progress">
    <div id="bar" class="bar"></div>
  </div>

  <div id="status" class="status">
    Maximum video size: 100 MB
  </div>

</section>


<!-- PROFILE -->
<section id="profilePage" class="page profilePage">

  <div id="avatarBig" class="avatarBig">
    X
  </div>

  <h1 id="pn">
    Guest
  </h1>

  <div id="pe" class="sub">
    Not logged in
  </div>

  <button id="logout" class="logout">
    Logout
  </button>

</section>


<!-- BOTTOM NAV -->
<div id="bottom" class="bottom">

  <button
    class="nav active"
    data-page="home"
  >
    ⌂
  </button>

  <button
    class="nav"
    data-page="upload"
  >
    <span class="add">＋</span>
  </button>

  <button
    class="nav"
    data-page="profile"
  >
    ♙
  </button>

</div>


<div id="toast" class="toast"></div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  doc,
  getDoc,
  setDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
  "darkwing-a717a.firebaseapp.com",

  projectId:
  "darkwing-a717a",

  storageBucket:
  "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
  "352453390196",

  appId:
  "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
  "G-5RVX9NET3W"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   CLOUDINARY
===================================================== */

const CLOUD_NAME =
"lrpb7uuy";

const UPLOAD_PRESET =
"x_dark_videos";

const UPLOAD_URL =
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* =====================================================
   HELPER
===================================================== */

const $ = id =>
document.getElementById(id);


function toast(message){

  $("toast").textContent =
  message;

  $("toast").style.display =
  "block";

  clearTimeout(window.tt);

  window.tt =
  setTimeout(() => {

    $("toast").style.display =
    "none";

  },2200);

}


/* =====================================================
   PAGE
===================================================== */

function page(name){

  document
  .querySelectorAll(".page")
  .forEach(p =>
    p.classList.remove("open")
  );

  $("feed").style.display =
  name === "home"
  ? "block"
  : "none";

  $("bottom").style.display =
  name === "home"
  ? "flex"
  : "none";

  if(name !== "home"){

    $(name + "Page")
    .classList.add("open");

  }

}


/* =====================================================
   TOP BUTTON
===================================================== */

$("topBtn").onclick = () => {

  if(auth.currentUser){

    page("profile");

  }else{

    page("login");

  }

};


/* =====================================================
   LOGIN / SIGNUP SWITCH
===================================================== */

$("toSignup").onclick = () =>
page("signup");

$("toLogin").onclick = () =>
page("login");


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

document
.querySelectorAll(".nav")
.forEach(nav => {

  nav.onclick = () => {

    const p =
    nav.dataset.page;

    if(
      p === "upload" &&
      !auth.currentUser
    ){

      toast("Login required");

      page("login");

      return;

    }

    page(p);

    document
    .querySelectorAll(".nav")
    .forEach(x =>
      x.classList.remove("active")
    );

    nav.classList.add("active");

  };

});


/* =====================================================
   SIGN UP
===================================================== */

$("signup").onclick =
async () => {

  const name =
  $("sn").value.trim();

  const email =
  $("se").value.trim();

  const password =
  $("sp").value;

  if(
    !name ||
    !email ||
    !password
  ){

    toast("Fill all fields");

    return;

  }

  if(password.length < 6){

    toast(
      "Password must be 6+ characters"
    );

    return;

  }

  try{

    const result =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );

    toast(
      "Account created ✅"
    );

    page("home");

    await load();

  }catch(error){

    console.error(error);

    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      toast(
        "Email already registered"
      );

    }else{

      toast(
        "Signup failed"
      );

    }

  }

};


/* =====================================================
   LOGIN
===================================================== */

$("login").onclick =
async () => {

  const email =
  $("le").value.trim();

  const password =
  $("lp").value;

  if(!email || !password){

    toast(
      "Enter email and password"
    );

    return;

  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    toast(
      "Login successful ✅"
    );

    page("home");

  }catch(error){

    toast(
      "Wrong email or password"
    );

  }

};


/* =====================================================
   GOOGLE LOGIN
===================================================== */

$("google").onclick =
async () => {

  try{

    const provider =
    new GoogleAuthProvider();

    await signInWithPopup(
      auth,
      provider
    );

    toast(
      "Google login successful ✅"
    );

    page("home");

  }catch(error){

    console.error(error);

    toast(
      "Google login cancelled"
    );

  }

};


/* =====================================================
   LOGOUT
===================================================== */

$("logout").onclick =
async () => {

  await signOut(auth);

  toast(
    "Logged out"
  );

  page("home");

};


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    $("topBtn").textContent =
    user
    ? "Profile"
    : "Login";

    $("pn").textContent =
    user
    ? (
        user.displayName ||
        "X-Dark User"
      )
    : "Guest";

    $("pe").textContent =
    user
    ? (
        user.email ||
        ""
      )
    : "Not logged in";

    $("avatarBig").textContent =
    (
      user
      ? (
          user.displayName ||
          user.email ||
          "X"
        )
      : "X"
    )
    .charAt(0)
    .toUpperCase();

  }
);


/* =====================================================
   CLOUDINARY VIDEO UPLOAD
===================================================== */

$("upload").onclick =
() => {

  if(!auth.currentUser){

    page("login");

    return;

  }

  const file =
  $("vf").files[0];

  if(!file){

    toast(
      "Select a video"
    );

    return;

  }

  if(
    file.size >
    100 * 1024 * 1024
  ){

    toast(
      "Video must be under 100 MB"
    );

    return;

  }


  $("status").textContent =
  "Uploading 0%";

  $("bar").style.width =
  "0%";


  const form =
  new FormData();

  form.append(
    "file",
    file
  );

  form.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  const xhr =
  new XMLHttpRequest();

  xhr.open(
    "POST",
    UPLOAD_URL
  );


  xhr.upload.onprogress =
  event => {

    if(event.lengthComputable){

      const percent =
      Math.round(
        event.loaded /
        event.total *
        100
      );

      $("bar").style.width =
      percent + "%";

      $("status").textContent =
      "Uploading " +
      percent +
      "%";

    }

  };


  xhr.onload =
  async () => {

    if(
      xhr.status < 200 ||
      xhr.status >= 300
    ){

      toast(
        "Cloudinary upload failed"
      );

      return;

    }


    try{

      const data =
      JSON.parse(
        xhr.responseText
      );


      await addDoc(
        collection(
          db,
          "videos"
        ),
        {

          videoUrl:
          data.secure_url,

          caption:
          $("vc").value.trim()
          || "#xdark",

          username:
          auth.currentUser
          .displayName
          ||
          "X-Dark User",

          userId:
          auth.currentUser.uid,

          createdAt:
          serverTimestamp()

        }
      );


      $("status").textContent =
      "Upload complete ✅";

      $("bar").style.width =
      "100%";


      $("vf").value =
      "";

      $("vc").value =
      "";


      toast(
        "Video uploaded 🎉"
      );


      await load();

      page("home");

    }catch(error){

      console.error(error);

      toast(
        "Database save failed"
      );

    }

  };


  xhr.onerror =
  () => {

    toast(
      "Network error"
    );

  };


  xhr.send(form);

};


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function load(){

  const feed =
  $("feed");

  feed.innerHTML =
  "";


  try{

    const videos =
    await getDocs(
      query(
        collection(
          db,
          "videos"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      )
    );


    if(videos.empty){

      demo(feed);

      return;

    }


    videos.forEach(
      video => {

        card(
          feed,
          video.id,
          video.data()
        );

      }
    );


    watchVideos();

  }catch(error){

    console.error(error);

    feed.innerHTML = `
      <div class="empty">
        <div>
          <b>Feed unavailable</b>
          Check Firestore Rules
        </div>
      </div>
    `;

  }

}


/* =====================================================
   DEMO VIDEO
===================================================== */

function demo(feed){

  card(
    feed,
    "demo",
    {

      videoUrl:
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",

      username:
      "Dark wing",

      caption:
      "#xdark"

    }
  );

  watchVideos();

}


/* =====================================================
   VIDEO CARD
===================================================== */

function card(
  feed,
  id,
  data
){

  const element =
  document.createElement(
    "article"
  );

  element.className =
  "card";


  const username =
  escapeHTML(
    data.username ||
    "X-Dark User"
  );


  const initial =
  username
  .replace(
    /[^a-zA-Z0-9]/g,
    ""
  )
  .charAt(0)
  .toUpperCase()
  ||
  "X";


  element.innerHTML = `

    <video
      playsinline
      webkit-playsinline
      muted
      loop
      preload="auto"
      src="${escapeHTML(data.videoUrl)}"
    ></video>

    <div class="gradient"></div>

    <button class="sound">
      🔇
    </button>

    <button class="play">
      ▶
    </button>


    <div class="actions">

      <div class="avatar">

        ${initial}

        <span class="plus">
          +
        </span>

      </div>


      <button class="action like">

        <span class="icon">
          🤍
        </span>

        <span class="count">
          0
        </span>

      </button>


      <button class="action comment">

        <span class="icon">
          💬
        </span>

        <span class="count">
          ${data.comments || 0}
        </span>

      </button>


      <button class="action save">

        <span class="icon">
          🔖
        </span>

        <span class="count">
          0
        </span>

      </button>


      <button class="action share">

        <span class="icon">
          ➤
        </span>

        <span class="count">
          Share
        </span>

      </button>


      <button class="action music">

        <span class="icon">
          ♫
        </span>

        <span class="count">
          Original
        </span>

      </button>

    </div>


    <div class="info">

      <div class="user">
        @${username}
      </div>

      <div class="caption">
        ${escapeHTML(
          data.caption ||
          "#xdark"
        )}
      </div>

      <button class="follow">
        Follow
      </button>

    </div>

  `;


  feed.appendChild(
    element
  );


  const video =
  element.querySelector(
    "video"
  );

  const play =
  element.querySelector(
    ".play"
  );

  const sound =
  element.querySelector(
    ".sound"
  );


  /* VIDEO PLAY */

  video.addEventListener(
    "loadeddata",
    () => {

      video
      .play()
      .catch(
        () => {

          play.classList.add(
            "show"
          );

        }
      );

    }
  );


  video.addEventListener(
    "error",
    () => {

      play.classList.add(
        "show"
      );

    }
  );


  video.onclick =
  () => {

    if(video.paused){

      video
      .play()
      .then(
        () =>
        play.classList.remove(
          "show"
        )
      );

    }else{

      video.pause();

      play.classList.add(
        "show"
      );

    }

  };


  play.onclick =
  () => {

    video
    .play()
    .then(
      () =>
      play.classList.remove(
        "show"
      )
    );

  };


  /* SOUND */

  sound.onclick =
  () => {

    video.muted =
    !video.muted;

    sound.textContent =
    video.muted
    ? "🔇"
    : "🔊";

  };


  /* LIKE */

  const likeButton =
  element.querySelector(
    ".like"
  );

  const heart =
  likeButton.querySelector(
    ".icon"
  );

  const number =
  likeButton.querySelector(
    ".count"
  );


  if(id !== "demo"){

    getDocs(
      collection(
        db,
        "videos",
        id,
        "likes"
      )
    )
    .then(
      snapshot => {

        number.textContent =
        snapshot.size;


        if(
          auth.currentUser &&
          snapshot.docs.some(
            item =>
            item.id ===
            auth.currentUser.uid
          )
        ){

          heart.textContent =
          "❤️";

        }

      }
    )
    .catch(
      () => {}
    );

  }


  likeButton.onclick =
  async () => {

    if(id === "demo"){

      toast(
        "Login to like ❤️"
      );

      return;

    }


    if(!auth.currentUser){

      toast(
        "Login to like ❤️"
      );

      page("login");

      return;

    }


    const likeRef =
    doc(
      db,
      "videos",
      id,
      "likes",
      auth.currentUser.uid
    );


    try{

      const existing =
      await getDoc(
        likeRef
      );


      if(existing.exists()){

        await deleteDoc(
          likeRef
        );

        heart.textContent =
        "🤍";

        number.textContent =
        Math.max(
          0,
          Number(number.textContent) - 1
        );

      }else{

        await setDoc(
          likeRef,
          {

            userId:
            auth.currentUser.uid,

            createdAt:
            serverTimestamp()

          }
        );


        heart.textContent =
        "❤️";

        number.textContent =
        Number(number.textContent) + 1;

      }

    }catch(error){

      console.error(error);

      toast(
        "Like failed"
      );

    }

  };


  /* COMMENT */

  element
  .querySelector(".comment")
  .onclick =
  () => {

    toast(
      "Comments coming next 💬"
    );

  };


  /* SAVE */

  element
  .querySelector(".save")
  .onclick =
  () => {

    toast(
      "Saved 🔖"
    );

  };


  /* FOLLOW */

  element
  .querySelector(".follow")
  .onclick =
  () => {

    if(
      auth.currentUser
    ){

      toast(
        "Follow coming next"
      );

    }else{

      page("login");

    }

  };


  /* SHARE */

  element
  .querySelector(".share")
  .onclick =
  async () => {

    try{

      if(
        navigator.share
      ){

        await navigator.share({

          title:
          "X-Dark",

          text:
          data.caption ||
          "#xdark",

          url:
          data.videoUrl

        });

      }else{

        await navigator.clipboard.writeText(
          data.videoUrl
        );

        toast(
          "Link copied 🔗"
        );

      }

    }catch(error){}

  };

}


/* =====================================================
   AUTO PLAY
===================================================== */

function watchVideos(){

  const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(
        entry => {

          const video =
          entry.target;


          if(
            entry.isIntersecting
          ){

            video
            .play()
            .catch(
              () => {

                const card =
                video.closest(
                  ".card"
                );

                if(card){

                  card
                  .querySelector(
                    ".play"
                  )
                  .classList.add(
                    "show"
                  );

                }

              }
            );

          }else{

            video.pause();

          }

        }
      );

    },
    {
      threshold:.7
    }
  );


  document
  .querySelectorAll(
    "video"
  )
  .forEach(
    video =>
    observer.observe(
      video
    )
  );

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value){

  return String(value)
  .replace(
    /[&<>"']/g,
    character => {

      const map = {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      };

      return map[
        character
      ];

    }
  );

}
