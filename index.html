<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>X-DARK</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  outline:0;
  background:none;
  color:inherit;
}

/* ================= APP ================= */

#app{
  position:fixed;
  inset:0;
  background:#000;
  overflow:hidden;
}

/* ================= TOP ================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:66px;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    env(safe-area-inset-top)
    17px
    0
    17px;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.75),
      transparent
    );

  pointer-events:none;
}

.logo{
  pointer-events:auto;
  font-size:26px;
  font-weight:900;
  letter-spacing:-1px;
  text-shadow:0 2px 8px #000;
}

.logo span{
  color:#ff1744;
}

.top-profile{
  pointer-events:auto;
  padding:8px 16px;
  border-radius:22px;
  background:rgba(20,20,20,.72);
  border:1px solid rgba(255,255,255,.22);
  font-size:13px;
  backdrop-filter:blur(10px);
}

/* ================= FEED ================= */

.feed{
  position:absolute;
  inset:0;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  scrollbar-width:none;

  background:#000;
}

.feed::-webkit-scrollbar{
  display:none;
}

/* ================= VIDEO ================= */

.video-card{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100dvh;

  overflow:hidden;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  background:#000;
}

.video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;

  background:#000;
}

/* cinematic overlay */

.video-card:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.25),
      transparent 22%,
      transparent 58%,
      rgba(0,0,0,.82)
    );
}

/* ================= RIGHT ACTIONS ================= */

.actions{
  position:absolute;

  right:10px;

  bottom:
    calc(
      105px +
      env(safe-area-inset-bottom)
    );

  width:57px;

  z-index:20;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:16px;
}

/* ================= PROFILE ================= */

.creator{
  position:relative;

  width:47px;
  height:47px;

  margin-bottom:3px;
}

.creator img{
  width:47px;
  height:47px;

  border-radius:50%;

  object-fit:cover;

  border:2px solid #fff;

  background:#222;

  box-shadow:
    0 3px 10px rgba(0,0,0,.7);
}

.creator-plus{
  position:absolute;

  bottom:-7px;
  left:50%;

  transform:translateX(-50%);

  width:20px;
  height:20px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ff1744;

  border:2px solid #000;

  font-size:14px;
  font-weight:bold;
}

/* ================= ACTION ================= */

.action{
  width:52px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:3px;

  cursor:pointer;

  text-shadow:
    0 2px 7px rgba(0,0,0,.9);
}

.icon-box{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:rgba(0,0,0,.15);

  backdrop-filter:blur(2px);

  transition:
    transform .18s ease,
    background .18s ease;
}

.action:active .icon-box{
  transform:scale(.82);
}

/* SVG */

.icon-box svg{
  width:27px;
  height:27px;

  fill:none;

  stroke:#fff;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;

  filter:
    drop-shadow(
      0 2px 3px #000
    );
}


/* LIKE */

.like.active .icon-box{
  background:rgba(255,23,68,.16);
}

.like.active svg{
  fill:#ff1744;
  stroke:#ff1744;

  animation:heartPop .25s ease;
}

@keyframes heartPop{

  0%{
    transform:scale(.7);
  }

  70%{
    transform:scale(1.25);
  }

  100%{
    transform:scale(1);
  }

}


/* BOOKMARK */

.bookmark.active svg{
  fill:#fff;
}


/* COUNT */

.count{
  font-size:11px;
  font-weight:600;

  line-height:13px;

  color:#fff;
}

/* SHARE label */

.share-label{
  font-size:10px;
  font-weight:600;
}


/* ================= INFO ================= */

.video-info{
  position:absolute;

  left:17px;
  right:82px;

  bottom:
    calc(
      92px +
      env(safe-area-inset-bottom)
    );

  z-index:15;

  text-shadow:
    0 2px 8px #000;
}

.username{
  font-size:17px;
  font-weight:800;
  margin-bottom:6px;
}

.caption{
  font-size:13px;
  line-height:18px;
  margin-bottom:10px;
}

.follow{
  padding:7px 17px;

  border-radius:20px;

  background:#ff1744;

  font-size:13px;
  font-weight:700;
}

.follow.following{
  background:rgba(30,30,30,.8);
  border:1px solid rgba(255,255,255,.25);
}


/* ================= MUSIC ================= */

.music{
  position:absolute;

  right:14px;

  bottom:
    calc(
      91px +
      env(safe-area-inset-bottom)
    );

  transform:translateY(60px);

  z-index:15;

  display:flex;
  align-items:center;
  gap:6px;

  font-size:11px;

  opacity:.9;

  text-shadow:
    0 2px 5px #000;
}

.music-disc{
  width:30px;
  height:30px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#222;

  border:1px solid #fff;

  font-size:16px;
}


/* ================= BOTTOM ================= */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:
    calc(
      65px +
      env(safe-area-inset-bottom)
    );

  padding-bottom:
    env(safe-area-inset-bottom);

  z-index:90;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:
    rgba(0,0,0,.94);

  border-top:
    1px solid rgba(255,255,255,.10);

  backdrop-filter:blur(14px);
}

.nav{
  width:33%;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#777;

  font-size:25px;
}

.nav.active{
  color:#ff1744;
}

.upload{
  width:44px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:#151515;

  border:
    1px solid rgba(255,255,255,.3);

  font-size:27px;
}


/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;

  z-index:300;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;

  padding:
    24px
    20px
    calc(
      24px +
      env(safe-area-inset-bottom)
    );

  background:#111;

  border-radius:
    23px 23px 0 0;

  border-top:
    1px solid #333;
}

.modal-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

.file{
  width:100%;
  padding:14px;

  background:#1b1b1b;

  border:1px dashed #555;

  border-radius:13px;

  color:#fff;
}

.caption-input{
  width:100%;

  margin-top:11px;

  padding:14px;

  background:#1b1b1b;

  border:1px solid #333;

  border-radius:13px;

  color:#fff;

  outline:none;
}

.upload-submit{
  width:100%;

  margin-top:13px;

  padding:14px;

  border-radius:13px;

  background:#ff1744;

  font-weight:800;
}

.cancel{
  width:100%;

  margin-top:9px;

  padding:14px;

  border-radius:13px;

  background:#222;
}

.progress-wrap{
  display:none;

  width:100%;
  height:6px;

  margin-top:13px;

  border-radius:10px;

  background:#333;

  overflow:hidden;
}

.progress{
  width:0%;
  height:100%;
  background:#ff1744;
}


/* ================= LOGIN ================= */

.login{
  position:fixed;
  inset:0;

  z-index:400;

  display:none;

  background:#000;

  padding:
    95px
    22px
    30px;
}

.login.show{
  display:block;
}

.login h1{
  font-size:38px;
  margin-bottom:7px;
}

.login p{
  color:#888;
  margin-bottom:28px;
}

.login input{
  width:100%;

  padding:16px;

  margin-bottom:12px;

  border-radius:13px;

  border:1px solid #333;

  background:#151515;

  color:#fff;

  outline:none;
}

.login-main{
  width:100%;

  padding:16px;

  border-radius:13px;

  background:#ff1744;

  font-weight:800;
}

.google{
  width:100%;

  padding:16px;

  margin-top:11px;

  border-radius:13px;

  background:#fff;

  color:#111;

  font-weight:700;
}

.close-login{
  width:100%;

  padding:15px;

  margin-top:11px;

  border-radius:13px;

  background:#222;
}


/* ================= LOADING ================= */

.loading{
  position:fixed;
  inset:0;

  z-index:200;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;
}

.spinner{
  width:37px;
  height:37px;

  border:3px solid #333;

  border-top-color:#ff1744;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* ================= EMPTY ================= */

.empty{
  width:100%;
  height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  color:#777;
}

.empty h2{
  color:#ddd;
  margin-bottom:6px;
}


/* ================= MOBILE ================= */

@media(max-width:380px){

  .actions{
    right:6px;
    gap:13px;
  }

  .action-icon{
    width:36px;
    height:36px;
  }

  .icon-box svg{
    width:25px;
    height:25px;
  }

  .username{
    font-size:16px;
  }

  .caption{
    font-size:12px;
  }

}

</style>
</head>


<body>

<div id="app">


<!-- ================= TOP ================= -->

<header class="topbar">

  <div class="logo">
    X-<span>DARK</span>
  </div>

  <button
    id="profileTop"
    class="top-profile">
    Login
  </button>

</header>


<!-- ================= FEED ================= -->

<main
  id="feed"
  class="feed">

  <div
    id="loading"
    class="loading">

    <div class="spinner"></div>

  </div>

</main>


<!-- ================= BOTTOM ================= -->

<nav class="bottom">

  <button
    id="home"
    class="nav active">

    <svg width="25" height="25"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

      <path d="M3 10.5L12 3l9 7.5"/>
      <path d="M5 9.5V21h14V9.5"/>
      <path d="M9 21v-7h6v7"/>

    </svg>

  </button>


  <button
    id="openUpload"
    class="nav">

    <span class="upload">
      +
    </span>

  </button>


  <button
    id="user"
    class="nav">

    <svg width="25" height="25"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4.2 3.5-7 8-7s8 2.8 8 7"/>

    </svg>

  </button>

</nav>


<!-- ================= UPLOAD ================= -->

<div
  id="uploadModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-title">
      Upload Video 🎬
    </div>

    <input
      id="videoFile"
      class="file"
      type="file"
      accept="video/*">


    <input
      id="caption"
      class="caption-input"
      maxlength="150"
      placeholder="Write a caption...">


    <div
      id="progressWrap"
      class="progress-wrap">

      <div
        id="progress"
        class="progress">
      </div>

    </div>


    <button
      id="uploadSubmit"
      class="upload-submit">

      Upload Video

    </button>


    <button
      id="cancelUpload"
      class="cancel">

      Cancel

    </button>

  </div>

</div>


<!-- ================= LOGIN ================= -->

<section
  id="login"
  class="login">

  <h1>
    Welcome Back
  </h1>

  <p>
    Login to X-Dark
  </p>


  <input
    id="email"
    type="email"
    placeholder="Email">


  <input
    id="password"
    type="password"
    placeholder="Password">


  <button
    id="loginSubmit"
    class="login-main">

    Login

  </button>


  <button
    id="googleLogin"
    class="google">

    Continue with Google

  </button>


  <button
    id="closeLogin"
    class="close-login">

    Close

  </button>

</section>


</div>


<script type="module">

/* ==================================================
   FIREBASE
================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  updateDoc,
  increment,
  doc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
  "darkwing-a717a.firebaseapp.com",

  projectId:
  "darkwing-a717a",

  storageBucket:
  "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
  "352453390196",

  appId:
  "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
  "G-5RVX9NET3W"

};


const app =
initializeApp(
  firebaseConfig
);


const auth =
getAuth(app);


const db =
getFirestore(app);


const googleProvider =
new GoogleAuthProvider();


/* ==================================================
   CLOUDINARY
================================================== */

const CLOUD_NAME =
"lrpb7uuy";

const UPLOAD_PRESET =
"x_dark_videos";

const CLOUDINARY_URL =
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* ==================================================
   STATE
================================================== */

let currentUser =
null;


/* ==================================================
   ELEMENTS
================================================== */

const feed =
document.getElementById("feed");

const loading =
document.getElementById("loading");

const uploadModal =
document.getElementById("uploadModal");

const loginScreen =
document.getElementById("login");

const progressWrap =
document.getElementById("progressWrap");

const progress =
document.getElementById("progress");


/* ==================================================
   AUTH
================================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
    user;

    document.getElementById(
      "profileTop"
    ).textContent =
      user
      ? "Profile"
      : "Login";

    loadVideos();

  }
);


/* ==================================================
   LOGIN OPEN
================================================== */

function openLogin(){

  loginScreen.classList.add(
    "show"
  );

}


/* ==================================================
   LOGIN CLOSE
================================================== */

function closeLogin(){

  loginScreen.classList.remove(
    "show"
  );

}


/* ==================================================
   PROFILE TOP
================================================== */

document
.getElementById(
  "profileTop"
)
.onclick =
() => {

  if(currentUser){

    alert(
      "Logged in as:\n" +
      currentUser.email
    );

  }else{

    openLogin();

  }

};


/* ==================================================
   LOGIN
================================================== */

document
.getElementById(
  "loginSubmit"
)
.onclick =
async () => {

  const email =
    document
    .getElementById("email")
    .value
    .trim();

  const password =
    document
    .getElementById("password")
    .value;


  if(
    !email ||
    !password
  ){

    alert(
      "Enter email and password."
    );

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    closeLogin();

    alert(
      "Login successful!"
    );

  }catch(error){

    alert(
      error.message
    );

  }

};


/* ==================================================
   GOOGLE
================================================== */

document
.getElementById(
  "googleLogin"
)
.onclick =
async () => {

  try{

    await signInWithPopup(
      auth,
      googleProvider
    );

    closeLogin();

  }catch(error){

    alert(
      error.message
    );

  }

};


/* ==================================================
   UPLOAD OPEN
================================================== */

document
.getElementById(
  "openUpload"
)
.onclick =
() => {

  if(!currentUser){

    openLogin();

    return;

  }

  uploadModal.classList.add(
    "show"
  );

};


/* ==================================================
   UPLOAD CLOSE
================================================== */

document
.getElementById(
  "cancelUpload"
)
.onclick =
() => {

  uploadModal.classList.remove(
    "show"
  );

};


/* ==================================================
   CLOUDINARY UPLOAD
================================================== */

document
.getElementById(
  "uploadSubmit"
)
.onclick =
async () => {

  if(!currentUser){

    openLogin();

    return;

  }


  const file =
    document
    .getElementById(
      "videoFile"
    )
    .files[0];


  if(!file){

    alert(
      "Select a video first."
    );

    return;

  }


  if(
    file.size >
    100 * 1024 * 1024
  ){

    alert(
      "Maximum video size is 100 MB."
    );

    return;

  }


  progressWrap.style.display =
    "block";

  progress.style.width =
    "0%";


  const form =
    new FormData();


  form.append(
    "file",
    file
  );


  form.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  const xhr =
    new XMLHttpRequest();


  xhr.open(
    "POST",
    CLOUDINARY_URL
  );


  xhr.upload.onprogress =
    event => {

      if(
        event.lengthComputable
      ){

        const percent =
          (
            event.loaded /
            event.total
          ) * 100;

        progress.style.width =
          percent + "%";

      }

    };


  xhr.onload =
    async () => {

      if(
        xhr.status < 200 ||
        xhr.status >= 300
      ){

        alert(
          "Cloudinary upload failed."
        );

        return;

      }


      try{

        const result =
          JSON.parse(
            xhr.responseText
          );


        const text =
          document
          .getElementById(
            "caption"
          )
          .value
          .trim();


        await addDoc(
          collection(
            db,
            "videos"
          ),
          {

            videoUrl:
              result.secure_url,

            caption:
              text ||
              "#xdark",

            username:
              currentUser
              .displayName ||
              currentUser
              .email
              .split("@")[0],

            userId:
              currentUser.uid,

            likes:
              0,

            comments:
              0,

            createdAt:
              serverTimestamp()

          }
        );


        alert(
          "Video uploaded successfully!"
        );


        document
        .getElementById(
          "videoFile"
        )
        .value =
          "";


        document
        .getElementById(
          "caption"
        )
        .value =
          "";


        progressWrap.style.display =
          "none";


        progress.style.width =
          "0%";


        uploadModal.classList.remove(
          "show"
        );


        loadVideos();


      }catch(error){

        console.error(error);

        alert(
          "Database save failed."
        );

      }

    };


  xhr.onerror =
    () => {

      alert(
        "Network error."
      );

    };


  xhr.send(
    form
  );

};


/* ==================================================
   LOAD VIDEOS
================================================== */

async function loadVideos(){

  try{

    const snapshot =
      await getDocs(
        query(
          collection(
            db,
            "videos"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        )
      );


    feed.innerHTML =
      "";


    if(snapshot.empty){

      loading.style.display =
        "none";

      showDemo();

      return;

    }


    snapshot.forEach(
      item => {

        createCard(
          item.id,
          item.data()
        );

      }
    );


    loading.style.display =
      "none";


    setupObserver();


  }catch(error){

    console.error(error);

    loading.style.display =
      "none";

    feed.innerHTML = `

      <div class="empty">

        <div>

          <h2>
            X-DARK
          </h2>

          <p>
            No videos available
          </p>

        </div>

      </div>

    `;

  }

}


/* ==================================================
   DEMO
================================================== */

function showDemo(){

  createCard(
    "demo",
    {

/* ==================================================
   CREATE CARD
================================================== */

function createCard(
  id,
  data
){

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "video-card";


  const username =
    data.username ||
    "X-Dark User";


  const caption =
    data.caption ||
    "#xdark";


  const likes =
    data.likes ||
    0;


  const comments =
    data.comments ||
    0;


  const url =
    data.videoUrl ||
    "";


  const first =
    username
    .charAt(0)
    .toUpperCase();


  card.innerHTML = `

    <video
      class="video"
      src="${safe(url)}"
      playsinline
      webkit-playsinline
      loop
      preload="metadata">
    </video>


    <div class="actions">


      <div class="creator">

        <img
          src="
          https://ui-avatars.com/api/
          ?name=${encodeURIComponent(username)}
          &background=222222
          &color=ffffff
          &bold=true
          "
          alt="${safe(username)}">

        <div class="creator-plus">
          +
        </div>

      </div>


      <button
        class="action like">

        <div class="icon-box">
          ${icons.heart}
        </div>

        <div class="count">
          ${likes}
        </div>

      </button>


      <button
        class="action comment">

        <div class="icon-box">
          ${icons.comment}
        </div>

        <div class="count">
          ${comments}
        </div>

      </button>


      <button
        class="action bookmark">

        <div class="icon-box">
          ${icons.bookmark}
        </div>

        <div class="count">
          Save
        </div>

      </button>


      <button
        class="action share">

        <div class="icon-box">
          ${icons.share}
        </div>

        <div class="share-label">
          Share
        </div>

      </button>


    </div>


    <div class="video-info">

      <div class="username">
        @${safe(username)}
      </div>

      <div class="caption">
        ${safe(caption)}
      </div>

      <button class="follow">
        Follow
      </button>

    </div>


    <div class="music">

      <div class="music-disc">
        ♪
      </div>

      <span>
        Original
      </span>

    </div>

  `;


  feed.appendChild(
    card
  );


  const video =
    card.querySelector(
      ".video"
    );


  /* ======================
     VIDEO
  ====================== */

  video.addEventListener(
    "loadeddata",
    () => {

      /*
       No audio icon.
       Try sound automatically.
      */

      video.muted =
        false;

      video.play()
        .catch(
          () => {

            /*
             Browser may block
             autoplay with sound.
            */

          }
        );

    }
  );


  /* ======================
     LIKE
  ====================== */

  const like =
    card.querySelector(
      ".like"
    );


  like.onclick =
    async () => {

      if(
        like.classList.contains(
          "active"
        )
      ){

        return;

      }


      like.classList.add(
        "active"
      );


      const count =
        like.querySelector(
          ".count"
        );


      count.textContent =
        Number(
          count.textContent
        ) + 1;


      if(id === "demo"){

        return;

      }


      try{

        await updateDoc(
          doc(
            db,
            "videos",
            id
          ),
          {

            likes:
              increment(1)

          }
        );

      }catch(error){

        console.error(
          error
        );

      }

    };


  /* ======================
     COMMENT
  ====================== */

  card
  .querySelector(
    ".comment"
  )
  .onclick =
  () => {

    alert(
      "Comments feature coming next."
    );

  };


  /* ======================
     BOOKMARK
  ====================== */

  card
  .querySelector(
    ".bookmark"
  )
  .onclick =
  () => {

    const btn =
      card.querySelector(
        ".bookmark"
      );


    btn.classList.toggle(
      "active"
    );

  };


  /* ======================
     SHARE
  ====================== */

  card
  .querySelector(
    ".share"
  )
  .onclick =
  async () => {

    try{

      if(
        navigator.share
      ){

        await navigator.share({

          title:
            "X-DARK",

          text:
            `${username} on X-DARK`,

          url:
            url

        });

      }else{

        await navigator.clipboard
          .writeText(url);

        alert(
          "Video link copied!"
        );

      }

    }catch(error){

      console.log(
        "Share cancelled"
      );

    }

  };


  /* ======================
     FOLLOW
  ====================== */

  card
  .querySelector(
    ".follow"
  )
  .onclick =
  () => {

    const btn =
      card.querySelector(
        ".follow"
      );


    btn.classList.toggle(
      "following"
    );


    btn.textContent =
      btn.classList.contains(
        "following"
      )
      ? "Following"
      : "Follow";

  };

}


/* ==================================================
   VIDEO OBSERVER
================================================== */

function setupObserver(){

  const videos =
    document.querySelectorAll(
      ".video"
    );


  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            const video =
              entry.target;


            if(
              entry.isIntersecting
            ){

              /*
               Try sound automatically.
              */

              video.muted =
                false;

              video.play()
                .catch(
                  () => {}
                );

            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:.75
      }
    );


  videos.forEach(
    video =>
      observer.observe(
        video
      )
  );

}


/* ==================================================
   FIRST TAP = AUDIO UNLOCK
================================================== */

document.addEventListener(
  "pointerdown",
  () => {

    document
    .querySelectorAll(
      ".video"
    )
    .forEach(
      video => {

        video.muted =
          false;

        if(
          video.paused
        ){

          video.play()
            .catch(
              () => {}
            );

        }

      }
    );

  },
  {
    passive:true
  }
);

/* ==================================================
   ESCAPE
================================================== */

function safe(
  value
){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
