<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Dark</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050505;
  color:white;
  min-height:100vh;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:#080808;
  padding-bottom:75px;
}

header{
  position:fixed;
  top:0;
  width:100%;
  max-width:600px;
  height:58px;
  background:rgba(5,5,5,.92);
  backdrop-filter:blur(12px);
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #222;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#ff1744;
}

.headerBtn{
  background:#151515;
  color:white;
  border:1px solid #333;
  border-radius:20px;
  padding:8px 13px;
}

main{
  padding-top:60px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* FEED */

.feed{
  height:calc(100vh - 60px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.videoCard{
  height:calc(100vh - 60px);
  min-height:600px;
  position:relative;
  scroll-snap-align:start;
  background:#000;
  overflow:hidden;
}

.videoCard video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.videoOverlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 45%,
    rgba(0,0,0,.15) 60%,
    rgba(0,0,0,.9) 100%
  );
  pointer-events:none;
}

.videoInfo{
  position:absolute;
  left:15px;
  bottom:25px;
  right:80px;
  z-index:5;
}

.username{
  font-size:17px;
  font-weight:bold;
  margin-bottom:9px;
}

.caption{
  font-size:14px;
  line-height:1.4;
  margin-bottom:12px;
}

.followBtn{
  background:#ff1744;
  color:white;
  padding:7px 15px;
  border-radius:18px;
  font-weight:bold;
}

.actions{
  position:absolute;
  right:10px;
  bottom:25px;
  display:flex;
  flex-direction:column;
  gap:17px;
  z-index:8;
}

.action{
  width:52px;
  color:white;
  text-align:center;
  background:transparent;
  font-size:26px;
}

.action small{
  display:block;
  font-size:11px;
  margin-top:3px;
}

.muted{
  position:absolute;
  top:18px;
  right:15px;
  background:rgba(0,0,0,.55);
  border-radius:50%;
  width:42px;
  height:42px;
  color:white;
  font-size:20px;
  z-index:8;
}

/* AUTH */

.authBox{
  padding:35px 22px;
}

.authBox h1{
  font-size:34px;
  margin-bottom:8px;
}

.authBox p{
  color:#999;
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid #333;
  background:#151515;
  color:white;
  outline:none;
}

.primary{
  width:100%;
  padding:15px;
  background:#ff1744;
  color:white;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}

.google{
  width:100%;
  padding:15px;
  background:white;
  color:#111;
  border-radius:12px;
  font-weight:bold;
}

.switch{
  margin-top:20px;
  text-align:center;
  color:#aaa;
}

.switch span{
  color:#ff1744;
  cursor:pointer;
  font-weight:bold;
}

/* UPLOAD */

.uploadBox{
  padding:25px 18px;
}

.uploadBox h2{
  margin-bottom:20px;
}

.fileInput{
  width:100%;
  padding:15px;
  background:#151515;
  border:1px dashed #555;
  color:white;
  border-radius:12px;
  margin-bottom:15px;
}

.progress{
  height:8px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progressBar{
  height:100%;
  width:0%;
  background:#ff1744;
}

.status{
  color:#aaa;
  font-size:13px;
}

/* PROFILE */

.profile{
  padding:25px 18px;
  text-align:center;
}

.avatar{
  width:85px;
  height:85px;
  border-radius:50%;
  background:#ff1744;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:bold;
  margin:20px auto 12px;
}

.profile h2{
  margin-bottom:5px;
}

.profile p{
  color:#888;
}

.profileBtns{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.profileBtns button{
  flex:1;
  padding:13px;
  border-radius:10px;
  background:#191919;
  color:white;
  border:1px solid #333;
}

/* NAV */

nav{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:600px;
  height:68px;
  background:rgba(5,5,5,.96);
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

nav button{
  background:none;
  color:#888;
  font-size:23px;
}

nav button.active{
  color:#ff1744;
}

.empty{
  padding:80px 20px;
  text-align:center;
  color:#777;
}

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:20px;
  display:none;
  z-index:100;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">X-<span>DARK</span></div>
  <button class="headerBtn" id="authHeaderBtn">Login</button>
</header>

<main>

<!-- HOME -->
<section id="homePage" class="page active">
  <div id="feed" class="feed">
    <div class="empty">Loading X-Dark...</div>
  </div>
</section>

<!-- LOGIN -->
<section id="loginPage" class="page">
  <div class="authBox">
    <h1>Welcome Back</h1>
    <p>Login to X-Dark</p>

    <input id="loginEmail" class="input" type="email" placeholder="Email">
    <input id="loginPassword" class="input" type="password" placeholder="Password">

    <button class="primary" id="loginBtn">Login</button>
    <button class="google" id="googleBtn">🔵 Continue with Google</button>

    <div class="switch">
      Don't have an account?
      <span id="showSignup">Sign up</span>
    </div>
  </div>
</section>

<!-- SIGNUP -->
<section id="signupPage" class="page">
  <div class="authBox">
    <h1>Create Account</h1>
    <p>Join X-Dark</p>

    <input id="signupName" class="input" type="text" placeholder="Username">
    <input id="signupEmail" class="input" type="email" placeholder="Email">
    <input id="signupPassword" class="input" type="password" placeholder="Password">

    <button class="primary" id="signupBtn">Create Account</button>

    <div class="switch">
      Already have an account?
      <span id="showLogin">Login</span>
    </div>
  </div>
</section>

<!-- UPLOAD -->
<section id="uploadPage" class="page">
  <div class="uploadBox">
    <h2>Upload Video 🎬</h2>

    <input
      id="videoFile"
      class="fileInput"
      type="file"
      accept="video/mp4,video/webm,video/quicktime,video/x-matroska"
    >

    <input
      id="caption"
      class="input"
      type="text"
      maxlength="150"
      placeholder="Write a caption..."
    >

    <button class="primary" id="uploadBtn">
      Upload to X-Dark
    </button>

    <div class="progress">
      <div id="progressBar" class="progressBar"></div>
    </div>

    <div id="uploadStatus" class="status">
      Maximum video size: 100 MB
    </div>
  </div>
</section>

<!-- PROFILE -->
<section id="profilePage" class="page">
  <div class="profile">

    <div id="avatar" class="avatar">?</div>

    <h2 id="profileName">Guest</h2>
    <p id="profileEmail">Not logged in</p>

    <div class="profileBtns">
      <button id="logoutBtn">Logout</button>
    </div>

  </div>
</section>

</main>

<nav>
  <button class="navBtn active" data-page="homePage">⌂</button>
  <button class="navBtn" data-page="uploadPage">＋</button>
  <button class="navBtn" data-page="profilePage">♙</button>
</nav>

<div id="toast"></div>

</div>

<script type="module">

/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",
  authDomain: "darkwing-a717a.firebaseapp.com",
  projectId: "darkwing-a717a",
  storageBucket: "darkwing-a717a.firebasestorage.app",
  messagingSenderId: "352453390196",
  appId: "1:352453390196:web:7c375a26a823b5633a4621",
  measurementId: "G-5RVX9NET3W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* =========================
   CLOUDINARY
========================= */

const CLOUD_NAME = "lrpb7uuy";
const UPLOAD_PRESET = "x_dark_videos";

const CLOUDINARY_URL =
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* =========================
   HELPERS
========================= */

const $ = id => document.getElementById(id);

function toast(message){

  const box = $("toast");

  box.textContent = message;
  box.style.display = "block";

  setTimeout(()=>{
    box.style.display = "none";
  },2500);
}


/* =========================
   PAGE NAVIGATION
========================= */

function showPage(pageId){

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  $(pageId).classList.add("active");

  document.querySelectorAll(".navBtn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.page === pageId
    );
  });

  window.scrollTo(0,0);
}

document.querySelectorAll(".navBtn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    const page = btn.dataset.page;

    if(page === "uploadPage" && !auth.currentUser){

      toast("Login required to upload");

      showPage("loginPage");

      return;
    }

    showPage(page);
  });

});


$("authHeaderBtn").onclick = ()=>{

  if(auth.currentUser){

    showPage("profilePage");

  }else{

    showPage("loginPage");

  }

};


/* =========================
   SIGNUP
========================= */

$("signupBtn").onclick = async ()=>{

  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  if(!name || !email || !password){

    toast("Fill all fields");

    return;
  }

  if(password.length < 6){

    toast("Password must be 6+ characters");

    return;
  }

  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(result.user,{
      displayName:name
    });

    toast("Account created 🎉");

    showPage("homePage");

  }catch(error){

    toast(error.message);

  }

};


/* =========================
   LOGIN
========================= */

$("loginBtn").onclick = async ()=>{

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if(!email || !password){

    toast("Enter email and password");

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    toast("Login successful ✅");

    showPage("homePage");

  }catch(error){

    toast(error.message);

  }

};


/* =========================
   GOOGLE LOGIN
========================= */

$("googleBtn").onclick = async ()=>{

  try{

    const provider =
      new GoogleAuthProvider();

    await signInWithPopup(
      auth,
      provider
    );

    toast("Google login successful ✅");

    showPage("homePage");

  }catch(error){

    toast(error.message);

  }

};


/* =========================
   LOGIN / SIGNUP SWITCH
========================= */

$("showSignup").onclick =
()=>showPage("signupPage");

$("showLogin").onclick =
()=>showPage("loginPage");


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth,user=>{

  if(user){

    $("authHeaderBtn").textContent = "Profile";

    $("profileName").textContent =
      user.displayName || "X-Dark User";

    $("profileEmail").textContent =
      user.email || "";

    $("avatar").textContent =
      (user.displayName || "X")
      .charAt(0)
      .toUpperCase();

  }else{

    $("authHeaderBtn").textContent = "Login";

    $("profileName").textContent = "Guest";

    $("profileEmail").textContent =
      "Not logged in";

    $("avatar").textContent = "?";

  }

});


/* =========================
   LOGOUT
========================= */

$("logoutBtn").onclick = async ()=>{

  await signOut(auth);

  toast("Logged out");

  showPage("homePage");

};


/* =========================
   CLOUDINARY UPLOAD
========================= */

$("uploadBtn").onclick = ()=>{

  if(!auth.currentUser){

    toast("Please login first");

    showPage("loginPage");

    return;
  }

  const file =
    $("videoFile").files[0];

  const caption =
    $("caption").value.trim();

  if(!file){

    toast("Select a video");

    return;
  }

  if(file.size > 100 * 1024 * 1024){

    toast("Video must be under 100 MB");

    return;
  }

  const formData = new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );

  $("uploadStatus").textContent =
    "Uploading video...";

  const xhr = new XMLHttpRequest();

  xhr.open(
    "POST",
    CLOUDINARY_URL
  );

  xhr.upload.onprogress = event =>{

    if(event.lengthComputable){

      const percent =
        Math.round(
          event.loaded / event.total * 100
        );

      $("progressBar").style.width =
        percent + "%";

      $("uploadStatus").textContent =
        `Uploading ${percent}%`;

    }

  };


  xhr.onload = async ()=>{

    if(xhr.status >= 200 && xhr.status < 300){

      try{

        const data =
          JSON.parse(xhr.responseText);

        const videoUrl =
          data.secure_url;

        $("uploadStatus").textContent =
          "Saving video...";

        await addDoc(
          collection(db,"videos"),
          {
            videoUrl:videoUrl,
            caption:caption,
            username:
              auth.currentUser.displayName ||
              "X-Dark User",
            userId:
              auth.currentUser.uid,
            likes:0,
            comments:0,
            createdAt:
              serverTimestamp()
          }
        );

        $("uploadStatus").textContent =
          "Upload complete ✅";

        $("progressBar").style.width =
          "100%";

        $("videoFile").value = "";
        $("caption").value = "";

        toast("Video uploaded 🎉");

        await loadVideos();

        setTimeout(()=>{
          showPage("homePage");
        },800);

      }catch(error){

        console.error(error);

        $("uploadStatus").textContent =
          "Firestore error";

        toast(error.message);

      }

    }else{

      $("uploadStatus").textContent =
        "Cloudinary upload failed";

      toast("Upload failed");

    }

  };


  xhr.onerror = ()=>{

    $("uploadStatus").textContent =
      "Network error";

    toast("Network error");

  };


  xhr.send(formData);

};


/* =========================
   LOAD GLOBAL VIDEOS
========================= */

async function loadVideos(){

  const feed =
    $("feed");

  feed.innerHTML =
    `<div class="empty">Loading videos...</div>`;

  try{

    const videosQuery =
      query(
        collection(db,"videos"),
        orderBy("createdAt","desc")
      );

    const snapshot =
      await getDocs(videosQuery);

    if(snapshot.empty){

      feed.innerHTML = `
        <div class="empty">
          <h2>No videos yet</h2>
          <p>Be the first to upload 🚀</p>
        </div>
      `;

      return;
    }

    feed.innerHTML = "";

    snapshot.forEach(docSnap=>{

      const data =
        docSnap.data();

      createVideoCard(
        data,
        docSnap.id
      );

    });

    activateVideos();

  }catch(error){

    console.error(error);

    feed.innerHTML = `
      <div class="empty">
        <h2>Feed unavailable</h2>
        <p>Firestore rules need to be configured.</p>
      </div>
    `;

  }

}


/* =========================
   VIDEO CARD
========================= */

function createVideoCard(data,id){

  const card =
    document.createElement("div");

  card.className =
    "videoCard";

  card.innerHTML = `

    <video
      src="${data.videoUrl}"
      playsinline
      loop
      muted
      preload="metadata">
    </video>

    <div class="videoOverlay"></div>

    <button class="muted">🔇</button>

    <div class="videoInfo">

      <div class="username">
        @${escapeHtml(data.username || "user")}
      </div>

      <div class="caption">
        ${escapeHtml(data.caption || "")}
      </div>

      <button class="followBtn">
        Follow
      </button>

    </div>

    <div class="actions">

      <button class="action likeBtn">
        ❤️
        <small>${data.likes || 0}</small>
      </button>

      <button class="action commentBtn">
        💬
        <small>${data.comments || 0}</small>
      </button>

      <button class="action shareBtn">
        ↗️
        <small>Share</small>
      </button>

    </div>
  `;

  $("feed").appendChild(card);

  const video =
    card.querySelector("video");

  const mute =
    card.querySelector(".muted");

  mute.onclick = ()=>{

    video.muted =
      !video.muted;

    mute.textContent =
      video.muted ? "🔇" : "🔊";

  };


  card.querySelector(".likeBtn").onclick =
    ()=>{

      const small =
        card.querySelector(".likeBtn small");

      let count =
        parseInt(small.textContent) || 0;

      count++;

      small.textContent =
        count;

    };


  card.querySelector(".shareBtn").onclick =
    async ()=>{

      try{

        await navigator.clipboard.writeText(
          data.videoUrl
        );

        toast("Video link copied 🔗");

      }catch{

        toast("Share unavailable");

      }

    };


  card.querySelector(".commentBtn").onclick =
    ()=>{

      if(!auth.currentUser){

        toast("Login to comment");

        return;
      }

      const text =
        prompt("Write your comment:");

      if(text){

        toast("Comment feature next step 💬");

      }

    };

}


function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   AUTO PLAY VIDEOS
========================= */

function activateVideos(){

  const videos =
    document.querySelectorAll(
      ".videoCard video"
    );

  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const video =
            entry.target;

          if(entry.isIntersecting){

            video.play()
              .catch(()=>{});

          }else{

            video.pause();

          }

        });

      },
      {
        threshold:.65
      }
    );

  videos.forEach(video=>{
    observer.observe(video);
  });

}


/* =========================
   START
========================= */

loadVideos();

</script>

</body>
</html>
