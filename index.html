<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>X-Dark</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button{
  border:0;
  background:none;
  color:#fff;
  font-family:inherit;
}

#app{
  width:100%;
  height:100dvh;
  position:relative;
  background:#000;
}


/* =========================
   TOP
========================= */

.topbar{
  position:fixed;
  z-index:30;
  top:0;
  left:0;
  right:0;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 15px;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.8),
    transparent
  );
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#ff1744;
}

.topIcon{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.10);

  display:flex;
  align-items:center;
  justify-content:center;
}

.topIcon svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:#fff;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================
   FEED
========================= */

#feed{
  width:100%;
  height:100dvh;
  overflow-y:auto;

  scroll-snap-type:y mandatory;

  scrollbar-width:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.videoCard{
  position:relative;

  width:100%;
  height:100dvh;

  overflow:hidden;

  background:#000;

  scroll-snap-align:start;
  scroll-snap-stop:always;
}

.video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}

.videoCard:after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:linear-gradient(
    to top,
    rgba(0,0,0,.88),
    rgba(0,0,0,.15) 45%,
    transparent 72%
  );
}


/* =========================
   VIDEO TOP MENU
========================= */

.postMenuButton{
  position:absolute;
  z-index:20;

  top:62px;
  right:12px;

  width:40px;
  height:40px;

  border-radius:50%;

  background:rgba(0,0,0,.35);

  backdrop-filter:blur(10px);

  display:flex;
  align-items:center;
  justify-content:center;
}

.postMenuButton svg{
  width:22px;
  height:22px;

  fill:#fff;
}


/* =========================
   SOUND
========================= */

.soundHint{
  position:absolute;
  z-index:18;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  padding:11px 16px;

  border-radius:25px;

  background:rgba(0,0,0,.58);

  backdrop-filter:blur(12px);

  font-size:12px;
  font-weight:800;

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

.soundHint.show{
  opacity:1;
}


/* =========================
   VIDEO INFO
========================= */

.videoInfo{
  position:absolute;
  z-index:10;

  left:15px;
  right:92px;
  bottom:83px;
}

.userRow{
  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:9px;
}

.avatar{
  width:40px;
  height:40px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    #ff1744,
    #7c4dff
  );

  border:2px solid #fff;

  font-size:12px;
  font-weight:900;
}

.username{
  font-size:14px;
  font-weight:850;
}

.followBtn{
  padding:5px 10px;

  border:1px solid rgba(255,255,255,.8);

  border-radius:7px;

  font-size:10px;
  font-weight:800;
}

.caption{
  font-size:14px;
  line-height:1.4;

  margin-bottom:7px;
}

.audioText{
  font-size:12px;
  opacity:.85;
}


/* =========================
   ACTIONS
========================= */

.actions{
  position:absolute;
  z-index:15;

  right:8px;
  bottom:78px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:15px;
}

.action{
  width:46px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

.actionButton{
  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.22);

  backdrop-filter:blur(8px);

  transition:.15s;
}

.actionButton:active{
  transform:scale(.82);
}

.actionButton svg{
  width:25px;
  height:25px;

  fill:none;
  stroke:#fff;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.actionCount{
  margin-top:3px;

  font-size:10px;
  font-weight:800;
}

.likeButton.active svg{
  fill:#ff1744;
  stroke:#ff1744;
}

.saveButton.active svg{
  fill:#fff;
}

.profileAction{
  position:relative;
}

.profileAction .avatar{
  width:44px;
  height:44px;
}

.plus{
  position:absolute;

  right:-2px;
  bottom:-3px;

  width:17px;
  height:17px;

  border-radius:50%;

  background:#ff1744;

  border:2px solid #000;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
  font-weight:900;
}


/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
  position:fixed;
  z-index:40;

  left:0;
  right:0;
  bottom:0;

  height:65px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:linear-gradient(
    to top,
    rgba(0,0,0,.96),
    transparent
  );
}

.navButton{
  width:50px;
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.navButton svg{
  width:24px;
  height:24px;

  fill:none;
  stroke:#fff;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.uploadButton{
  width:46px;
  height:34px;

  border-radius:11px;

  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;
}

.uploadButton svg{
  stroke:#000;
}


/* =========================
   POST MENU SHEET
========================= */

#menuOverlay{
  position:fixed;
  z-index:80;

  inset:0;

  background:rgba(0,0,0,.55);

  opacity:0;
  pointer-events:none;

  transition:.2s;
}

#menuOverlay.show{
  opacity:1;
  pointer-events:auto;
}

#postMenu{
  position:fixed;
  z-index:90;

  left:12px;
  right:12px;
  bottom:12px;

  padding:8px;

  background:#171717;

  border:1px solid #333;

  border-radius:20px;

  transform:translateY(120%);

  transition:.25s;
}

#postMenu.open{
  transform:translateY(0);
}

.menuItem{
  width:100%;

  height:50px;

  display:flex;
  align-items:center;

  gap:13px;

  padding:0 15px;

  border-radius:12px;

  font-size:14px;
  font-weight:700;

  text-align:left;
}

.menuItem:active{
  background:#252525;
}

.menuItem svg{
  width:21px;
  height:21px;

  fill:none;
  stroke:#fff;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.menuItem.danger{
  color:#ff4262;
}

.menuItem.danger svg{
  stroke:#ff4262;
}

.menuCancel{
  margin-top:6px;

  background:#252525;

  justify-content:center;
}


/* =========================
   COMMENTS
========================= */

#commentOverlay{
  position:fixed;
  z-index:100;

  inset:0;

  background:rgba(0,0,0,.58);

  opacity:0;
  pointer-events:none;

  transition:.25s;
}

#commentOverlay.show{
  opacity:1;
  pointer-events:auto;
}

#commentSheet{
  position:fixed;
  z-index:110;

  left:0;
  right:0;
  bottom:0;

  height:min(72dvh,620px);

  display:flex;
  flex-direction:column;

  background:#111;

  border-radius:25px 25px 0 0;

  transform:translateY(110%);

  transition:.28s;
}

#commentSheet.open{
  transform:translateY(0);
}

.commentHeader{
  height:58px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-bottom:1px solid #252525;

  position:relative;
}

.commentHeader:before{
  content:"";

  position:absolute;

  top:8px;

  width:38px;
  height:4px;

  border-radius:10px;

  background:#555;
}

.commentTitle{
  font-size:15px;
  font-weight:900;
}

.closeComments{
  position:absolute;

  right:13px;

  width:35px;
  height:35px;

  border-radius:50%;

  background:#222;

  font-size:20px;
}

#commentsList{
  flex:1;

  overflow-y:auto;

  padding:15px;
}

.comment{
  display:flex;

  gap:10px;

  margin-bottom:18px;
}

.commentAvatar{
  width:35px;
  height:35px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    #ff1744,
    #651fff
  );

  font-size:11px;
  font-weight:900;
}

.commentUser{
  color:#aaa;

  font-size:11px;
  font-weight:800;

  margin-bottom:3px;
}

.commentText{
  font-size:14px;
  line-height:1.4;
}

.emptyComments{
  text-align:center;

  color:#666;

  padding:55px 20px;

  font-size:13px;
}

.commentInputArea{
  flex-shrink:0;

  display:flex;

  gap:8px;

  padding:10px 12px;

  padding-bottom:max(
    10px,
    env(safe-area-inset-bottom)
  );

  border-top:1px solid #252525;
}

#commentInput{
  flex:1;

  height:44px;

  padding:0 15px;

  border-radius:23px;

  border:1px solid #303030;

  outline:none;

  background:#1d1d1d;

  color:#fff;

  font-size:14px;
}

.sendComment{
  width:44px;
  height:44px;

  flex-shrink:0;

  border-radius:50%;

  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;
}

.sendComment svg{
  width:20px;
  height:20px;

  fill:none;
  stroke:#000;

  stroke-width:2;
}


/* =========================
   PROFILE
========================= */

#profilePage{
  position:fixed;
  z-index:120;

  inset:0;

  display:none;

  overflow-y:auto;

  background:#050505;
}

.profileTop{
  position:sticky;

  top:0;

  z-index:5;

  height:60px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:rgba(5,5,5,.92);

  backdrop-filter:blur(18px);

  border-bottom:1px solid #202020;
}

.profileTopTitle{
  font-size:17px;
  font-weight:900;
}

.profileTopButton{
  min-width:65px;
  height:35px;

  padding:0 10px;

  border-radius:10px;

  background:#181818;

  font-size:12px;
  font-weight:800;
}

.profileHeader{
  text-align:center;

  padding:30px 18px 22px;
}

.bigAvatar{
  width:92px;
  height:92px;

  margin:auto;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    #ff1744,
    #651fff
  );

  border:3px solid white;

  font-size:27px;
  font-weight:900;
}

.profileName{
  margin-top:13px;

  font-size:21px;
  font-weight:900;
}

.profileBio{
  margin-top:6px;

  color:#999;

  font-size:13px;
}

.profileStats{
  display:flex;

  justify-content:center;

  gap:42px;

  margin-top:22px;
}

.profileStat{
  display:flex;
  flex-direction:column;

  gap:4px;
}

.profileStat strong{
  font-size:17px;
}

.profileStat span{
  color:#888;

  font-size:11px;
}

.editProfileButton{
  margin-top:20px;

  width:150px;
  height:38px;

  border-radius:10px;

  background:#1b1b1b;

  border:1px solid #333;

  font-size:12px;
  font-weight:800;
}

.profileTabs{
  height:48px;

  display:flex;

  border-top:1px solid #202020;
  border-bottom:1px solid #202020;
}

.profileTab{
  flex:1;

  color:#777;

  font-size:12px;
  font-weight:800;
}

.profileTab.active{
  color:#fff;

  border-bottom:2px solid #fff;
}

.videoGrid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:2px;

  padding-bottom:30px;
}

.profileVideo{
  width:100%;

  aspect-ratio:9/13;

  overflow:hidden;

  background:#151515;
}

.profileVideo video{
  width:100%;
  height:100%;

  object-fit:cover;
}

.profileEmpty{
  grid-column:1/-1;

  padding:70px 20px;

  text-align:center;

  color:#666;

  font-size:13px;
}


/* =========================
   EDIT PROFILE
========================= */

#editProfileModal{
  position:fixed;
  z-index:140;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.75);

  backdrop-filter:blur(10px);
}

.editBox{
  width:100%;
  max-width:390px;

  padding:20px;

  border-radius:22px;

  background:#171717;

  border:1px solid #333;
}

.editHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.editHeader b{
  font-size:17px;
}

.editClose{
  width:35px;
  height:35px;

  border-radius:50%;

  background:#252525;

  font-size:20px;
}

.bioInput{
  width:100%;

  min-height:90px;

  resize:none;

  margin-bottom:10px;

  padding:13px;

  border-radius:13px;

  border:1px solid #303030;

  outline:none;

  background:#202020;

  color:#fff;

  font-size:14px;
}


/* =========================
   LOADER
========================= */

#loader{
  position:fixed;
  z-index:200;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.72);
}

.spinner{
  width:42px;
  height:42px;

  border:3px solid #333;

  border-top-color:#fff;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  z-index:300;

  left:50%;
  bottom:85px;

  transform:translate(-50%,20px);

  padding:10px 16px;

  border-radius:13px;

  background:#181818;

  font-size:13px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  white-space:nowrap;
}

#toast.show{
  opacity:1;

  transform:translate(-50%,0);
}

</style>
</head>


<body>

<div id="app">

  <header class="topbar">

    <div class="logo">
      X<span>-Dark</span>
    </div>

    <button
      class="topIcon"
      onclick="showToast('Search coming soon')">

      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

    </button>

  </header>


  <main id="feed"></main>


  <nav class="bottomNav">

    <button
      class="navButton"
      onclick="goHome()">

      <svg viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v11h14V9"></path>
        <path d="M9 20v-6h6v6"></path>
      </svg>

    </button>


    <button
      class="navButton"
      onclick="showToast('Search coming soon')">

      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

    </button>


    <label class="navButton">

      <div class="uploadButton">

        <svg viewBox="0 0 24 24">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>

      </div>

      <input
        id="uploadInput"
        type="file"
        accept="video/mp4,video/webm,video/quicktime"
        hidden>

    </label>


    <button
      class="navButton"
      onclick="openProfile()">

      <svg viewBox="0 0 24 24">
        <path d="M20 21a8 8 0 0 0-16 0"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>

    </button>


    <button
      class="navButton"
      onclick="loadVideos()">

      <svg viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
        <path d="M20 4v6h-6"></path>
      </svg>

    </button>

  </nav>

</div>


<!-- LOGIN -->

<div id="loginScreen">

  <div class="loginBox">

    <h1 id="authTitle">
      Welcome to X-Dark
    </h1>

    <p id="authSub" class="loginSub">
      Login with your username
    </p>

    <input
      id="usernameInput"
      class="input"
      type="text"
      placeholder="Username">

    <input
      id="passwordInput"
      class="input"
      type="password"
      placeholder="Password">

    <button
      id="authButton"
      class="mainButton"
      onclick="handleAuth()">
      Login
    </button>

    <button
      class="googleButton"
      onclick="googleLogin()">
      Continue with Google
    </button>

    <div
      class="switchMode"
      onclick="toggleAuthMode()">

      <span id="switchText">
        Create a new account
      </span>

    </div>

  </div>

</div>


<!-- POST MENU -->

<div
  id="menuOverlay"
  onclick="closePostMenu()">
</div>


<div id="postMenu">

  <button
    class="menuItem"
    onclick="copyPostLink()">

    <svg viewBox="0 0 24 24">
      <path d="M10 13a5 5 0 0 0 7.07.07l2-2a5 5 0 0 0-7.07-7.07l-1.15 1.15"></path>
      <path d="M14 11a5 5 0 0 0-7.07-.07l-2 2A5 5 0 0 0 7 20l1.15-1.15"></path>
    </svg>

    Copy link

  </button>


  <button
    class="menuItem"
    onclick="showToast('Post reported')">

    <svg viewBox="0 0 24 24">
      <path d="M5 21V4"></path>
      <path d="M5 4h12l-2 4 2 4H5"></path>
    </svg>

    Report

  </button>


  <button
    id="deletePostButton"
    class="menuItem danger"
    onclick="deletePost()">

    <svg viewBox="0 0 24 24">
      <path d="M4 7h16"></path>
      <path d="M10 11v6"></path>
      <path d="M14 11v6"></path>
      <path d="M6 7l1 14h10l1-14"></path>
      <path d="M9 7V4h6v3"></path>
    </svg>

    Delete post

  </button>


  <button
    class="menuItem menuCancel"
    onclick="closePostMenu()">

    Cancel

  </button>

</div>


<!-- COMMENTS -->

<div
  id="commentOverlay"
  onclick="closeComments()">
</div>


<section id="commentSheet">

  <div class="commentHeader">

    <div class="commentTitle">
      Comments
    </div>

    <button
      class="closeComments"
      onclick="closeComments()">
      ×
    </button>

  </div>


  <div id="commentsList"></div>


  <div class="commentInputArea">

    <input
      id="commentInput"
      type="text"
      maxlength="500"
      placeholder="Add a comment...">


    <button
      class="sendComment"
      onclick="sendComment()">

      <svg viewBox="0 0 24 24">
        <path d="M22 2 11 13"></path>
        <path d="m22 2-7 20-4-9-9-4Z"></path>
      </svg>

    </button>

  </div>

</section>


<!-- PROFILE -->

<section id="profilePage">

  <div class="profileTop">

    <button
      class="profileTopButton"
      onclick="closeProfile()">
      ‹ Back
    </button>

    <div class="profileTopTitle">
      Profile
    </div>

    <button
      class="profileTopButton"
      onclick="logoutUser()">
      Logout
    </button>

  </div>


  <div class="profileHeader">

    <div
      id="bigAvatar"
      class="bigAvatar">
      U
    </div>

    <div
      id="profileName"
      class="profileName">
      @User
    </div>

    <div
      id="profileBio"
      class="profileBio">
      Welcome to X-Dark 🚀
    </div>


    <div class="profileStats">

      <div class="profileStat">
        <strong id="videoCount">0</strong>
        <span>Videos</span>
      </div>

      <div class="profileStat">
        <strong id="followersCount">0</strong>
        <span>Followers</span>
      </div>

      <div class="profileStat">
        <strong id="followingCount">0</strong>
        <span>Following</span>
      </div>

    </div>


    <button
      class="editProfileButton"
      onclick="openEditProfile()">
      Edit Profile
    </button>

  </div>


  <div class="profileTabs">

    <button class="profileTab active">
      Videos
    </button>

    <button

/* =========================
   VIDEO PLAYBACK
========================= */

function activateVideos(){

  const videos=
    document.querySelectorAll(
      ".video"
    );


  const observer=
    new IntersectionObserver(
      entries=>{

        entries.forEach(
          entry=>{

            const video=
              entry.target;


            const hint=
              video
                .closest(".videoCard")
                .querySelector(
                  ".soundHint"
                );


            if(
              entry.isIntersecting
            ){

              videos.forEach(
                other=>{

                  if(
                    other!==video
                  ){

                    other.pause();

                  }

                }
              );


              /*
                Mobile browsers allow
                muted autoplay reliably.
              */

              video.muted=true;


              video.play()
                .then(()=>{

                  if(!soundUnlocked){

                    hint.classList.add(
                      "show"
                    );

                    setTimeout(
                      ()=>{
                        hint.classList.remove(
                          "show"
                        );
                      },
                      2200
                    );

                  }

                })
                .catch(
                  error=>{
                    console.log(
                      "Playback:",
                      error
                    );
                  }
                );

            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:.65
      }
    );


  videos.forEach(
    video=>
      observer.observe(video)
  );

}


/* =========================
   SOUND
========================= */

function unlockSound(video){

  soundUnlocked=true;


  document
    .querySelectorAll(".video")
    .forEach(
      other=>{

        if(
          other!==video
        ){

          other.pause();

        }

      }
    );


  video.muted=false;


  video.play()
    .then(()=>{

      const hint=
        video
          .closest(".videoCard")
          .querySelector(
            ".soundHint"
          );


      hint.classList.remove(
        "show"
      );

    })
    .catch(
      ()=>{
        video.muted=true;
      }
    );

}


/*
  First interaction anywhere on the app
  tries to unlock the current video.
*/

document.addEventListener(
  "pointerdown",
  ()=>{
    
    const visible=
      [...document.querySelectorAll(
        ".video"
      )]
      .find(
        video=>{
          const rect=
            video.getBoundingClientRect();

          return(
            rect.top<window.innerHeight*.7 &&
            rect.bottom>window.innerHeight*.3
          );
        }
      );


    if(
      visible &&
      !soundUnlocked
    ){

      unlockSound(visible);

    }

  },
  {
    passive:true
  }
);

async function loadComments(id){

      </div>

  try{

    const snapshot=
      await getDocs(
        collection(
          db,
          "videos",
          id,
          "comments"
        )
      );


    const comments=[];


    snapshot.forEach(
      item=>{

        comments.push(
          item.data()
        );

      }
    );


    comments.sort(
      (a,b)=>{

        const aTime=
          a.createdAt?.seconds ||
          0;

        const bTime=
          b.createdAt?.seconds ||
          0;

        return aTime-bTime;

      }
    );


    list.innerHTML="";


    if(
      comments.length===0
    ){

      list.innerHTML=
        `
          <div class="emptyComments">
            No comments yet.<br><br>
            Be the first to comment ✨
          </div>
        `;

      return;

    }


    comments.forEach(
      comment=>{

        displayComment(
          comment
        );

      }
    );


  }catch(error){

    console.error(error);

    list.innerHTML=
      `
        <div class="emptyComments">
          No comments yet.<br><br>
          Be the first to comment ✨
        </div>
      `;

  }

}

    formatCount(number+1);

async function loadProfile(){

  let followers=0;

  let following=0;


  try{

    const snap=

/* MY VIDEOS */

async function loadMyVideos(){

  const grid=
    document.getElementById(
      "myVideoGrid"
    );


  grid.innerHTML="";


  let total=0;


  try{

    const snapshot=
      await getDocs(
        collection(
          db,
          "videos"
        )
      );


    const posts=[];


    snapshot.forEach(
      item=>{

        const data=
          item.data();


        if(
          data.userId===
          currentUser.uid
        ){

          posts.push(
            data
          );

        }

      }
    );


    posts.sort(
      (a,b)=>{

        return(
          (b.createdAt?.seconds||0)-
          (a.createdAt?.seconds||0)
        );

      }
    );


    posts.forEach(
      data=>{

        total++;


        const box=
          document.createElement(
            "div"
          );


        box.className=
          "profileVideo";


        box.innerHTML=`

          <video
            src="${safe(data.url)}"
            muted
            playsinline
            preload="metadata">
          </video>

        `;


        grid.appendChild(box);

      }
    );


    document
      .getElementById(
        "videoCount"
      )
      .innerText=
        total;


    if(total===0){

      grid.innerHTML=
        `
          <div class="profileEmpty">
            No videos yet 🎬
          </div>
        `;

    }

  }catch(error){

    console.error(error);

    grid.innerHTML=
      `
        <div class="profileEmpty">
          Unable to load videos
        </div>
      `;

  }

}

/* =========================
   UPLOAD
========================= */

document
  .getElementById(
    "uploadInput"
  )
  .addEventListener(
    "change",
    uploadVideo
  );


async function uploadVideo(event){

  if(!currentUser){

    showToast(
      "Login first"
    );

    event.target.value="";

    return;

  }


  const file=
    event.target.files[0];


  if(!file)
    return;


  if(
    file.size>
    100*1024*1024
  ){

    showToast(
      "Maximum 100 MB"
    );

    event.target.value="";

    return;

  }


  try{

    setLoading(true);


    const caption=
      prompt(
        "Write a caption for your video:"
      ) ||
      "New X-Dark video 🚀";


    const form=
      new FormData();


    form.append(
      "file",
      file
    );


    form.append(
      "upload_preset",
      UPLOAD_PRESET
    );


    const response=
      await fetch(
        CLOUDINARY_URL,
        {

          method:"POST",

          body:form

        }
      );


    const result=
      await response.json();


    if(
      !result.secure_url
    ){

      console.log(result);

      throw new Error(
        "Cloudinary upload failed"
      );

    }


    const profile=
      await getDoc(
        doc(
          db,
          "users",
          currentUser.uid
        )
      );


    const username=
      profile.exists()
        ? profile.data().username
        : "User";


    await addDoc(
      collection(
        db,
        "videos"
      ),
      {

        url:
          result.secure_url,

        userId:
          currentUser.uid,

        username:
          username,

        caption:
          caption,

        likes:0,

        comments:0,

        createdAt:
          serverTimestamp()

      }
    );


    showToast(
      "Video uploaded ✓"
    );


    await loadVideos();


  }catch(error){

    console.error(error);

    showToast(
      "Video upload failed"
    );

  }finally{

    setLoading(false);

    event.target.value="";

  }

}


/* =========================
   HELPERS
========================= */

function formatCount(n){

  n=
    Number(n)||0;


  if(n>=1000000){

    return(
      (n/1000000)
        .toFixed(1)
        .replace(".0","")
      +"M"
    );

  }


  if(n>=1000){

    return(
      (n/1000)
        .toFixed(1)
        .replace(".0","")
      +"K"
    );

  }


  return String(n);

}


function safe(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function setLoading(show){

  document
    .getElementById(
      "loader"
    )
    .style.display=
      show
        ? "flex"
        : "none";

}


window.showToast=
function(message){

  const toast=
    document.getElementById(
      "toast"
    );


  toast.innerText=
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    ()=>{
      toast.classList.remove(
        "show"
      );
    },
    1800
  );

};
