<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#08090d">

<title>X-Dark</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#08090d;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  border:0;
  color:inherit;
  background:none;
}


/* =====================================================
   APP
===================================================== */

#app{
  min-height:100dvh;
  background:#08090d;
}


/* =====================================================
   TOP HEADER
===================================================== */

.header{
  position:sticky;
  z-index:50;

  top:0;

  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  background:
    rgba(8,9,13,.94);

  backdrop-filter:blur(18px);

  border-bottom:1px solid #191a20;
}

.brand{
  font-size:25px;
  font-weight:950;
  letter-spacing:-1.4px;
}

.brand span{
  color:#ff2d55;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.headerButton{
  width:40px;
  height:40px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;
}

.headerButton svg{
  width:24px;
  height:24px;

  fill:none;
  stroke:#fff;

  stroke-width:1.9;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =====================================================
   STORIES
===================================================== */

.stories{
  display:flex;

  gap:15px;

  overflow-x:auto;

  padding:12px 12px 15px;

  background:#08090d;

  border-bottom:1px solid #191a20;

  scrollbar-width:none;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:69px;

  display:flex;
  flex-direction:column;

  align-items:center;

  gap:5px;
}

.storyRing{
  width:66px;
  height:66px;

  padding:2px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #ff304f,
      #ff9d00,
      #9b2cff
    );
}

.storyAvatar{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:2px solid #08090d;

  background:
    linear-gradient(
      135deg,
      #292a33,
      #111217
    );

  font-size:18px;
  font-weight:900;
}

.storyName{
  width:70px;

  text-align:center;

  font-size:10px;

  color:#ddd;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.yourStory{
  position:relative;
}

.storyPlus{
  position:absolute;

  right:-1px;
  bottom:17px;

  width:21px;
  height:21px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ff2d55;

  border:2px solid #08090d;

  font-size:15px;
  font-weight:900;
}


/* =====================================================
   FEED
===================================================== */

#feed{
  width:100%;
  max-width:620px;

  margin:auto;

  padding-bottom:80px;
}

.emptyFeed{
  padding:90px 20px;

  text-align:center;

  color:#777;

  font-size:14px;
}


/* =====================================================
   POST
===================================================== */

.post{
  margin-bottom:13px;

  background:#0b0c11;

  border-bottom:1px solid #1b1c22;
}


/* =====================================================
   POST HEADER
===================================================== */

.postHeader{
  height:57px;

  display:flex;
  align-items:center;

  padding:7px 13px;

  gap:10px;
}

.postAvatar{
  width:38px;
  height:38px;

  flex-shrink:0;

  border-radius:50%;

  padding:2px;

  background:
    linear-gradient(
      135deg,
      #ff304f,
      #ff9d00,
      #8d35ff
    );
}

.postAvatarInner{
  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#171820;

  border:2px solid #0b0c11;

  font-size:10px;
  font-weight:900;
}

.postUser{
  flex:1;

  min-width:0;
}

.postUsername{
  font-size:13px;
  font-weight:850;
}

.postAudio{
  margin-top:1px;

  color:#aaa;

  font-size:10px;
}

.verified{
  display:inline-flex;

  width:14px;
  height:14px;

  margin-left:3px;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#fff;
  color:#000;

  font-size:9px;
  font-weight:900;
}

.postMore{
  width:36px;
  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.postMore svg{
  width:21px;
  height:21px;

  fill:#fff;
}


/* =====================================================
   VIDEO
===================================================== */

.videoWrap{
  position:relative;

  width:100%;

  background:#000;

  overflow:hidden;
}

.postVideo{
  display:block;

  width:100%;

  max-height:76dvh;

  aspect-ratio:9/14;

  object-fit:cover;

  background:#000;
}

.videoPlay{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:58px;
  height:58px;

  display:none;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:rgba(0,0,0,.48);

  backdrop-filter:blur(8px);
}

.videoPlay svg{
  width:27px;
  height:27px;

  fill:#fff;
}

.videoWrap.paused .videoPlay{
  display:flex;
}

.soundHint{
  position:absolute;

  right:12px;
  bottom:12px;

  padding:7px 10px;

  border-radius:18px;

  background:rgba(0,0,0,.52);

  backdrop-filter:blur(10px);

  font-size:10px;

  opacity:0;

  transition:.2s;
}

.soundHint.show{
  opacity:1;
}


/* =====================================================
   POST ACTIONS
===================================================== */

.postActions{
  display:flex;
  align-items:center;

  padding:9px 12px 4px;

  gap:3px;
}

.actionBtn{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.actionBtn svg{
  width:25px;
  height:25px;

  fill:none;
  stroke:#fff;

  stroke-width:1.9;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.actionBtn.like.active svg{
  fill:#ff304f;
  stroke:#ff304f;
}

.actionBtn.save{
  margin-left:auto;
}

.actionBtn.save.active svg{
  fill:#fff;
}

.likeText{
  padding:0 13px 4px;

  font-size:12px;
  font-weight:800;
}

.postCaption{
  padding:0 13px 7px;

  font-size:12px;

  line-height:1.45;
}

.postCaption b{
  margin-right:5px;
}

.viewComments{
  padding:0 13px 12px;

  color:#777;

  font-size:11px;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottomNav{
  position:fixed;

  z-index:60;

  left:0;
  right:0;
  bottom:0;

  height:64px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:
    rgba(8,9,13,.96);

  backdrop-filter:blur(20px);

  border-top:1px solid #1b1c22;

  padding-bottom:2px;
}

.navItem{
  width:54px;
  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.navItem svg{
  width:25px;
  height:25px;

  fill:none;
  stroke:#fff;

  stroke-width:1.9;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.uploadNav{
  width:44px;
  height:34px;

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
}

.uploadNav svg{
  stroke:#000;
  width:23px;
  height:23px;
}


/* =====================================================
   SEARCH
===================================================== */

#searchScreen{
  position:fixed;

  z-index:120;

  inset:0;

  display:none;

  background:#08090d;
}

.searchHeader{
  height:60px;

  display:flex;
  align-items:center;

  gap:10px;

  padding:0 12px;

  border-bottom:1px solid #1b1c22;
}

.searchInput{
  flex:1;

  height:40px;

  border:0;
  outline:0;

  border-radius:11px;

  padding:0 14px;

  background:#202128;

  color:#fff;

  font-size:14px;
}

.closeSearch{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#1d1e24;

  font-size:22px;
}

.searchResults{
  padding:16px;
}


/* =====================================================
   COMMENTS SHEET
===================================================== */

#commentOverlay{
  position:fixed;

  z-index:130;

  inset:0;

  background:rgba(0,0,0,.60);

  opacity:0;

  pointer-events:none;

  transition:.22s;
}

#commentOverlay.show{
  opacity:1;
  pointer-events:auto;
}

#commentSheet{
  position:fixed;

  z-index:140;

  left:0;
  right:0;
  bottom:0;

  height:min(72dvh,620px);

  display:flex;
  flex-direction:column;

  background:#111218;

  border-radius:24px 24px 0 0;

  transform:translateY(110%);

  transition:.28s;
}

#commentSheet.open{
  transform:translateY(0);
}

.commentHead{
  height:56px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-bottom:1px solid #24252b;
}

.commentHead b{
  font-size:14px;
}

.commentClose{
  position:absolute;

  right:12px;

  width:35px;
  height:35px;

  border-radius:50%;

  background:#24252b;

  font-size:20px;
}

#commentsList{
  flex:1;

  overflow-y:auto;

  padding:15px;
}

.comment{
  display:flex;

  gap:9px;

  margin-bottom:17px;
}

.commentAvatar{
  width:35px;
  height:35px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #ff304f,
      #7538ff
    );

  font-size:9px;
  font-weight:900;
}

.commentUser{
  font-size:11px;

  font-weight:850;

  color:#aaa;

  margin-bottom:2px;
}

.commentText{
  font-size:13px;

  line-height:1.4;
}

.noComments{
  padding:70px 20px;

  text-align:center;

  color:#666;

  font-size:13px;
}

.commentInputRow{
  display:flex;

  gap:8px;

  padding:9px 12px;

  padding-bottom:
    max(9px,env(safe-area-inset-bottom));

  border-top:1px solid #24252b;
}

.commentInput{
  flex:1;

  min-width:0;

  height:43px;

  padding:0 14px;

  border-radius:22px;

  outline:none;

  border:1px solid #303139;

  background:#202128;

  color:#fff;

  font-size:13px;
}

.commentSend{
  width:43px;
  height:43px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
}

.commentSend svg{
  width:19px;
  height:19px;

  fill:none;
  stroke:#000;

  stroke-width:2;
}


/* =====================================================
   PROFILE
===================================================== */

#profileScreen{
  position:fixed;

  z-index:110;

  inset:0;

  display:none;

  overflow-y:auto;

  background:#08090d;

  padding-bottom:75px;
}

.profileHeader{
  text-align:center;

  padding:25px 16px 18px;
}

.profileAvatar{
  width:88px;
  height:88px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #ff304f,
      #713cff
    );

  border:3px solid #fff;

  font-size:24px;
  font-weight:900;
}

.profileUsername{
  margin-top:10px;

  font-size:19px;
  font-weight:900;
}

.profileBio{
  margin-top:5px;

  color:#888;

  font-size:12px;
}

.profileStats{
  display:flex;

  justify-content:center;

  gap:40px;

  margin-top:19px;
}

.profileStat{
  display:flex;
  flex-direction:column;

  gap:3px;
}

.profileStat b{
  font-size:16px;
}

.profileStat span{
  color:#777;

  font-size:10px;
}

.profileEdit{
  margin-top:17px;

  width:145px;
  height:36px;

  border:1px solid #36373e;

  border-radius:9px;

  font-size:11px;
  font-weight:850;
}

.profileGrid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:2px;
}

.gridVideo{
  width:100%;

  aspect-ratio:9/13;

  object-fit:cover;

  background:#15161b;
}

.profileTop{
  height:57px;

  position:sticky;
  top:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 13px;

  background:rgba(8,9,13,.95);

  backdrop-filter:blur(16px);

  border-bottom:1px solid #1b1c22;
}

.profileTop b{
  font-size:16px;
}

.profileTop button{
  width:38px;
  height:38px;

  border-radius:50%;

  background:#1d1e24;
}


/* =====================================================
   SETTINGS
===================================================== */

#settingsScreen{
  position:fixed;

  z-index:160;

  inset:0;

  display:none;

  background:#08090d;
}

.settingsTop{
  height:58px;

  display:flex;
  align-items:center;

  padding:0 13px;

  border-bottom:1px solid #1b1c22;
}

.settingsTop b{
  margin:auto;

  font-size:16px;
}

.settingsBack{
  width:38px;
  height:38px;

  border-radius:50%;

  background:#1c1d23;

  font-size:22px;
}

.settingRow{
  width:100%;

  min-height:56px;

  display:flex;
  align-items:center;

  padding:0 17px;

  border-bottom:1px solid #1b1c22;

  font-size:13px;
  font-weight:750;
}

.settingRow span{
  margin-left:auto;

  color:#777;

  font-size:11px;
}

.settingDanger{
  color:#ff304f;
}


/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
  position:fixed;

  z-index:500;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at 20% 10%,
      #3a1023,
      #090a0f 50%,
      #000
    );
}

.loginBox{
  width:100%;
  max-width:390px;

  padding:27px 22px;

  border-radius:25px;

  background:#17181d;

  border:1px solid #303139;
}

.loginTitle{
  font-size:29px;
  font-weight:950;
}

.loginSub{
  margin-top:5px;
  margin-bottom:22px;

  color:#888;

  font-size:13px;
}

.loginInput{
  width:100%;
  height:50px;

  margin-bottom:10px;

  padding:0 14px;

  border-radius:12px;

  outline:none;

  border:1px solid #303139;

  background:#22232a;

  color:#fff;

  font-size:14px;
}

.loginButton{
  width:100%;
  height:50px;

  border-radius:12px;

  background:#fff;

  color:#000;

  font-size:14px;
  font-weight:900;
}

.googleButton{
  width:100%;
  height:49px;

  margin-top:9px;

  border-radius:12px;

  background:#202126;

  border:1px solid #33343b;

  font-size:13px;
  font-weight:850;
}

.switchAuth{
  margin-top:16px;

  text-align:center;

  color:#888;

  font-size:12px;
}

.switchAuth b{
  color:#fff;
}


/* =====================================================
   POST MENU
===================================================== */

#menuOverlay{
  position:fixed;

  z-index:170;

  inset:0;

  background:rgba(0,0,0,.60);

  opacity:0;

  pointer-events:none;

  transition:.2s;
}

#menuOverlay.show{
  opacity:1;

  pointer-events:auto;
}

#postMenu{
  position:fixed;

  z-index:180;

  left:10px;
  right:10px;
  bottom:10px;

  padding:7px;

  border-radius:21px;

  background:#191a20;

  border:1px solid #33343b;

  transform:translateY(120%);

  transition:.25s;
}

#postMenu.open{
  transform:translateY(0);
}

.menuItem{
  width:100%;
  height:49px;

  display:flex;
  align-items:center;

  gap:12px;

  padding:0 14px;

  border-radius:11px;

  font-size:13px;
  font-weight:800;

  text-align:left;
}

.menuItem svg{
  width:20px;
  height:20px;

  fill:none;
  stroke:#fff;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.menuDelete{
  color:#ff304f;
}

.menuDelete svg{
  stroke:#ff304f;
}

.menuCancel{
  justify-content:center;

  background:#25262d;
}


/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;

  z-index:700;

  left:50%;
  bottom:78px;

  transform:
    translate(-50%,20px);

  padding:10px 15px;

  border-radius:13px;

  background:#202126;

  font-size:12px;
  font-weight:750;

  opacity:0;

  pointer-events:none;

  transition:.22s;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* =====================================================
   LOADER
===================================================== */

#loader{
  position:fixed;

  z-index:800;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.70);
}

.loaderCircle{
  width:40px;
  height:40px;

  border:3px solid #333;

  border-top-color:#fff;

  border-radius:50%;

  animation:rotate .8s linear infinite;
}

@keyframes rotate{
  to{
    transform:rotate(360deg);
  }
}

</style>

</head>


<body>


<!-- ===================================================
     APP
=================================================== -->

<div id="app">


<!-- HEADER -->

<header class="header">

  <div class="brand">
    X<span>-Dark</span>
  </div>

  <div class="headerRight">

    <button
      class="headerButton"
      onclick="openSearch()">

      <svg viewBox="0 0 24 24">

        <circle
          cx="11"
          cy="11"
          r="7">
        </circle>

        <path d="m20 20-4-4"></path>

      </svg>

    </button>


    <button
      class="headerButton"
      onclick="showToast('Notifications coming soon')">

      <svg viewBox="0 0 24 24">

        <path
          d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9">
        </path>

        <path
          d="M10 21h4">
        </path>

      </svg>

    </button>

  </div>

</header>


<!-- STORIES -->

<section class="stories">


  <div class="story">

    <div class="storyRing yourStory">

      <div class="storyAvatar">
        U
      </div>

      <div class="storyPlus">
        +
      </div>

    </div>

    <div class="storyName">
      Your story
    </div>

  </div>


  <div class="story">

    <div class="storyRing">

      <div class="storyAvatar">
        XD
      </div>

    </div>

    <div class="storyName">
      X-Dark
    </div>

  </div>


  <div class="story">

    <div class="storyRing">

      <div class="storyAvatar">
        ✦
      </div>

    </div>

    <div class="storyName">
      Trending
    </div>

  </div>


  <div class="story">

    <div class="storyRing">

      <div class="storyAvatar">
        🎬
      </div>

    </div>

    <div class="storyName">
      Movies
    </div>

  </div>


  <div class="story">

    <div class="storyRing">

      <div class="storyAvatar">
        🎵
      </div>

    </div>

    <div class="storyName">
      Music
    </div>

  </div>


  <div class="story">

    <div class="storyRing">

      <div class="storyAvatar">
        🔥
      </div>

    </div>

    <div class="storyName">
      Popular
    </div>

  </div>

</section>


<!-- FEED -->

<main id="feed">

  <div class="emptyFeed">
    Loading X-Dark...
  </div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottomNav">


  <button
    class="navItem"
    onclick="goHome()">

    <svg viewBox="0 0 24 24">

      <path d="m3 10 9-7 9 7"></path>

      <path d="M5 9v11h14V9"></path>

      <path d="M9 20v-6h6v6"></path>

    </svg>

  </button>


  <button
    class="navItem"
    onclick="openSearch()">

    <svg viewBox="0 0 24 24">

      <circle
        cx="11"
        cy="11"
        r="7">
      </circle>

/* =====================================================
   LOAD FEED
===================================================== */

async function loadFeed(){

  const feed =
    document.getElementById(
      "feed"
    );


  feed.innerHTML = `

    <div class="emptyFeed">
      Loading X-Dark...
    </div>

  `;


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "videos"
        )
      );


    const posts = [];


    snap.forEach(
      item => {

        posts.push({

          id:
            item.id,

          data:
            item.data()

        });

      }
    );


    posts.sort(
      (a,b)=>
        (
          b.data.createdAt?.seconds ||
          0
        )
        -
        (
          a.data.createdAt?.seconds ||
          0
        )
    );


    feed.innerHTML =
      "";


    if(
      posts.length === 0
    ){

      feed.innerHTML = `

        <div class="emptyFeed">

          🎬<br><br>

          No posts yet.<br>

          Upload the first X-Dark video.

        </div>

      `;

      return;

    }


    for(
      const post of posts
    ){

      await createPost(
        post.id,
        post.data
      );

    }


    activateVideoObserver();


  }catch(error){

    console.error(
      error
    );


    feed.innerHTML = `

      <div class="emptyFeed">

        Unable to load posts.

      </div>

    `;

  }

}

/* =====================================================
   VIDEO OBSERVER
===================================================== */

function activateVideoObserver(){

  const videos =
    document.querySelectorAll(
      ".postVideo"
    );


  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(
          entry=>{

            const video =
              entry.target;


            if(
              entry.isIntersecting
            ){

              videos.forEach(
                other=>{

                  if(
                    other !== video
                  ){

                    other.pause();

                  }

                }
              );


              video.muted =
                !soundUnlocked;


              video.play()
                .catch(
                  ()=>{}
                );


            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:.65
      }
    );


  videos.forEach(
    video=>{
      observer.observe(video);
    }
  );


  document.addEventListener(
    "pointerdown",
    unlockCurrentVideo,
    {
      once:true
    }
  );

}


/* =====================================================
   SOUND
===================================================== */

function unlockCurrentVideo(){

  const videos =
    document.querySelectorAll(
      ".postVideo"
    );


  for(
    const video of videos
  ){

    const rect =
      video.getBoundingClientRect();


    if(
      rect.top < window.innerHeight*.7 &&
      rect.bottom > window.innerHeight*.3
    ){

      unlockVideo(
        video
      );

      break;

    }

  }

}


function unlockVideo(
  video
){

  soundUnlocked =
    true;


  document
    .querySelectorAll(
      ".postVideo"
    )
    .forEach(
      other=>{

        if(
          other !== video
        ){

          other.pause();

        }

      }
    );


  video.muted =
    false;


  video.play()
    .catch(
      ()=>{
        video.muted =
          true;
      }
    );


  const hint =
    video
      .closest(".videoWrap")
      .querySelector(
        ".soundHint"
      );


  hint.classList.remove(
    "show"
  );

}

async function loadComments(
  id
){

  const list =
    document.getElementById(
      "commentsList"
    );


  list.innerHTML = `

    <div class="noComments">
      Loading...
    </div>

  `;


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "videos",
          id,
          "comments"
        )
      );


    list.innerHTML =
      "";


    const comments = [];


    snap.forEach(
      item=>{

        comments.push(
          item.data()
        );

      }
    );


    if(
      comments.length === 0
    ){

      list.innerHTML = `

        <div class="noComments">

          No comments yet ✨<br><br>

          Be the first to comment.

        </div>

      `;

      return;

    }


    comments.sort(
      (a,b)=>
        (
          a.createdAt?.seconds ||
          0
        )
        -
        (
          b.createdAt?.seconds ||
          0
        )
    );


    comments.forEach(
      displayComment
    );


  }catch(error){

    console.error(
      error
    );


    list.innerHTML = `

      <div class="noComments">

        No comments yet ✨

      </div>

    `;

  }

}


function displayComment(
  data
){

  const list =
    document.getElementById(
      "commentsList"
    );


  const username =
    data.username ||
    "User";


  const initials =
    username
      .substring(0,2)
      .toUpperCase();


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "comment";


  div.innerHTML = `

    <div class="commentAvatar">

      ${safe(initials)}

    </div>


    <div>

      <div class="commentUser">

        @${safe(username)}

      </div>


      <div class="commentText">

        ${safe(data.text)}

      </div>

    </div>

  `;


  list.appendChild(
    div
  );

}

async function uploadVideo(
  event
){

  if(
    !currentUser
  ){

    showToast(
      "Login first"
    );

    event.target.value =
      "";

    return;

  }


  const file =
    event.target.files[0];


  if(
    !file
  ){

    return;

  }


  if(
    file.size >
    100 * 1024 * 1024
  ){

    showToast(
      "Maximum video size is 100 MB"
    );

    event.target.value =
      "";

    return;

  }


  try{

    setLoading(true);


    const caption =
      prompt(
        "Write caption:"
      ) ||
      "New X-Dark video 🚀";


    const form =
      new FormData();


    form.append(
      "file",
      file
    );


    form.append(
      "upload_preset",
      UPLOAD_PRESET
    );


    const response =
      await fetch(
        CLOUDINARY_URL,
        {
          method:"POST",
          body:form
        }
      );


    const result =
      await response.json();


    if(
      !result.secure_url
    ){

      throw new Error(
        "Cloudinary upload failed"
      );

    }


    const profile =
      await getDoc(
        doc(
          db,
          "users",
          currentUser.uid
        )
      );


    const username =
      profile.exists()
        ? profile.data().username
        : "User";


    await addDoc(
      collection(
        db,
        "videos"
      ),
      {

        url:
          result.secure_url,

        userId:
          currentUser.uid,

        username:
          username,

        caption:
          caption,

        likes:
          0,

        comments:
          0,

        createdAt:
          serverTimestamp()

      }
    );


    showToast(
      "Video uploaded ✓"
    );


    await loadFeed();


  }catch(error){

    console.error(
      error
    );


    showToast(
      "Upload failed"
    );


  }finally{

    setLoading(false);

    event.target.value =
      "";

  }

}


/* =====================================================
   HELPERS
===================================================== */

function formatCount(
  number
){

  number =
    Number(number) || 0;


  if(
    number >= 1000000
  ){

    return(
      (number/1000000)
      .toFixed(1)
      .replace(".0","")
      + "M"
    );

  }


  if(
    number >= 1000
  ){

    return(
      (number/1000)
      .toFixed(1)
      .replace(".0","")
      + "K"
    );

  }


  return String(
    number
  );

}


function safe(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function setLoading(
  value
){

  document
    .getElementById(
      "loader"
    )
    .style.display =
      value
        ? "flex"
        : "none";

}


window.showToast =
function(
  message
){

  const toast =
    document.getElementById(

  toast.innerText =

  toast.classList.add(

  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      1900
    );

};
