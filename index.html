<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>X-DARK</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

button{
  border:0;
  font:inherit;
  color:inherit;
}

#app{
  width:100%;
  height:100dvh;
  background:#000;
  position:relative;
  overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:68px;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:
    env(safe-area-inset-top)
    18px
    0
    18px;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.72),
      rgba(0,0,0,.12),
      transparent
    );

  pointer-events:none;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:-1px;
  text-shadow:0 2px 8px rgba(0,0,0,.7);
  pointer-events:auto;
}

.logo span{
  color:#ff1744;
}

.profile-top{
  pointer-events:auto;
  background:rgba(20,20,20,.75);
  border:1px solid rgba(255,255,255,.2);
  border-radius:30px;
  padding:9px 17px;
  font-size:15px;
  backdrop-filter:blur(10px);
}

/* =========================
   FEED
========================= */

.feed{
  width:100%;
  height:100dvh;
  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

/* =========================
   VIDEO CARD
========================= */

.video-card{
  position:relative;
  width:100%;
  height:100dvh;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  overflow:hidden;
  background:#000;
}

.video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center center;

  background:#000;
}

/*
 IMPORTANT:
 video fills the complete phone screen.
 No fixed width/height.
*/

/* dark cinematic gradient */
.video-card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.30) 0%,
      transparent 22%,
      transparent 58%,
      rgba(0,0,0,.70) 100%
    );
}

/* =========================
   RIGHT ACTIONS
========================= */

.actions{
  position:absolute;
  right:12px;

  bottom:
    calc(
      90px +
      env(safe-area-inset-bottom)
    );

  z-index:20;

  width:58px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:17px;
}

.action{
  width:52px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:transparent;
  text-shadow:0 2px 7px rgba(0,0,0,.9);

  cursor:pointer;
}

.action-icon{
  width:39px;
  height:39px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
  line-height:1;

  filter:
    drop-shadow(
      0 2px 4px rgba(0,0,0,.8)
    );
}

.action-count{
  margin-top:4px;
  font-size:13px;
  font-weight:600;
}

.action-label{
  margin-top:4px;
  font-size:13px;
  font-weight:500;
}

.like.active .action-icon{
  color:#ff1744;
  transform:scale(1.08);
}

.bookmark.active .action-icon{
  color:#ff1744;
}

/* =========================
   PROFILE CIRCLE
========================= */

.creator-action{
  position:relative;
  margin-bottom:1px;
}

.creator-avatar{
  width:48px;
  height:48px;

  border-radius:50%;

  object-fit:cover;

  border:2px solid #fff;

  background:#222;
}

.follow-plus{
  position:absolute;

  right:0;
  bottom:-7px;

  width:21px;
  height:21px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ff1744;
  border:2px solid #000;

  font-size:16px;
  font-weight:bold;
}

/* =========================
   BOTTOM INFO
========================= */

.info{
  position:absolute;

  left:18px;
  right:82px;

  bottom:
    calc(
      92px +
      env(safe-area-inset-bottom)
    );

  z-index:15;

  display:flex;
  flex-direction:column;
  align-items:flex-start;

  pointer-events:none;
}

.username{
  font-size:18px;
  font-weight:800;

  margin-bottom:7px;

  text-shadow:
    0 2px 8px rgba(0,0,0,.9);
}

.caption{
  font-size:14px;
  line-height:1.35;

  max-width:100%;

  text-shadow:
    0 2px 8px rgba(0,0,0,.9);

  margin-bottom:12px;
}

.follow-btn{
  pointer-events:auto;

  padding:8px 18px;

  border-radius:22px;

  background:#ff1744;

  font-size:14px;
  font-weight:700;

  box-shadow:
    0 3px 12px rgba(0,0,0,.35);
}

.follow-btn.following{
  background:rgba(40,40,40,.8);
  border:1px solid rgba(255,255,255,.25);
}

/* =========================
   ORIGINAL MUSIC
========================= */

.music{
  position:absolute;

  right:16px;

  bottom:
    calc(
      88px +
      env(safe-area-inset-bottom)
    );

  transform:translateY(76px);

  z-index:18;

  display:flex;
  align-items:center;
  gap:7px;

  font-size:13px;

  text-shadow:
    0 2px 7px rgba(0,0,0,.9);

  pointer-events:none;
}

.music-disc{
  width:38px;
  height:38px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.7);

  background:#222;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  left:0;
  bottom:0;

  width:100%;

  height:
    calc(
      61px +
      env(safe-area-inset-bottom)
    );

  padding-bottom:
    env(safe-area-inset-bottom);

  z-index:90;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.96),
      rgba(0,0,0,.70)
    );

  border-top:
    1px solid rgba(255,255,255,.10);

  backdrop-filter:blur(12px);
}

.nav-btn{
  width:70px;
  height:52px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:transparent;

  font-size:25px;

  opacity:.75;
}

.nav-btn.active{
  color:#ff1744;
  opacity:1;
}

.upload-btn{
  width:47px;
  height:47px;

  border-radius:14px;

  background:#111;

  border:1px solid rgba(255,255,255,.28);

  font-size:29px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   EMPTY
========================= */

.empty{
  height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:10px;

  color:#999;

  text-align:center;
}

.empty-title{
  font-size:26px;
  font-weight:800;
  color:#ddd;
}

.empty-text{
  font-size:15px;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;

  z-index:200;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;
}

.loader{
  width:38px;
  height:38px;

  border:3px solid #333;
  border-top-color:#ff1744;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   UPLOAD MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  z-index:300;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;

  background:#111;

  border-radius:
    24px 24px 0 0;

  padding:
    24px
    20px
    calc(
      24px +
      env(safe-area-inset-bottom)
    );

  border-top:
    1px solid rgba(255,255,255,.12);
}

.modal-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:20px;
}

.file-input{
  width:100%;
  padding:15px;

  border-radius:14px;

  background:#1d1d1d;

  border:1px solid #333;

  color:#fff;
}

.caption-input{
  width:100%;

  margin-top:12px;

  padding:15px;

  border-radius:14px;

  background:#1d1d1d;

  border:1px solid #333;

  color:#fff;

  outline:none;
}

.upload-submit{
  width:100%;

  margin-top:14px;

  padding:15px;

  border-radius:14px;

  background:#ff1744;

  font-weight:800;
}

.close-modal{
  width:100%;

  margin-top:10px;

  padding:14px;

  border-radius:14px;

  background:#222;
}

.progress-wrap{
  width:100%;
  height:7px;

  margin-top:15px;

  background:#333;

  border-radius:10px;

  overflow:hidden;

  display:none;
}

.progress{
  height:100%;
  width:0%;

  background:#ff1744;
}

/* =========================
   LOGIN SCREEN
========================= */

.login-screen{
  position:fixed;
  inset:0;

  z-index:250;

  display:none;

  background:#000;

  padding:
    100px
    25px
    30px;
}

.login-screen.show{
  display:block;
}

.login-title{
  font-size:40px;
  font-weight:900;
  margin-bottom:8px;
}

.login-sub{
  color:#888;
  margin-bottom:35px;
}

.login-input{
  width:100%;

  padding:17px;

  margin-bottom:14px;

  background:#151515;

  border:1px solid #333;

  border-radius:14px;

  color:#fff;

  outline:none;
}

.login-btn{
  width:100%;

  padding:17px;

  background:#ff1744;

  border-radius:14px;

  font-weight:800;
}

.google-btn{
  width:100%;

  padding:17px;

  margin-top:12px;

  background:#fff;

  color:#111;

  border-radius:14px;

  font-weight:700;
}

.login-close{
  margin-top:15px;

  width:100%;

  padding:15px;

  background:#1b1b1b;

  border-radius:14px;
}

/* =========================
   SMALL SCREEN FIX
========================= */

@media(max-width:380px){

  .logo{
    font-size:23px;
  }

  .profile-top{
    font-size:14px;
    padding:8px 14px;
  }

  .actions{
    right:8px;
    gap:14px;
  }

  .action-icon{
    font-size:28px;
  }

  .info{
    left:14px;
    right:72px;
  }

  .username{
    font-size:16px;
  }

  .caption{
    font-size:13px;
  }
}
</style>
</head>

<!-- Firebase -->
<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  signOut
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  doc,
  updateDoc,
  increment,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* ======================================
   FIREBASE CONFIG
====================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
  "darkwing-a717a.firebaseapp.com",

  projectId:
  "darkwing-a717a",

  storageBucket:
  "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
  "352453390196",

  appId:
  "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
  "G-5RVX9NET3W"

};


/* ======================================
   FIREBASE START
====================================== */

const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);

const googleProvider =
  new GoogleAuthProvider();


/* ======================================
   CLOUDINARY
====================================== */

const CLOUD_NAME =
  "lrpb7uuy";

const UPLOAD_PRESET =
  "x_dark_videos";

const CLOUDINARY_URL =
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* ======================================
   ELEMENTS
====================================== */

const feed =
  document.getElementById("feed");

const loading =
  document.getElementById("loading");

const profileTop =
  document.getElementById("profileTop");

const uploadBtn =
  document.getElementById("uploadBtn");

const uploadModal =
  document.getElementById("uploadModal");

const closeModal =
  document.getElementById("closeModal");

const videoFile =
  document.getElementById("videoFile");

const videoCaption =
  document.getElementById("videoCaption");

const uploadSubmit =
  document.getElementById("uploadSubmit");

const progressWrap =
  document.getElementById("progressWrap");

const progress =
  document.getElementById("progress");

const loginScreen =
  document.getElementById("loginScreen");

const loginBtn =
  document.getElementById("loginBtn");

const googleBtn =
  document.getElementById("googleBtn");

const loginClose =
  document.getElementById("loginClose");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");


/* ======================================
   USER
====================================== */

let currentUser = null;


/* ======================================
   AUTH STATE
====================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser = user;

    if(user){

      profileTop.textContent =
        "Profile";

    }else{

      profileTop.textContent =
        "Login";

    }

    loadVideos();

  }
);


/* ======================================
   LOAD FIRESTORE VIDEOS
====================================== */

async function loadVideos(){

  loading.style.display =
    "flex";

  try{

    const videosRef =
      collection(db,"videos");

    const q =
      query(
        videosRef,
        orderBy(
          "createdAt",
          "desc"
        )
      );

    const snapshot =
      await getDocs(q);

    feed.innerHTML = "";

    if(snapshot.empty){

      showEmpty();

      loading.style.display =
        "none";

      return;

    }

    snapshot.forEach(
      docSnap => {

        createVideoCard(
          docSnap.id,
          docSnap.data()
        );

      }
    );

    setupVideoObserver();

  }catch(error){

    console.error(error);

    /*
      If Firestore index/rules causes
      an error, show local message.
    */

    feed.innerHTML = `
      <div class="empty">

        <div class="empty-title">
          Feed unavailable
        </div>

        <div class="empty-text">
          Firestore rules need to be configured.
        </div>

      </div>
    `;

  }

  loading.style.display =
    "none";
}


/* ======================================
   EMPTY
====================================== */

function showEmpty(){

  feed.innerHTML = `

    <div class="empty">

      <div class="empty-title">
        No videos yet
      </div>

      <div class="empty-text">
        Be the first to upload 🚀
      </div>

    </div>

  `;

}


/* ======================================
   CREATE VIDEO CARD
====================================== */

function createVideoCard(
  id,
  data
){

  const card =
    document.createElement("article");

  card.className =
    "video-card";

  card.dataset.id =
    id;


  const username =
    data.username ||
    data.email ||
    "X-Dark User";

  const caption =
    data.caption ||
    "#xdark";

  const likes =
    data.likes || 0;

  const comments =
    data.comments || 0;

  const videoUrl =
    data.videoUrl || "";


  card.innerHTML = `

    <video
      class="video"
      src="${escapeHtml(videoUrl)}"
      playsinline
      webkit-playsinline
      loop
      preload="metadata">
    </video>


    <!-- RIGHT ACTIONS -->

    <div class="actions">


      <!-- CREATOR -->

      <div
        class="action creator-action">

        <img
          class="creator-avatar"
          src="https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=222222&color=ffffff&bold=true"
          alt="profile">

        <div class="follow-plus">
          +
        </div>

      </div>


      <!-- LIKE -->

      <button
        class="action like">

        <div class="action-icon">
          ♥
        </div>

        <div class="action-count">
          ${likes}
        </div>

      </button>


      <!-- COMMENT -->

      <button
        class="action comment">

        <div class="action-icon">
          💬
        </div>

        <div class="action-count">
          ${comments}
        </div>

      </button>


      <!-- BOOKMARK -->

      <button
        class="action bookmark">

        <div class="action-icon">
          🔖
        </div>

        <div class="action-count">
          0
        </div>

      </button>


      <!-- SHARE -->

      <button
        class="action share">

        <div class="action-icon">
          ➤
        </div>

        <div class="action-label">
          Share
        </div>

      </button>

    </div>


    <!-- USER INFO -->

    <div class="info">

      <div class="username">
        @${escapeHtml(username)}
      </div>

      <div class="caption">
        ${escapeHtml(caption)}
      </div>

      <button
        class="follow-btn">

        Follow

      </button>

    </div>


    <!-- MUSIC -->

    <div class="music">

      <div class="music-disc">
        ♪
      </div>

      <span>
        Original
      </span>

    </div>

  `;


  feed.appendChild(card);


  /* ==================================
     LIKE
  ================================== */

  const likeBtn =
    card.querySelector(".like");

  likeBtn.addEventListener(
    "click",
    async event => {

      event.stopPropagation();

      if(
        likeBtn.classList.contains(
          "active"
        )
      ){
        return;
      }

      likeBtn.classList.add(
        "active"
      );

      const count =
        likeBtn.querySelector(
          ".action-count"
        );

      const oldCount =
        Number(count.textContent);

      count.textContent =
        oldCount + 1;


      try{

        await updateDoc(
          doc(
            db,
            "videos",
            id
          ),
          {
            likes:
              increment(1)
          }
        );

      }catch(error){

        console.error(error);

      }

    }
  );


  /* ==================================
     BOOKMARK
  ================================== */

  const bookmark =
    card.querySelector(
      ".bookmark"
    );

  bookmark.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      bookmark.classList.toggle(
        "active"
      );

    }
  );


  /* ==================================
     SHARE
  ================================== */

  const share =
    card.querySelector(
      ".share"
    );

  share.addEventListener(
    "click",
    async event => {

      event.stopPropagation();

      const shareData = {

        title:"X-DARK",

        text:
        `${username} on X-Dark`,

        url:
        videoUrl

      };


      try{

        if(
          navigator.share
        ){

          await navigator.share(
            shareData
          );

        }else{

          await navigator.clipboard.writeText(
            videoUrl
          );

          alert(
            "Video link copied!"
          );

        }

      }catch(error){

        console.log(
          "Share cancelled"
        );

      }

    }
  );


  /* ==================================
     FOLLOW
  ================================== */

  const follow =
    card.querySelector(
      ".follow-btn"
    );

  follow.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      if(
        follow.classList.contains(
          "following"
        )
      ){

        follow.classList.remove(
          "following"
        );

        follow.textContent =
          "Follow";

      }else{

        follow.classList.add(
          "following"
        );

        follow.textContent =
          "Following";

      }

    }
  );


  /* ==================================
     VIDEO TAP
  ================================== */

  const video =
    card.querySelector(
      ".video"
    );

  video.addEventListener(
    "click",
    () => {

      if(
        video.paused
      ){

        video.muted =
          false;

        video.play()
          .catch(() => {});

      }else{

        video.pause();

      }

    }
  );

}


/* ======================================
   VIDEO OBSERVER
====================================== */

function setupVideoObserver(){

  const videos =
    document.querySelectorAll(
      ".video"
    );


  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            const video =
              entry.target;


            if(
              entry.isIntersecting
            ){

              /*
                IMPORTANT:
                Audio icon is NOT shown.
              */

              video.muted =
                false;

              video.play()
                .catch(() => {

                  /*
                    iPhone may block
                    autoplay with sound.
                    First page interaction
                    below will retry.
                  */

                });

            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:0.75
      }
    );


  videos.forEach(
    video => {

      observer.observe(
        video
      );

    }
  );

}


/* ======================================
   FIRST USER INTERACTION
   ENABLE AUDIO
====================================== */

let audioUnlocked =
  false;


async function unlockAudio(){

  if(
    audioUnlocked
  ){
    return;
  }

  audioUnlocked =
    true;


  const videos =
    document.querySelectorAll(
      ".video"
    );


  videos.forEach(
    video => {

      video.muted =
        false;

      if(
        video.paused
      ){

        video.play()
          .catch(() => {});

      }

    }
  );

}


/*

  }

      );

    }

      "Uploading...";

        new FormData();

        "file",

      formData.append(

      const cloudinaryUrl =
        await uploadToCloudinary(
          formData

        videoCaption.value.trim() ||
        "#xdark";


      /*

      */

      await addDoc(
        collection(
          db,
          "videos"
        ),
        {

          videoUrl:
            cloudinaryUrl,

          caption:
            caption,

          username:
            currentUser.displayName ||
            currentUser.email
              .split("@")[0],

          email:
            currentUser.email,

          userId:
            currentUser.uid,

          likes:
            0,

            0,

          createdAt:
            serverTimestamp()

      );

        "Video uploaded successfully!"
      );

      progressWrap.style.display =

      alert(

    uploadSubmit.disabled =
      false;

  }
);


/* ======================================
   CLOUDINARY UPLOAD
====================================== */

function uploadToCloudinary(
  formData
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const xhr =
        new XMLHttpRequest();


      xhr.open(
        "POST",
        CLOUDINARY_URL
      );


      xhr.upload.onprogress =
        event => {

          if(
            event.lengthComputable
          ){

            const percent =
              (
                event.loaded /
                event.total
              ) * 100;

            progress.style.width =
              percent + "%";

          }

        };


      xhr.onload =
        () => {

          if(
            xhr.status >= 200 &&
            xhr.status < 300
          ){

            try{

              const result =
                JSON.parse(
                  xhr.responseText
                );

              resolve(
                result.secure_url
              );

            }catch(error){

              reject(error);

            }

          }else{

            reject(
              new Error(
                "Cloudinary upload failed."
              )
            );

          }

        };


      xhr.onerror =
        () => {

          reject(
            new Error(
              "Network error during upload."
            )
          );

        };


      xhr.send(
        formData
      );

    }
  );

}

/* ======================================
   ESCAPE HTML
====================================== */

function escapeHtml(
  text
){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
