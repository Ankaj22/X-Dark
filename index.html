<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>X-Dark</title>

<style>

/* =========================
   GLOBAL
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button{
  border:0;
  background:none;
  color:white;
  cursor:pointer;
}

input,
textarea{
  font-family:inherit;
}


/* =========================
   APP
========================= */

#app{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  position:fixed;
  z-index:30;

  top:0;
  left:0;
  right:0;

  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 15px;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.75),
      transparent
    );
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#ff1744;
}

.topButton{
  width:40px;
  height:40px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.10);

  backdrop-filter:blur(12px);
}

.topButton svg{
  width:21px;
  height:21px;

  fill:none;
  stroke:white;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================
   FEED
========================= */

#feed{
  width:100%;
  height:100dvh;

  overflow-y:auto;

  scroll-snap-type:y mandatory;

  scrollbar-width:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.videoCard{
  position:relative;

  width:100%;
  height:100dvh;

  overflow:hidden;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  background:#050505;
}

.video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}

.videoCard::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.82),
      rgba(0,0,0,.20) 40%,
      transparent 70%
    );
}


/* =========================
   VIDEO INFO
========================= */

.videoInfo{
  position:absolute;
  z-index:10;

  left:15px;
  right:90px;
  bottom:84px;
}

.userRow{
  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:9px;
}

.avatar{
  width:39px;
  height:39px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #ff1744,
      #651fff
    );

  border:2px solid white;

  font-size:12px;
  font-weight:900;
}

.username{
  font-size:14px;
  font-weight:800;
}

.followBtn{
  padding:5px 9px;

  border:1px solid rgba(255,255,255,.7);

  border-radius:7px;

  font-size:10px;
  font-weight:800;
}

.caption{
  font-size:14px;
  line-height:1.4;

  margin-bottom:7px;
}

.audioText{
  font-size:12px;
  opacity:.85;
}


/* =========================
   RIGHT ACTIONS
========================= */

.actions{
  position:absolute;
  z-index:15;

  right:9px;
  bottom:80px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:17px;
}

.action{
  width:46px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

.actionButton{
  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.20);

  backdrop-filter:blur(9px);

  transition:transform .15s;
}

.actionButton:active{
  transform:scale(.80);
}

.actionButton svg{
  width:25px;
  height:25px;

  fill:none;

  stroke:white;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.actionCount{
  margin-top:3px;

  font-size:10px;
  font-weight:800;
}

.likeButton.active svg{
  fill:#ff1744;
  stroke:#ff1744;
}

.saveButton.active svg{
  fill:white;
}

.profileAction{
  position:relative;
}

.profileAction .avatar{
  width:44px;
  height:44px;
}

.plus{
  position:absolute;

  right:-2px;
  bottom:-3px;

  width:17px;
  height:17px;

  border-radius:50%;

  background:#ff1744;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:13px;
  font-weight:900;

  border:2px solid #000;
}


/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
  position:fixed;
  z-index:40;

  left:0;
  right:0;
  bottom:0;

  height:65px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  padding-bottom:4px;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.92),
      transparent
    );
}

.navButton{
  width:50px;
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.navButton svg{
  width:24px;
  height:24px;

  fill:none;

  stroke:white;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.uploadButton{
  width:46px;
  height:34px;

  border-radius:10px;

  background:white;

  display:flex;
  align-items:center;
  justify-content:center;
}

.uploadButton svg{
  width:23px;
  height:23px;

  stroke:#000;
}


/* =========================
   LOGIN
========================= */

#loginScreen{
  position:fixed;
  z-index:100;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at top,
      #2a1022,
      #050505 60%
    );
}

.loginBox{
  width:100%;
  max-width:390px;

  padding:28px 22px;

  border-radius:25px;

  background:rgba(27,27,27,.92);

  border:1px solid rgba(255,255,255,.13);

  box-shadow:
    0 20px 60px rgba(0,0,0,.5);
}

.loginBox h1{
  font-size:31px;
  margin-bottom:6px;
}

.loginSub{
  color:#999;
  font-size:13px;
  margin-bottom:22px;
}

.input{
  width:100%;
  height:50px;

  margin-bottom:10px;

  padding:0 15px;

  border-radius:13px;

  border:1px solid #303030;

  outline:none;

  background:#202020;

  color:white;

  font-size:15px;
}

.input:focus{
  border-color:#777;
}

.mainButton{
  width:100%;
  height:50px;

  border-radius:13px;

  background:white;

  color:#000;

  font-size:15px;
  font-weight:900;
}

.googleButton{
  width:100%;
  height:47px;

  margin-top:10px;

  border-radius:13px;

  background:#181818;

  border:1px solid #333;

  font-size:13px;
  font-weight:800;
}

.switchMode{
  text-align:center;

  margin-top:16px;

  color:#999;

  font-size:13px;
}

.switchMode span{
  color:white;
  font-weight:800;
}


/* =========================
   COMMENTS
========================= */

#commentOverlay{
  position:fixed;
  z-index:60;

  inset:0;

  background:rgba(0,0,0,.58);

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

#commentOverlay.show{
  opacity:1;
  pointer-events:auto;
}

#commentSheet{
  position:fixed;
  z-index:70;

  left:0;
  right:0;
  bottom:0;

  height:min(72dvh,620px);

  display:flex;
  flex-direction:column;

  background:#111;

  border-radius:25px 25px 0 0;

  transform:translateY(110%);

  transition:
    transform .28s
    cubic-bezier(.2,.8,.2,1);
}

#commentSheet.open{
  transform:translateY(0);
}

.commentHeader{
  position:relative;

  height:58px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-bottom:1px solid #252525;
}

.commentHeader::before{
  content:"";

  position:absolute;

  top:8px;

  width:38px;
  height:4px;

  border-radius:10px;

  background:#555;
}

.commentTitle{
  font-size:15px;
  font-weight:900;
}

.closeComments{
  position:absolute;

  right:13px;

  width:35px;
  height:35px;

  border-radius:50%;

  background:#222;

  font-size:21px;
}

#commentsList{
  flex:1;

  overflow-y:auto;

  padding:15px;
}

.comment{
  display:flex;
  gap:10px;

  margin-bottom:18px;
}

.commentAvatar{
  width:35px;
  height:35px;

  flex-shrink:0;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #ff1744,
      #651fff
    );

  font-size:11px;
  font-weight:900;
}

.commentUser{
  color:#aaa;

  font-size:11px;

  font-weight:800;

  margin-bottom:3px;
}

.commentText{
  font-size:14px;
  line-height:1.4;
}

.emptyComments{
  text-align:center;

  color:#666;

  padding:55px 20px;

  font-size:13px;
}

.commentInputArea{
  flex-shrink:0;

  display:flex;
  gap:8px;

  padding:10px 12px;

  padding-bottom:
    max(10px,env(safe-area-inset-bottom));

  border-top:1px solid #252525;
}

#commentInput{
  flex:1;

  height:44px;

  padding:0 15px;

  border-radius:23px;

  border:1px solid #303030;

  outline:none;

  background:#1d1d1d;

  color:white;

  font-size:14px;
}

.sendComment{
  width:44px;
  height:44px;

  flex-shrink:0;

  border-radius:50%;

  background:white;

  display:flex;
  align-items:center;
  justify-content:center;
}

.sendComment svg{
  width:20px;
  height:20px;

  fill:none;

  stroke:#000;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================
   PROFILE
========================= */

#profilePage{
  position:fixed;
  z-index:90;

  inset:0;

  display:none;

  overflow-y:auto;

  background:#050505;
}

.profileTop{
  position:sticky;

  top:0;

  z-index:5;

  height:60px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:rgba(5,5,5,.9);

  backdrop-filter:blur(18px);

  border-bottom:1px solid #202020;
}

.profileTopTitle{
  font-size:17px;
  font-weight:900;
}

.profileTopButton{
  min-width:65px;
  height:35px;

  padding:0 10px;

  border-radius:10px;

  background:#181818;

  font-size:12px;
  font-weight:800;
}

.profileHeader{
  text-align:center;

  padding:30px 18px 22px;
}

.bigAvatar{
  width:92px;
  height:92px;

  margin:auto;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #ff1744,
      #651fff
    );

  border:3px solid white;

  font-size:27px;
  font-weight:900;

  box-shadow:
    0 0 35px rgba(255,23,68,.20);
}

.profileName{
  margin-top:13px;

  font-size:21px;
  font-weight:900;
}

.profileBio{
  margin-top:6px;

  color:#999;

  font-size:13px;
}

.profileStats{
  display:flex;
  justify-content:center;

  gap:42px;

  margin-top:22px;
}

.profileStat{
  display:flex;
  flex-direction:column;

  gap:4px;
}

.profileStat strong{
  font-size:17px;
}

.profileStat span{
  color:#888;
  font-size:11px;
}

.editProfileButton{
  margin-top:20px;

  width:150px;
  height:38px;

  border-radius:10px;

  background:#1b1b1b;

  border:1px solid #333;

  font-size:12px;
  font-weight:800;
}

.profileTabs{
  height:48px;

  display:flex;

  border-top:1px solid #202020;
  border-bottom:1px solid #202020;
}

.profileTab{
  flex:1;

  color:#777;

  font-size:12px;
  font-weight:800;
}

.profileTab.active{
  color:white;

  border-bottom:2px solid white;
}

.videoGrid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:2px;

  padding-bottom:30px;
}

.profileVideo{
  position:relative;

  width:100%;

  aspect-ratio:9/13;

  overflow:hidden;

  background:#151515;
}

.profileVideo video{
  width:100%;
  height:100%;

  object-fit:cover;
}

.profileEmpty{
  grid-column:1/-1;

  padding:70px 20px;

  text-align:center;

  color:#666;

  font-size:13px;
}


/* =========================
   EDIT PROFILE
========================= */

#editProfileModal{
  position:fixed;
  z-index:120;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.75);

  backdrop-filter:blur(10px);
}

.editBox{
  width:100%;
  max-width:390px;

  padding:20px;

  border-radius:22px;

  background:#171717;

  border:1px solid #333;
}

.editHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.editHeader b{
  font-size:17px;
}

.editClose{
  width:35px;
  height:35px;

  border-radius:50%;

  background:#252525;

  font-size:20px;
}

.bioInput{
  width:100%;

  min-height:90px;

  resize:none;

  margin-bottom:10px;

  padding:13px;

  border-radius:13px;

  border:1px solid #303030;

  outline:none;

  background:#202020;

  color:white;

  font-size:14px;
}


/* =========================
   LOADER
========================= */

#loader{
  position:fixed;
  z-index:200;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.75);
}

.spinner{
  width:42px;
  height:42px;

  border:3px solid #333;

  border-top-color:white;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  z-index:300;

  left:50%;
  bottom:85px;

  transform:
    translate(-50%,20px);

  padding:10px 16px;

  border-radius:13px;

  background:#181818;

  font-size:13px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  white-space:nowrap;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

</style>
</head>


<body>


<!-- =========================
     MAIN APP
========================= -->

<div id="app">


  <!-- TOP BAR -->

  <header class="topbar">

    <div class="logo">
      X<span>-Dark</span>
    </div>

    <button
      class="topButton"
      onclick="showToast('Search coming soon')">

      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

    </button>

  </header>


  <!-- VIDEO FEED -->

  <main id="feed"></main>


  <!-- BOTTOM NAV -->

  <nav class="bottomNav">

    <!-- HOME -->

    <button
      class="navButton"
      onclick="goHome()">

      <svg viewBox="0 0 24 24">

        <path d="m3 10 9-7 9 7"></path>

        <path d="M5 9v11h14V9"></path>

        <path d="M9 20v-6h6v6"></path>

      </svg>

    </button>


    <!-- SEARCH -->

    <button
      class="navButton"
      onclick="showToast('Search coming soon')">

      <svg viewBox="0 0 24 24">

        <circle cx="11" cy="11" r="7"></circle>

        <path d="m20 20-4-4"></path>

      </svg>

    </button>


    <!-- UPLOAD -->

    <label class="navButton">

      <div class="uploadButton">

        <svg viewBox="0 0 24 24">

          <path d="M12 5v14"></path>

          <path d="M5 12h14"></path>

        </svg>

      </div>

      <input
        id="uploadInput"
        type="file"
        accept="video/mp4,video/webm,video/quicktime"
        hidden>

    </label>


    <!-- PROFILE -->

    <button
      class="navButton"
      onclick="openProfile()">

      <svg viewBox="0 0 24 24">

        <path d="M20 21a8 8 0 0 0-16 0"></path>

        <circle cx="12" cy="7" r="4"></circle>

      </svg>

    </button>


    <!-- REFRESH -->

    <button
      class="navButton"
      onclick="loadVideos()">

      <svg viewBox="0 0 24 24">

        <path d="
          M20 12
          a8 8 0 1 1-2.34-5.66">
        </path>

        <path d="M20 4v6h-6"></path>

      </svg>

    </button>

  </nav>

</div>


<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="loginBox">

    <h1 id="authTitle">
      Welcome to X-Dark
    </h1>

    <p
      id="authSub"
      class="loginSub">
      Login with your username
    </p>


    <input
      id="usernameInput"
      class="input"
      type="text"
      placeholder="Username"
      autocomplete="username">


    <input
      id="passwordInput"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password">


    <button
      id="authButton"
      class="mainButton"
      onclick="handleAuth()">

      Login

    </button>


    <button
      class="googleButton"
      onclick="googleLogin()">

      Continue with Google

    </button>


    <div
      class="switchMode"
      onclick="toggleAuthMode()">

      <span id="switchText">
        Create a new account
      </span>

    </div>

  </div>

</div>


<!-- =========================
     COMMENTS
========================= -->

<div
  id="commentOverlay"
  onclick="closeComments()">
</div>


<section id="commentSheet">

  <div class="commentHeader">

    <div class="commentTitle">
      Comments
    </div>

    <button
      class="closeComments"
      onclick="closeComments()">
      ×
    </button>

  </div>


  <div id="commentsList"></div>


  <div class="commentInputArea">

    <input
      id="commentInput"
      type="text"
      maxlength="500"
      placeholder="Add a comment...">


    <button
      class="sendComment"
      onclick="sendComment()">

      <svg viewBox="0 0 24 24">

        <path d="M22 2 11 13"></path>

        <path d="
          m22 2-7 20-4-9-9-4Z">
        </path>

      </svg>

    </button>

  </div>

</section>


<!-- =========================
     PROFILE
========================= -->

<section id="profilePage">

  <div class="profileTop">

    <button
      class="profileTopButton"
      onclick="closeProfile()">

      ‹ Back

    </button>


    <div class="profileTopTitle">
      Profile
    </div>


    <button
      class="profileTopButton"
      onclick="logoutUser()">

      Logout

    </button>

  </div>


  <div class="profileHeader">

    <div
      id="bigAvatar"
      class="bigAvatar">

      U

    </div>


    <div
      id="profileName"
      class="profileName">

      @User

    </div>


    <div
      id="profileBio"
      class="profileBio">

      Welcome to X-Dark 🚀

    </div>


    <div class="profileStats">

      <div class="profileStat">

        <strong id="videoCount">
          0
        </strong>

        <span>
          Videos
        </span>

      </div>


      <div class="profileStat">

        <strong id="followersCount">
          0
        </strong>

        <span>
          Followers
        </span>

      </div>


      <div class="profileStat">

        <strong id="followingCount">
          0
        </strong>

        <span>
          Following
        </span>

      </div>

    </div>


    <button
      class="editProfileButton"
      onclick="openEditProfile()">

      Edit Profile

    </button>

  </div>


  <div class="profileTabs">

    <button
      class="profileTab active">

      Videos

    </button>

    <button
      class="profileTab"
      onclick="showToast('Saved videos coming next')">

      Saved

    </button>

  </div>


  <div
    id="myVideoGrid"
    class="videoGrid">

  </div>

</section>


<!-- =========================
     EDIT PROFILE
========================= -->

<div id="editProfileModal">

  <div class="editBox">

    <div class="editHeader">

      <b>
        Edit Profile
      </b>

      <button
        class="editClose"
        onclick="closeEditProfile()">

        ×

      </button>

    </div>


    <input
      id="editUsername"
      class="input"
      maxlength="30"
      placeholder="Username">


    <textarea
      id="editBio"
      class="bioInput"
      maxlength="120"
      placeholder="Write your bio...">
    </textarea>


    <button
      class="mainButton"
      onclick="saveProfile()">

      Save Profile

    </button>

  </div>

</div>


<!-- LOADER -->

<div id="loader">

  <div class="spinner"></div>

</div>

/* =========================
   USERNAME → INTERNAL EMAIL
========================= */

function makeInternalEmail(username){

  return username
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]/g,"")
    +"@xdark.local";

}


/* =========================
   LOGIN / REGISTER
========================= */

window.handleAuth=
async function(){

  const username=
    document
      .getElementById(
        "usernameInput"
      )
      .value
      .trim();


  const password=
    document
      .getElementById(
        "passwordInput"
      )
      .value;


  if(username.length<3){

    showToast(
      "Username must be 3+ characters"
    );

    return;

  }


  if(password.length<6){

    showToast(
      "Password must be 6+ characters"
    );

    return;

  }


  const internalEmail=
    makeInternalEmail(
      username
    );


  try{

    setLoading(true);


    if(registerMode){

      const result=
        await createUserWithEmailAndPassword(
          auth,
          internalEmail,
          password
        );


      await setDoc(
        doc(
          db,
          "users",
          result.user.uid
        ),
        {

          username:
            username,

          usernameLower:
            username.toLowerCase(),

          bio:
            "Welcome to X-Dark 🚀",

          followers:0,

          following:0,

          createdAt:
            serverTimestamp()

        }
      );


      showToast(
        "Account created ✓"
      );


    }else{

      await signInWithEmailAndPassword(
        auth,
        internalEmail,
        password
      );


      showToast(
        "Login successful ✓"
      );

    }


  }catch(error){

    console.error(error);

    let message=
      "Something went wrong";


    if(
      error.code===
      "auth/invalid-credential"
    ){

      message=
        "Wrong username or password";

    }


    if(
      error.code===
      "auth/email-already-in-use"
    ){

      message=
        "Username already exists";

    }


    if(
      error.code===
      "auth/user-not-found"
    ){

      message=
        "Account not found";

    }


    if(
      error.code===
      "auth/weak-password"
    ){

      message=
        "Password must be 6+ characters";

    }


    showToast(message);

  }finally{

    setLoading(false);

  }

};

async function loadComments(id){

      `;

    return;

  try{

          "comments"

        orderBy(

    const snapshot=

    );

    list.innerHTML=
      `
        <div class="emptyComments">

/* =========================
   SEND COMMENT
========================= */

window.sendComment=
async function(){

  if(!currentUser){

    showToast(
      "Login first"
    );

    return;

  }


  if(
    !activeVideoId ||
    activeVideoId==="demo"
  ){

    showToast(
      "Demo video cannot receive comments"
    );

    return;

  }


  const input=
    document.getElementById(
      "commentInput"
    );


  const text=
    input.value.trim();


  if(!text){

    return;

  }


  try{

    const profileRef=
      doc(
        db,
        "users",
        currentUser.uid
      );


    const profile=
      await getDoc(
        profileRef
      );


    const username=
      profile.exists()
        ? profile.data().username
        : (
            currentUser.displayName ||
            "User"
          );


    const commentData={

      userId:
        currentUser.uid,

      username:
        username,

      text:
        text,

      createdAt:
        serverTimestamp()

    };


    await addDoc(
      collection(
        db,
        "videos",
        activeVideoId,
        "comments"
      ),
      commentData
    );


    await updateDoc(
      doc(
        db,
        "videos",
        activeVideoId
      ),
      {

        comments:
          increment(1)

      }
    );


    displayComment({
      ...commentData,
      createdAt:new Date()
    });


    input.value="";


    updateCommentCount(
      activeVideoId
    );


    showToast(
      "Comment added ✓"
    );


  }catch(error){

    console.error(error);

    showToast(
      "Comment could not be saved"
    );

  }

};


/* =========================
   UPDATE COMMENT COUNT

function updateCommentCount(id){

  document
    .querySelectorAll(
      ".videoCard"
    )
    .forEach(card=>{

      const button=
        card.querySelector(
          `button[onclick="openComments('${id}')"]`
        );


      if(button){

        const count=
          button.parentElement
            .querySelector(
              ".actionCount"
            );


        let n=
          parseInt(
            count.innerText
          ) || 0;


        count.innerText=
          formatCount(n+1);

      }

    });

}

  try{

    const q=
      query(
        collection(
          db,
          "videos"
        ),
        orderBy(

          "desc"
        )
      );


    const snapshot=
      await getDocs(q);


    snapshot.forEach(
      item=>{

          item.data();


        if(
          data.userId===
          currentUser.uid
        ){

          const box=
            document.createElement(

          grid.appendChild(box);

    );


    document
      .getElementById(

        total;


    if(total===0){

      grid.innerHTML=
        `
          <div class="profileEmpty">

  }catch(error){

};

/* =========================
   VIDEO AUTOPLAY
========================= */

function activateVideos(){

  const videos=
    document.querySelectorAll(
      ".video"
    );


  const observer=
    new IntersectionObserver(
      entries=>{

        entries.forEach(
          entry=>{

            const video=
              entry.target;


            if(
              entry.isIntersecting
            ){

              videos.forEach(
                other=>{

                  if(
                    other!==video
                  ){

                    other.pause();

                  }

                }
              );


              video.muted=false;


              video.play()
                .catch(
                  ()=>{

                    video.muted=true;

                    video.play()
                      .catch(
                        ()=>{}
                      );

                  }
                );


            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:.7
      }
    );


  videos.forEach(
    video=>
      observer.observe(video)
  );

}


/* =========================
   UPLOAD
========================= */

document
  .getElementById(
    "uploadInput"
  )
  .addEventListener(
    "change",
    uploadVideo
  );


async function uploadVideo(event){

  if(!currentUser){

    showToast(
      "Login first"
    );

    event.target.value="";

    return;

  }


  const file=
    event.target.files[0];


  if(!file)
    return;


  if(
    file.size >
    100*1024*1024
  ){

    showToast(
      "Video must be under 100 MB"
    );

    event.target.value="";

    return;

  }


  try{

    setLoading(true);


    const form=
      new FormData();


    form.append(
      "file",
      file
    );


    form.append(
      "upload_preset",
      UPLOAD_PRESET
    );


    const response=
      await fetch(
        CLOUDINARY_URL,
        {

          method:"POST",

          body:form

        }
      );


    const result=
      await response.json();


    if(
      !result.secure_url
    ){

      throw new Error(
        "Cloudinary upload failed"
      );

    }


    const profile=
      await getDoc(
        doc(
          db,
          "users",
          currentUser.uid
        )
      );


    const username=
      profile.exists()
        ? profile.data().username
        : (
            currentUser.displayName ||
            "User"
          );


    await addDoc(
      collection(
        db,
        "videos"
      ),
      {

        url:
          result.secure_url,

        userId:
          currentUser.uid,

        username:
          username,

        caption:
          "New X-Dark video 🚀",

        likes:0,

        comments:0,

        createdAt:
          serverTimestamp()

      }
    );


    showToast(
      "Video uploaded ✓"
    );


    await loadVideos();


  }catch(error){

    console.error(error);

    showToast(
      "Video upload failed"
    );

  }finally{

    setLoading(false);

    event.target.value="";

  }

}


/* =========================
   HELPERS
========================= */

function formatCount(number){

  number=
    Number(number)||0;


  if(
    number>=1000000
  ){

    return(
      (number/1000000)
        .toFixed(1)
        .replace(".0","")
      +"M"
    );

  }


  if(
    number>=1000
  ){

    return(
      (number/1000)
        .toFixed(1)
        .replace(".0","")
      +"K"
    );

  }


  return String(number);

}


function safe(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function setLoading(show){

  document
    .getElementById(
      "loader"
    )
    .style.display=
      show
        ? "flex"
        : "none";

}


window.showToast=
function(message){

  const toast=
    document.getElementById(
      "toast"
    );


  toast.innerText=
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    ()=>{
      toast.classList.remove(
        "show"
      );
    },
    1800
  );

};
