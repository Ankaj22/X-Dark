<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-DARK</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#08090d;
color:white;
font-family:Arial;
padding-bottom:80px
}
header{
height:75px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
border-bottom:1px solid #292b35
}
.logo{font-size:26px;font-weight:bold}
.icons{font-size:26px;display:flex;gap:25px}
.stories{
display:flex;
gap:20px;
padding:28px 25px;
overflow:auto
}
.story{text-align:center;min-width:90px}
.story img{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
border:3px solid #8b52ff;
padding:3px
}
.feed{
max-width:650px;
margin:auto;
padding:0 15px
}
.post{
background:#111219;
border:1px solid #292b35;
border-radius:18px;
overflow:hidden;
margin-bottom:20px
}
.head{
display:flex;
align-items:center;
gap:12px;
padding:15px
}
.head img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid #8b52ff
}
.small{color:#888;margin-top:4px}
.post video{
width:100%;
display:block;
background:#000;
max-height:600px
}
.caption{
padding:15px;
font-size:16px
}
.actions{
display:flex;
justify-content:space-between;
padding:13px 18px;
font-size:25px
}
.actions span{cursor:pointer}
.empty{
text-align:center;
padding:70px 20px;
color:#777
}
nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:#090a0e;
border-top:1px solid #292b35;
display:flex;
justify-content:space-around;
align-items:center;
font-size:27px;
z-index:10
}
.plus{
background:white;
color:black;
padding:8px 20px;
border-radius:15px
}
</style>
</head>

<body>

<header>

<div class="logo">X-DARK</div>

<div class="icons">
<span>⌕</span>
<span>♡</span>
<span>☰</span>
</div>

</header>

<div class="stories">

<div class="story">
<img src="https://i.pravatar.cc/100?img=12">
<p>Your story</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/100?img=12">
<p>@User</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/100?img=47">
<p>@Dark wing</p>
</div>

</div>

<div class="feed" id="feed">

<div class="empty" id="loading">
Loading X-DARK...
</div>

</div>

<nav>

<span>⌂</span>

<span>⌕</span>

<span
class="plus"
onclick="location.href='create-post.html'">
+
</span>

<span>♡</span>

<span onclick="location.href='profile.html'">
◉
</span>

</nav>

<script>

async function loadPosts(){

const feed=
document.getElementById("feed");

try{

const response=
await fetch("/api/posts");

const posts=
await response.json();

feed.innerHTML="";

if(posts.length===0){

feed.innerHTML=
'<div class="empty">No posts yet.<br><br>Tap + to create your first video 🚀</div>';

return;

}

posts.forEach(post=>{

const div=
document.createElement("div");

div.className="post";

div.innerHTML=`

<div class="head">

<img src="https://i.pravatar.cc/100?img=12">

<div>
<b>${escapeHTML(post.username)}</b>
<div class="small">
${escapeHTML(post.handle)}
</div>
</div>

</div>

<video
src="${post.video}"
controls
playsinline
preload="metadata">
</video>

<div class="actions">

<span onclick="like(this)">♡</span>

<span onclick="comment()">💬</span>

<span onclick="sharePost()">↗</span>

<span>🔖</span>

</div>

<div class="caption">
${escapeHTML(post.caption)}
<br>
<span class="small">
${escapeHTML(post.tags || "")}
</span>
</div>

`;

feed.appendChild(div);

});

}catch(error){

feed.innerHTML=
'<div class="empty">Unable to load posts.</div>';

}

}

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function like(el){

el.innerText=
el.innerText==="♡"?"♥":"♡";

}

function comment(){

const text=
prompt("Write your comment:");

if(text)
alert("Comment added ✓");

}

async function sharePost(){

if(navigator.share){

await navigator.share({
title:"X-DARK",
text:"Check this X-DARK video 🚀"
});

}else{

alert("Share is not supported.");

}

}

loadPosts();

</script>

</body>
</html>
