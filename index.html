<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>X-Dark</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  color:#fff;
  background:none;
}

#app{
  width:100%;
  height:100dvh;
  position:relative;
  background:#000;
}

/* TOP */

.top{
  position:fixed;
  z-index:20;
  top:0;
  left:0;
  right:0;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 15px;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.75),
    transparent
  );
}

.logo{
  font-size:22px;
  font-weight:900;
}

.logo b{
  color:#ff1744;
}

.search{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.1);

  display:flex;
  align-items:center;
  justify-content:center;
}

.search svg{
  width:21px;
  height:21px;
}

/* FEED */

#feed{
  width:100%;
  height:100dvh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.card{
  position:relative;
  width:100%;
  height:100dvh;

  scroll-snap-align:start;
  overflow:hidden;
  background:#050505;
}

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.card:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:linear-gradient(
    to top,
    rgba(0,0,0,.82),
    rgba(0,0,0,.12) 48%,
    transparent 70%
  );
}

/* INFO */

.info{
  position:absolute;
  z-index:5;
  left:15px;
  right:90px;
  bottom:84px;
}

.user{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
}

.avatar{
  width:39px;
  height:39px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    #ff1744,
    #7c4dff
  );

  font-size:13px;
  font-weight:900;

  border:2px solid white;
}

.username{
  font-size:14px;
  font-weight:800;
}

.follow{
  border:1px solid rgba(255,255,255,.7);
  padding:5px 9px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
}

.caption{
  font-size:14px;
  line-height:1.4;
  margin-bottom:7px;
}

.audio{
  font-size:12px;
  opacity:.85;
}

/* ACTIONS */

.actions{
  position:absolute;
  z-index:10;

  right:9px;
  bottom:80px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:17px;
}

.action{
  width:47px;
  text-align:center;
}

.actionBtn{
  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.20);
  backdrop-filter:blur(9px);
}

.actionBtn:active{
  transform:scale(.82);
}

.actionBtn svg{
  width:25px;
  height:25px;

  fill:none;
  stroke:white;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.count{
  display:block;
  margin-top:3px;
  font-size:10px;
  font-weight:800;
}

.like.active svg{
  fill:#ff1744;
  stroke:#ff1744;
}

.save.active svg{
  fill:white;
}

.profileAction{
  position:relative;
}

.profileAction .avatar{
  width:44px;
  height:44px;
}

.plus{
  position:absolute;
  right:-2px;
  bottom:-3px;

  width:17px;
  height:17px;

  border-radius:50%;
  background:#ff1744;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:13px;
  font-weight:900;

  border:2px solid #000;
}

/* NAV */

.nav{
  position:fixed;
  z-index:30;

  left:0;
  right:0;
  bottom:0;

  height:65px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:linear-gradient(
    to top,
    rgba(0,0,0,.9),
    transparent
  );
}

.navBtn{
  width:50px;
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.navBtn svg{
  width:24px;
  height:24px;

  fill:none;
  stroke:white;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.upload{
  width:46px;
  height:34px;

  border-radius:10px;

  background:white;
  color:#000;

  display:flex;
  align-items:center;
  justify-content:center;
}

.upload svg{
  stroke:#000;
}

/* LOGIN */

#login{
  position:fixed;
  z-index:100;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at top,
      #28101f,
      #050505 58%
    );
}

.loginBox{
  width:100%;
  max-width:390px;

  padding:28px 22px;

  border-radius:25px;

  background:rgba(30,30,30,.88);

  border:1px solid rgba(255,255,255,.14);

  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.loginBox h1{
  font-size:31px;
  margin-bottom:6px;
}

.loginBox p{
  color:#aaa;
  font-size:13px;
  margin-bottom:22px;
}

.input{
  width:100%;
  height:50px;

  margin-bottom:10px;
  padding:0 15px;

  border-radius:13px;

  border:1px solid rgba(255,255,255,.12);

  background:#202020;
  color:#fff;

  outline:none;

  font-size:15px;
}

.input:focus{
  border-color:#777;
}

.mainBtn{
  width:100%;
  height:50px;

  border-radius:13px;

  background:#fff;
  color:#000;

  font-weight:900;
  font-size:15px;
}

.secondaryBtn{
  width:100%;
  height:46px;

  margin-top:10px;

  border-radius:13px;

  background:#181818;

  border:1px solid #333;

  font-weight:800;
}

.switch{
  text-align:center;
  margin-top:16px;

  color:#aaa;
  font-size:13px;
}

.switch span{
  color:white;
  font-weight:800;
}

/* COMMENTS */

#overlay{
  position:fixed;
  z-index:60;

  inset:0;

  background:rgba(0,0,0,.55);

  opacity:0;
  pointer-events:none;

  transition:.25s;
}

#overlay.show{
  opacity:1;
  pointer-events:auto;
}

#comments{
  position:fixed;
  z-index:70;

  left:0;
  right:0;
  bottom:0;

  height:min(72dvh,620px);

  background:#111;

  border-radius:25px 25px 0 0;

  transform:translateY(110%);

  transition:.28s;

  display:flex;
  flex-direction:column;
}

#comments.open{
  transform:translateY(0);
}

.commentHead{
  height:58px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-bottom:1px solid #242424;

  position:relative;
}

.commentHead:before{
  content:"";

  position:absolute;
  top:8px;

  width:38px;
  height:4px;

  border-radius:10px;

  background:#555;
}

.commentTitle{
  font-weight:900;
  font-size:15px;
}

.close{
  position:absolute;
  right:13px;

  width:35px;
  height:35px;

  border-radius:50%;

  background:#222;

  font-size:21px;
}

#commentList{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.comment{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.commentAvatar{
  width:35px;
  height:35px;

  flex-shrink:0;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #ff1744,
    #651fff
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:11px;
  font-weight:900;
}

.commentUser{
  color:#aaa;
  font-size:11px;
  font-weight:800;
  margin-bottom:3px;
}

.commentText{
  font-size:14px;
  line-height:1.4;
}

.empty{
  text-align:center;
  color:#777;
  padding:50px 20px;
  font-size:13px;
}

.commentInput{
  display:flex;
  gap:8px;

  padding:10px 12px;

  border-top:1px solid #252525;
}

#commentText{
  flex:1;
  height:44px;

  border-radius:23px;

  border:1px solid #292929;

  background:#1c1c1c;
  color:white;

  padding:0 15px;

  outline:none;
}

.send{
  width:44px;
  height:44px;

  border-radius:50%;

  background:white;
  color:#000;

  display:flex;
  align-items:center;
  justify-content:center;
}

.send svg{
  width:20px;
  height:20px;

  fill:none;
  stroke:#000;
  stroke-width:2;
}

/* LOADER */

#loader{
  position:fixed;
  z-index:200;

  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.75);
}

.spinner{
  width:42px;
  height:42px;

  border:3px solid #333;
  border-top-color:white;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* TOAST */

#toast{
  position:fixed;
  z-index:300;

  left:50%;
  bottom:85px;

  transform:translate(-50%,20px);

  padding:10px 16px;

  border-radius:13px;

  background:#181818;

  font-size:13px;

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div id="app">

<header class="top">
  <div class="logo">X<b>-Dark</b></div>

  <button class="search" onclick="toast('Search coming soon')">
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-4-4"></path>
    </svg>
  </button>
</header>

<main id="feed"></main>

<nav class="nav">

  <button class="navBtn">
    <svg viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7"></path>
      <path d="M5 9v11h14V9"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
  </button>

  <button class="navBtn">
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-4-4"></path>
    </svg>
  </button>

  <label class="navBtn">
    <div class="upload">
      <svg viewBox="0 0 24 24">
        <path d="M12 5v14"></path>
        <path d="M5 12h14"></path>
      </svg>
    </div>

    <input
      id="uploadInput"
      type="file"
      accept="video/mp4,video/webm,video/quicktime"
      hidden
    >
  </label>

  <button class="navBtn">
    <svg viewBox="0 0 24 24">
      <path d="M20 21a8 8 0 0 0-16 0"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
  </button>

  <button class="navBtn">
    <svg viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
      <path d="M20 4v6h-6"></path>
    </svg>
  </button>

</nav>

</div>


<!-- LOGIN -->

<div id="login">

  <div class="loginBox">

    <h1 id="loginTitle">Welcome to X-Dark</h1>

    <p id="loginSub">
      Login with your username
    </p>

    <input
      id="username"
      class="input"
      type="text"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="mainBtn"
      class="mainBtn"
      onclick="handleAuth()">
      Login
    </button>

    <button
      class="secondaryBtn"
      onclick="googleLogin()">
      Continue with Google
    </button>

    <div
      class="switch"
      onclick="toggleMode()">

      <span id="switchText">
        Create a new account
      </span>

    </div>

  </div>

</div>


<!-- COMMENTS OVERLAY -->

<div
  id="overlay"
  onclick="closeComments()">
</div>


<!-- COMMENTS -->

<section id="comments">

  <div class="commentHead">

    <div class="commentTitle">
      Comments
    </div>

    <button
      class="close"
      onclick="closeComments()">
      ×
    </button>

  </div>

  <div id="commentList"></div>

  <div class="commentInput">

    <input
      id="commentText"
      type="text"
      maxlength="500"
      placeholder="Add a comment..."
    >

    <button
      class="send"
      onclick="sendComment()">

      <svg viewBox="0 0 24 24">
        <path d="M22 2 11 13"></path>
        <path d="m22 2-7 20-4-9-9-4Z"></path>
      </svg>

    </button>

  </div>

</section>


<!-- LOADER -->

<div id="loader">
  <div class="spinner"></div>
</div>

<div id="toast"></div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  doc,
  updateDoc,
  increment,
  setDoc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
  "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
  "darkwing-a717a.firebaseapp.com",

  projectId:
  "darkwing-a717a",

  storageBucket:
  "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
  "352453390196",

  appId:
  "1:352453390196:web:7c375a26a823b5633a4621",

  measurementId:
  "G-5RVX9NET3W"
};


/* CLOUDINARY */

const CLOUD_NAME="lrpb7uuy";

const UPLOAD_PRESET="x_dark_videos";

const CLOUDINARY_URL=
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;


/* INIT */

const firebaseApp=
initializeApp(firebaseConfig);

const auth=
getAuth(firebaseApp);

const db=
getFirestore(firebaseApp);


/* STATE */

let user=null;

let registerMode=false;

let activeVideo=null;


/* AUTH STATE */

onAuthStateChanged(auth,(u)=>{

  user=u;

  const login=
    document.getElementById("login");

  if(u){

    login.style.display="none";

  }else{

    login.style.display="flex";

  }

  loadVideos();

});


/* TOGGLE LOGIN / REGISTER */

window.toggleMode=function(){

  registerMode=!registerMode;

  const title=
    document.getElementById("loginTitle");

  const sub=
    document.getElementById("loginSub");

  const btn=
    document.getElementById("mainBtn");

  const switchText=
    document.getElementById("switchText");

  if(registerMode){

    title.innerText="Create X-Dark";

    sub.innerText=
      "Create your username and password";

    btn.innerText="Create Account";

    switchText.innerText=
      "Already have an account? Login";

  }else{

    title.innerText="Welcome to X-Dark";

    sub.innerText=
      "Login with your username";

    btn.innerText="Login";

    switchText.innerText=
      "Create a new account";

  }

};


/* AUTH */

window.handleAuth=async function(){

  const username=
    document
      .getElementById("username")
      .value
      .trim();

  const password=
    document
      .getElementById("password")
      .value;


  if(!username){

    toast("Enter username");

    return;
  }


  if(username.length<3){

    toast("Username must be 3+ characters");

    return;
  }


  if(!password || password.length<6){

    toast("Password must be 6+ characters");

    return;
  }


  /*
    Firebase needs an email internally.
    User only sees username.
  */

  const internalEmail=
    username
      .toLowerCase()
      .replace(/[^a-z0-9]/g,"")
      +"@xdark.local";


  try{

    loading(true);


    if(registerMode){

      const result=
        await createUserWithEmailAndPassword(
          auth,
          internalEmail,
          password
        );


      await setDoc(
        doc(db,"users",result.user.uid),
        {
          username:username,
          usernameLower:
            username.toLowerCase(),
          createdAt:
            serverTimestamp()
        }
      );


      toast("Account created ✓");


    }else{

      await signInWithEmailAndPassword(
        auth,
        internalEmail,
        password
      );


      toast("Login successful ✓");

    }


  }catch(error){

    console.error(error);

    let message="Something went wrong";


    if(
      error.code===
      "auth/invalid-credential"
    ){

      message="Wrong username or password";

    }

    if(
      error.code===
      "auth/user-not-found"
    ){

      message="Account not found";

    }

    if(
      error.code===
      "auth/email-already-in-use"
    ){

      message="Username already exists";

    }

    if(
      error.code===
      "auth/weak-password"
    ){

      message="Password is too weak";

    }


    toast(message);

  }finally{

    loading(false);

  }

};


/* GOOGLE */

window.googleLogin=async function(){

  try{

    loading(true);

    const provider=
      new GoogleAuthProvider();

    await signInWithPopup(
      auth,
      provider
    );

    toast("Google login successful ✓");

  }catch(error){

    console.error(error);

    toast(
      "Google login failed"
    );

  }finally{

    loading(false);

  }

};


/* LOAD VIDEOS */

async function loadVideos(){

  const feed=
    document.getElementById("feed");

  feed.innerHTML="";


  try{

    const q=
      query(
        collection(db,"videos"),
        orderBy(
          "createdAt",
          "desc"
        )
      );

    const snap=
      await getDocs(q);


    if(snap.empty){

      demoVideo();

      return;

    }


    snap.forEach(item=>{

      createCard(
        item.id,
        item.data()
      );

    });


    activateVideos();

  }catch(error){

    console.error(error);

    demoVideo();

  }

}


/* CARD */

function createCard(id,data){

  const feed=
    document.getElementById("feed");

  const card=
    document.createElement("article");

  card.className="card";


  const name=
    data.username ||
    data.userEmail?.split("@")[0] ||
    "x_dark";


  const initials=
    name
      .replace("@","")
      .substring(0,2)
      .toUpperCase();


  card.innerHTML=`

    <video
      class="video"
      src="${safe(data.url)}"
      loop
      playsinline
      preload="metadata">
    </video>


    <div class="info">

      <div class="user">

        <div class="avatar">
          ${safe(initials)}
        </div>

        <div class="username">
          @${safe(name)}
        </div>

        <button
          class="follow"
          onclick="follow(this)">
          Follow
        </button>

      </div>


      <div class="caption">
        ${safe(
          data.caption ||
          "Welcome to X-Dark 🚀"
        )}
      </div>


      <div class="audio">
        ♫ Original audio
      </div>

    </div>


    <div class="actions">

      <div class="profileAction">

        <div class="avatar">
          ${safe(initials)}
        </div>

        <div class="plus">+</div>

      </div>


      <!-- LIKE -->

      <div class="action">

        <button
          class="actionBtn like"
          data-id="${id}"
          onclick="like(this)">

          <svg viewBox="0 0 24 24">
            <path d="
              M20.8 8.7
              C20.8 5.7 18.5 3.5 15.6 3.5
              C13.9 3.5 12.5 4.4 11.7 5.7
              C10.9 4.4 9.5 3.5 7.8 3.5
              C4.9 3.5 2.6 5.7 2.6 8.7
              C2.6 13.4 7.4 17.1 12 20.5
              C16 17.1 20.8 13.4 20.8 8.7Z">
            </path>
          </svg>

        </button>

        <span class="count">
          ${format(data.likes||0)}
        </span>

      </div>


      <!-- COMMENT -->

      <div class="action">

        <button
          class="actionBtn"
          onclick="openComments('${id}')">

          <svg viewBox="0 0 24 24">
            <path d="
              M20 11.5
              a7.5 7.5 0 0 1-7.5 7.5
              H8l-4 3
              1.3-4.3
              A7.5 7.5 0 1 1 20 11.5Z">
            </path>
          </svg>

        </button>

        <span class="count commentCount">
          ${format(data.comments||0)}
        </span>

      </div>


      <!-- SAVE -->

      <div class="action">

        <button
          class="actionBtn save"
          onclick="save(this)">

          <svg viewBox="0 0 24 24">
            <path d="
              M6 4.5
              A2.5 2.5 0 0 1 8.5 2h7
              A2.5 2.5 0 0 1 18 4.5V21
              l-6-3.5L6 21Z">
            </path>
          </svg>

        </button>

      </div>


      <!-- SHARE -->

/* LIKE */

window.like=async function(button){

  if(!user){

    toast("Login first");

    return;

  }


  if(button.classList.contains("active"))
    return;


  button.classList.add("active");


  const card=
    button.closest(".card");

  const count=
    card.querySelector(".count");

  let number=
    parseInt(
      count.innerText
    )||0;


  number++;

  count.innerText=
    format(number);


  try{

    await updateDoc(
      doc(db,"videos",button.dataset.id),
      {
        likes:
          increment(1)
      }
    );

  }catch(error){

    console.error(error);

  }

};


/* COMMENTS */

window.openComments=async function(id){

  activeVideo=id;

  document
    .getElementById("comments")
    .classList.add("open");

  document
    .getElementById("overlay")
    .classList.add("show");

  await loadComments(id);

};


window.closeComments=function(){

  document
    .getElementById("comments")
    .classList.remove("open");

  document
    .getElementById("overlay")
    .classList.remove("show");

  activeVideo=null;

};


/* LOAD COMMENTS */

async function loadComments(id){

  const list=
    document.getElementById(
      "commentList"
    );


  list.innerHTML=
    `<div class="empty">
      Loading comments...
    </div>`;


  try{

    const q=
      query(
        collection(
          db,
          "videos",
          id,
          "comments"
        ),
        orderBy(
          "createdAt",
          "asc"
        )
      );


    const snap=
      await getDocs(q);


    list.innerHTML="";


    if(snap.empty){

      list.innerHTML=
        `<div class="empty">
          No comments yet.<br><br>
          Be the first to comment ✨
        </div>`;

      return;

    }


    snap.forEach(item=>{

      showComment(
        item.data()
      );

    });


  }catch(error){

    console.error(error);

    list.innerHTML=
      `<div class="empty">
        Comments unavailable
      </div>`;

  }

}


/* SHOW COMMENT */

function showComment(data){

  const list=
    document.getElementById(
      "commentList"
    );


  const name=
    data.username ||
    data.userEmail?.split("@")[0] ||
    "User";


  const initials=
    name
      .substring(0,2)
      .toUpperCase();


  const div=
    document.createElement("div");

  div.className="comment";


  div.innerHTML=`

    <div class="commentAvatar">
      ${safe(initials)}
    </div>

    <div>

      <div class="commentUser">
        @${safe(name)}
      </div>

      <div class="commentText">
        ${safe(data.text)}
      </div>

    </div>

  `;


  list.appendChild(div);

  list.scrollTop=
    list.scrollHeight;

}


/* SEND COMMENT */

window.sendComment=async function(){

  if(!user){

    toast("Login first");

    return;

  }


  if(!activeVideo)
    return;


  const input=
    document.getElementById(
      "commentText"
    );


  const text=
    input.value.trim();


  if(!text)
    return;


  try{

    const username=
      user.displayName ||
      user.email?.split("@")[0] ||
      "User";


    const data={

      userId:
        user.uid,

      username:
        username,

      text:
        text,

      createdAt:
        serverTimestamp()

    };


    await addDoc(
      collection(
        db,
        "videos",
        activeVideo,
        "comments"
      ),
      data
    );


    await updateDoc(
      doc(
        db,
        "videos",
        activeVideo
      ),
      {
        comments:
          increment(1)
      }
    );


    showComment({
      ...data,
      createdAt:new Date()
    });


    input.value="";


    document
      .querySelectorAll(
        ".card"
      )
      .forEach(card=>{

        const btn=
          card.querySelector(
            `[onclick="openComments('${activeVideo}')"]`
          );

        if(btn){

          const count=
            card.querySelector(
              ".commentCount"
            );

          let n=
            parseInt(
              count.innerText
            )||0;

          count.innerText=
            format(n+1);

        }

      });


    toast("Comment added ✓");


  }catch(error){

    console.error(error);

    toast(
      "Comment save failed"
    );

  }

};


/* ENTER COMMENT */

document
  .getElementById("commentText")
  .addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter"){
        sendComment();
      }

    }
  );

window.save=function(button){

/* FOLLOW */

window.follow=function(button){

/* SHARE */

window.share=async function(id){

  const url=
    location.origin+
    location.pathname+
    "?video="+id;


  try{

    if(navigator.share){

      await navigator.share({

        title:"X-Dark",

        text:
          "Watch this video on X-Dark",

        url:url

      });

    }else{

      await navigator.clipboard.writeText(
        url
      );

      toast("Link copied ✓");

    }

  }catch(e){}

};


/* UPLOAD */

document
  .getElementById("uploadInput")
  .addEventListener(
    "change",
    upload
  );


async function upload(e){

  if(!user){

    toast("Login first");

    return;

  }


  const file=
    e.target.files[0];


  if(!file)
    return;


  if(
    file.size >
    100*1024*1024
  ){

    toast(
      "Video must be under 100 MB"
    );

    return;

  }


  try{

    loading(true);


    const form=
      new FormData();


    form.append(
      "file",
      file
    );


    form.append(
      "upload_preset",
      UPLOAD_PRESET
    );


    const response=
      await fetch(
        CLOUDINARY_URL,
        {
          method:"POST",
          body:form
        }
      );


    const result=
      await response.json();


    if(!result.secure_url){

      throw new Error(
        "Upload failed"
      );

    }


    const username=
      user.displayName ||
      user.email?.split("@")[0] ||
      "User";


    await addDoc(
      collection(db,"videos"),
      {

        url:
          result.secure_url,

        userId:
          user.uid,

        username:
          username,

        caption:
          "New X-Dark video 🚀",

        likes:0,

        comments:0,

        createdAt:
          serverTimestamp()

      }
    );


    toast(
      "Video uploaded ✓"
    );


    await loadVideos();


  }catch(error){

    console.error(error);

    toast(
      "Video upload failed"
    );

  }finally{

    loading(false);

    e.target.value="";

  }

}


/* VIDEO AUTOPLAY */

function activateVideos(){

  const videos=
    document.querySelectorAll(
      ".video"
    );


  const observer=
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const video=
            entry.target;


          if(entry.isIntersecting){

            videos.forEach(v=>{

              if(v!==video)
                v.pause();

            });


            video.muted=false;


            video.play()
              .catch(()=>{

                video.muted=true;

                video.play()
                  .catch(()=>{});

              });

          }else{

            video.pause();

          }

        });

      },
      {
        threshold:.7
      }
    );


  videos.forEach(
    video=>
      observer.observe(video)
  );

}

/* HELPERS */

function format(n){

  n=
    Number(n)||0;


  if(n>=1000000){

    return(
      (n/1000000)
      .toFixed(1)
      .replace(".0","")+
      "M"
    );

  }


  if(n>=1000){

    return(
      (n/1000)
      .toFixed(1)
      .replace(".0","")+
      "K"
    );

  }


  return String(n);

}


function safe(text){

  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function loading(show){

  document
    .getElementById("loader")
    .style.display=
      show ? "flex" : "none";

}


window.toast=function(message){

  const el=
    document.getElementById(
      "toast"
    );


  el.innerText=message;

  el.classList.add("show");


  setTimeout(()=>{

    el.classList.remove("show");

  },1800);

};
