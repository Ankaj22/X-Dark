<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-DARK Profile</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#08090d;
  color:white;
  font-family:Arial, sans-serif;
  padding-bottom:90px;
}

/* HEADER */
.header{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid #252630;
}

.header h1{
  font-size:25px;
}

.back{
  font-size:28px;
  cursor:pointer;
}

/* PROFILE */
.profile{
  text-align:center;
  padding:28px 20px 20px;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #8b52ff;
  padding:3px;
}

.username{
  margin-top:12px;
  font-size:24px;
  font-weight:bold;
}

.handle{
  color:#9699a5;
  margin-top:5px;
}

.bio{
  margin:15px auto;
  max-width:330px;
  color:#c9cbd4;
  line-height:1.4;
}

/* EDIT BUTTON */
.edit{
  background:#fff;
  color:#000;
  border:none;
  border-radius:10px;
  padding:11px 28px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

/* STATS */
.stats{
  display:flex;
  justify-content:center;
  gap:45px;
  padding:20px 0;
  border-bottom:1px solid #252630;
}

.stat{
  text-align:center;
  cursor:pointer;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#9699a5;
  font-size:13px;
}

/* TABS */
.tabs{
  display:flex;
  justify-content:space-around;
  border-bottom:1px solid #252630;
}

.tab{
  width:33.33%;
  padding:17px;
  text-align:center;
  color:#8f92a0;
  cursor:pointer;
}

.tab.active{
  color:white;
  border-bottom:3px solid #8b52ff;
}

/* POSTS */
.posts{
  padding:15px;
}

.post{
  background:#111219;
  border:1px solid #292b35;
  border-radius:15px;
  margin-bottom:15px;
  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
}

.small-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.post-name{
  font-weight:bold;
}

.post-time{
  color:#777a87;
  font-size:12px;
  margin-top:3px;
}

.post-video{
  width:100%;
  height:300px;
  background:#000;
  object-fit:cover;
}

.actions{
  display:flex;
  justify-content:space-between;
  padding:14px 18px;
  font-size:23px;
}

.actions span{
  cursor:pointer;
}

.caption{
  padding:0 15px 18px;
  font-size:15px;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:90%;
  max-width:380px;
  background:#15161d;
  border:1px solid #30323c;
  border-radius:18px;
  padding:22px;
}

.modal-box h2{
  margin-bottom:20px;
}

.modal-box input,
.modal-box textarea{
  width:100%;
  background:#0b0c10;
  border:1px solid #333641;
  color:white;
  padding:12px;
  border-radius:9px;
  margin-bottom:12px;
  outline:none;
}

.modal-box textarea{
  height:90px;
  resize:none;
}

.save{
  width:100%;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#8b52ff;
  color:white;
  font-weight:bold;
}

.close{
  margin-top:10px;
  width:100%;
  padding:11px;
  background:#292b34;
  color:white;
  border:0;
  border-radius:9px;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:#090a0e;
  border-top:1px solid #252630;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:50;
}

.nav{
  font-size:25px;
  color:#8d91a0;
  cursor:pointer;
}

.nav.active{
  color:white;
}

.add{
  width:58px;
  height:48px;
  border-radius:16px;
  background:white;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="back" onclick="goHome()">‹</div>
  <h1>X-DARK</h1>
  <div>⚙️</div>
</div>

<!-- PROFILE -->
<section class="profile">

  <img
    class="avatar"
    src="https://i.pravatar.cc/300?img=12"
    id="profilePhoto"
  >

  <div class="username" id="profileName">User</div>
  <div class="handle" id="profileHandle">@User</div>

  <div class="bio" id="profileBio">
    Welcome to my X-DARK profile 🚀
  </div>

  <button class="edit" onclick="openEdit()">
    Edit Profile
  </button>

</section>

<!-- STATS -->
<div class="stats">

  <div class="stat">
    <strong id="postCount">1</strong>
    <span>Posts</span>
  </div>

  <div class="stat">
    <strong>248</strong>
    <span>Followers</span>
  </div>

  <div class="stat">
    <strong>126</strong>
    <span>Following</span>
  </div>

</div>

<!-- TABS -->
<div class="tabs">

  <div class="tab active" onclick="showTab('posts',this)">
    🎬
  </div>

  <div class="tab" onclick="showTab('likes',this)">
    ❤️
  </div>

  <div class="tab" onclick="showTab('saved',this)">
    🔖
  </div>

</div>

<!-- POSTS -->
<div class="posts" id="posts">

  <div class="post">

    <div class="post-head">

      <img
        class="small-avatar"
        src="https://i.pravatar.cc/100?img=12"
      >

      <div>
        <div class="post-name">@User</div>
        <div class="post-time">X-DARK • Just now</div>
      </div>

    </div>

    <video
      class="post-video"
      controls
      playsinline
      poster=""
    ></video>

    <div class="actions">

      <span onclick="likePost(this)">♡</span>

      <span onclick="commentPost()">💬</span>

      <span onclick="sharePost()">↗</span>

      <span onclick="savePost(this)">🔖</span>

    </div>

    <div class="caption">
      My new X-DARK video 🚀
    </div>

  </div>

</div>

<!-- EMPTY TAB -->
<div
  id="empty"
  style="display:none;text-align:center;padding:70px 20px;color:#777"
>
  Nothing here yet.
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">

  <div class="modal-box">

    <h2>Edit Profile</h2>

    <input
      type="text"
      id="editName"
      placeholder="Name"
    >

    <input
      type="text"
      id="editHandle"
      placeholder="@Username"
    >

    <textarea
      id="editBio"
      placeholder="Bio"
    ></textarea>

    <input
      type="text"
      id="editPhoto"
      placeholder="Profile photo URL"
    >

    <button class="save" onclick="saveProfile()">
      Save Profile
    </button>

    <button class="close" onclick="closeEdit()">
      Cancel
    </button>

  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom">

  <div class="nav" onclick="goHome()">⌂</div>

  <div class="nav">⌕</div>

  <div class="add" onclick="createPost()">+</div>

  <div class="nav">♡</div>

  <div class="nav active">◉</div>

</div>

<script>

/* HOME */
function goHome(){
  window.location.href="index.html";
}

/* EDIT PROFILE */
function openEdit(){

  document.getElementById("editName").value =
    document.getElementById("profileName").innerText;

  document.getElementById("editHandle").value =
    document.getElementById("profileHandle").innerText;

  document.getElementById("editBio").value =
    document.getElementById("profileBio").innerText;

  document.getElementById("editPhoto").value =
    document.getElementById("profilePhoto").src;

  document.getElementById("editModal").style.display="flex";
}

function closeEdit(){
  document.getElementById("editModal").style.display="none";
}

function saveProfile(){

  let name =
    document.getElementById("editName").value.trim();

  let handle =
    document.getElementById("editHandle").value.trim();

  let bio =
    document.getElementById("editBio").value.trim();

  let photo =
    document.getElementById("editPhoto").value.trim();

  if(name){
    document.getElementById("profileName").innerText=name;
  }

  if(handle){
    document.getElementById("profileHandle").innerText=handle;
  }

  if(bio){
    document.getElementById("profileBio").innerText=bio;
  }

  if(photo){
    document.getElementById("profilePhoto").src=photo;
  }

  localStorage.setItem("xdark_name",name);
  localStorage.setItem("xdark_handle",handle);
  localStorage.setItem("xdark_bio",bio);
  localStorage.setItem("xdark_photo",photo);

  closeEdit();
}

/* LOAD PROFILE */
window.onload=function(){

  let name=localStorage.getItem("xdark_name");
  let handle=localStorage.getItem("xdark_handle");
  let bio=localStorage.getItem("xdark_bio");
  let photo=localStorage.getItem("xdark_photo");

  if(name)
    document.getElementById("profileName").innerText=name;

  if(handle)
    document.getElementById("profileHandle").innerText=handle;

  if(bio)
    document.getElementById("profileBio").innerText=bio;

  if(photo)
    document.getElementById("profilePhoto").src=photo;
};

/* TABS */
function showTab(type,element){

  document.querySelectorAll(".tab")
    .forEach(t=>t.classList.remove("active"));

  element.classList.add("active");

  if(type==="posts"){

    document.getElementById("posts").style.display="block";
    document.getElementById("empty").style.display="none";

  }else{

    document.getElementById("posts").style.display="none";
    document.getElementById("empty").style.display="block";

  }
}

/* LIKE */
function likePost(button){

  if(button.innerText==="♡"){
    button.innerText="♥";
  }else{
    button.innerText="♡";
  }
}

/* SAVE */
function savePost(button){

  if(button.innerText==="🔖"){
    button.innerText="📌";
  }else{
    button.innerText="🔖";
  }
}

/* COMMENT */
function commentPost(){
  let comment=prompt("Write your comment:");

  if(comment){
    alert("Comment added: "+comment);
  }
}

/* SHARE */
function sharePost(){

  if(navigator.share){

    navigator.share({
      title:"X-DARK",
      text:"Check this post on X-DARK"
    });

  }else{

    alert("Share option is not supported on this browser.");

  }
}

/* CREATE */
function createPost(){
  alert("Next step: Create Post / Video Upload");
}

</script>

</body>
</html>
