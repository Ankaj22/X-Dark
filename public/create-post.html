<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>X-DARK • Create</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08090d;
      color: white;
      font-family: Arial, sans-serif;
      padding-bottom: 100px;
    }

    header {
      padding: 22px;
      font-size: 28px;
      font-weight: 800;
      border-bottom: 1px solid #292b35;
    }

    .container {
      width: min(680px, 92%);
      margin: 30px auto;
    }

    .choose {
      border: 3px dashed #343744;
      border-radius: 30px;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      background: #111218;
    }

    .choose .emoji {
      font-size: 55px;
    }

    .choose h2 {
      margin: 12px 0 5px;
      font-size: 26px;
    }

    .choose p {
      margin: 0;
      color: #9295a3;
      font-size: 18px;
    }

    #videoInput {
      display: none;
    }

    .preview {
      margin-top: 28px;
      border-radius: 28px;
      overflow: hidden;
      background: #000;
      border: 1px solid #252732;
    }

    video {
      width: 100%;
      display: block;
      max-height: 500px;
      background: black;
    }

    .fileInfo {
      padding: 18px;
      background: #181920;
      color: #b9bbc5;
      font-size: 17px;
      word-break: break-word;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      background: #171820;
      border: 2px solid #30323e;
      border-radius: 22px;
      color: white;
      padding: 22px;
      font-size: 20px;
      outline: none;
      margin-top: 24px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    textarea:focus,
    input[type="text"]:focus {
      border-color: #7047ff;
    }

    .buttons {
      display: flex;
      gap: 18px;
      margin-top: 28px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 22px;
      padding: 20px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .cancel {
      background: #292b36;
      color: white;
    }

    .post {
      background: #f1f1f1;
      color: #050505;
    }

    .post:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 25px;
      font-size: 18px;
      color: #bfc0c9;
      min-height: 28px;
      line-height: 1.5;
    }

    .progressBox {
      display: none;
      margin-top: 18px;
      background: #1b1c24;
      border-radius: 15px;
      overflow: hidden;
      height: 14px;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #7047ff;
      transition: width .15s;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #08090d;
      border-top: 1px solid #292b35;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    nav button {
      background: none;
      color: white;
      font-size: 30px;
      padding: 8px;
    }

    .plus {
      background: white !important;
      color: black !important;
      width: 80px;
      height: 65px;
      border-radius: 25px !important;
      font-size: 38px !important;
    }
  </style>
</head>

<body>

<header>
  X-DARK
</header>

<div class="container">

  <label class="choose" for="videoInput">

    <div class="emoji">🎬</div>

    <h2>Choose Video</h2>

    <p>MP4 • MOV • WEBM • MKV</p>

  </label>

  <input
    id="videoInput"
    type="file"
    accept="video/mp4,video/quicktime,video/webm,video/x-matroska,.mp4,.mov,.webm,.mkv"
  >

  <div id="previewArea"></div>

  <textarea
    id="caption"
    placeholder="Write a caption..."
  ></textarea>

  <input
    id="tags"
    type="text"
    placeholder="#xdark #video"
  >

  <div class="buttons">

    <button
      class="cancel"
      onclick="cancelUpload()"
    >
      Cancel
    </button>

    <button
      id="postButton"
      class="post"
      onclick="uploadVideo()"
      disabled
    >
      Post
    </button>

  </div>

  <div class="progressBox" id="progressBox">
    <div class="progress" id="progress"></div>
  </div>

  <div
    class="status"
    id="status"
  ></div>

</div>

<nav>

  <button onclick="location.href='index.html'">
    ⌂
  </button>

  <button>
    ⌕
  </button>

  <button
    class="plus"
    onclick="location.reload()"
  >
    +
  </button>

  <button>
    ♡
  </button>

  <button onclick="location.href='profile.html'">
    ◉
  </button>

</nav>

<script>

let selectedFile = null;
let xhr = null;

// ======================================
// SELECT VIDEO
// ======================================

document
  .getElementById("videoInput")
  .addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
      return;
    }

    selectedFile = file;

    const url = URL.createObjectURL(file);

    document.getElementById("previewArea").innerHTML = `

      <div class="preview">

        <video
          src="${url}"
          controls
          playsinline
          preload="metadata"
        ></video>

        <div class="fileInfo">

          ${escapeHTML(file.name)}
          •
          ${formatSize(file.size)}

        </div>

      </div>

    `;

    document.getElementById("postButton").disabled = false;

    document.getElementById("status").textContent =
      "Video ready to upload 🎬";

  });


// ======================================
// UPLOAD
// ======================================

function uploadVideo() {

  if (!selectedFile) {

    alert("Please choose a video first.");

    return;
  }

  if (xhr) {
    return;
  }

  const caption =
    document.getElementById("caption").value.trim();

  const tags =
    document.getElementById("tags").value.trim();

  const formData = new FormData();

  formData.append("video", selectedFile);
  formData.append("caption", caption);
  formData.append("tags", tags);

  xhr = new XMLHttpRequest();

  xhr.open(
    "POST",
    "/api/upload",
    true
  );

  xhr.timeout = 10 * 60 * 1000;

  // ==================================
  // PROGRESS
  // ==================================

  xhr.upload.addEventListener(
    "progress",
    function (event) {

      if (event.lengthComputable) {

        const percent =
          Math.round(
            (event.loaded / event.total) * 100
          );

        document.getElementById("progressBox")
          .style.display = "block";

        document.getElementById("progress")
          .style.width = percent + "%";

        document.getElementById("status")
          .textContent =
          "Uploading video... " + percent + "%";

        document.getElementById("postButton")
          .textContent =
          percent + "%";

      }

    }
  );


  // ==================================
  // SUCCESS
  // ==================================

  xhr.onload = function () {

    console.log(
      "SERVER STATUS:",
      xhr.status
    );

    console.log(
      "SERVER RESPONSE:",
      xhr.responseText
    );

    if (
      xhr.status >= 200 &&
      xhr.status < 300
    ) {

      let data;

      try {

        data =
          JSON.parse(xhr.responseText);

      } catch (error) {

        data = null;
      }

      if (data && data.success) {

        document.getElementById("progress")
          .style.width = "100%";

        document.getElementById("status")
          .textContent =
          "Upload successful 🎉";

        document.getElementById("postButton")
          .textContent =
          "Uploaded ✓";

        setTimeout(function () {

          location.href = "index.html";

        }, 700);

      } else {

        showError(
          data?.message ||
          "Server returned an invalid response."
        );

      }

    } else {

      showError(
        "Server error: HTTP " +
        xhr.status +
        " " +
        xhr.statusText
      );

    }

    xhr = null;
  };


  // ==================================
  // NETWORK ERROR
  // ==================================

  xhr.onerror = function () {

    showError(
      "Network error. Server se connection nahi ho raha."
    );

    xhr = null;
  };


  // ==================================
  // TIMEOUT
  // ==================================

  xhr.ontimeout = function () {

    showError(
      "Upload timeout. Server ne time par response nahi diya."
    );

    xhr = null;
  };


  // ==================================
  // ABORT
  // ==================================

  xhr.onabort = function () {

    document.getElementById("status")
      .textContent =
      "Upload cancelled.";

    resetButton();

    xhr = null;
  };


  // ==================================
  // SEND
  // ==================================

  document.getElementById("postButton")
    .disabled = true;

  document.getElementById("postButton")
    .textContent = "Starting...";

  document.getElementById("status")
    .textContent =
    "Connecting to X-DARK server...";

  xhr.send(formData);

}


// ======================================
// ERROR
// ======================================

function showError(message) {

  document.getElementById("status")
    .textContent =
    "❌ " + message;

  document.getElementById("postButton")
    .textContent =
    "Try Again";

  document.getElementById("postButton")
    .disabled = false;

}


// ======================================
// CANCEL
// ======================================

function cancelUpload() {

  if (xhr) {

    xhr.abort();

    return;
  }

  location.href = "index.html";
}


// ======================================
// RESET
// ======================================

function resetButton() {

  document.getElementById("postButton")
    .disabled = false;

  document.getElementById("postButton")
    .textContent = "Post";
}


// ======================================
// FILE SIZE
// ======================================

function formatSize(bytes) {

  if (bytes < 1024) {
    return bytes + " B";
  }

  if (bytes < 1024 * 1024) {

    return (
      (bytes / 1024).toFixed(1) +
      " KB"
    );

  }

  return (
    (bytes / (1024 * 1024)).toFixed(1) +
    " MB"
  );
}


// ======================================
// SECURITY
// ======================================

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
