<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>X-DARK</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    background:#07080c;
    color:#fff;
    min-height:100%;
}

body{
    padding-bottom:78px;
}

/* ================= TOP BAR ================= */

.topbar{
    height:88px;
    background:#07080c;
    border-bottom:1px solid #292b34;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:30px;
    font-weight:800;
    letter-spacing:-1px;
}

.top-icons{
    display:flex;
    align-items:center;
    gap:25px;
}

.svg-icon{
    width:27px;
    height:27px;

    stroke:#f4f4f7;
    stroke-width:1.8;
    fill:none;

    cursor:pointer;
}


/* ================= PAGES ================= */

.page{
    display:none;
}

.page.active{
    display:block;
}


/* ================= STORIES ================= */

.stories{
    display:flex;
    gap:25px;

    padding:18px;

    overflow-x:auto;

    border-bottom:1px solid #191b22;
}

.stories::-webkit-scrollbar{
    display:none;
}

.story{
    min-width:78px;
    text-align:center;
}

.story-ring{
    width:76px;
    height:76px;

    padding:4px;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        #6825ff,
        #a64cff,
        #6825ff
    );

    margin:auto;
}

.story-ring img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    border:3px solid #07080c;
}

.story-name{
    margin-top:8px;

    color:#c9cad1;

    font-size:13px;

    white-space:nowrap;
}


/* ================= FEED ================= */

.feed{
    width:100%;
    max-width:650px;
    margin:auto;
}

.post{
    width:100%;

    border-bottom:1px solid #292b34;

    padding-bottom:15px;
}

.post-header{
    height:95px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;
}

.user-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:52px;
    height:52px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid #7935ff;

    padding:2px;
}

.username{
    font-size:18px;
    font-weight:700;
}

.location{
    color:#858792;
    font-size:13px;
    margin-top:4px;
}

.more{
    color:#ddd;
    font-size:22px;
    letter-spacing:3px;
}

.post-image{
    width:100%;
    display:block;
    max-height:700px;
    object-fit:cover;
}

.actions{
    height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;
}

.left-actions{
    display:flex;
    align-items:center;
    gap:21px;
}

.post-icon{
    width:29px;
    height:29px;

    stroke:#eee;
    stroke-width:1.7;
    fill:none;

    cursor:pointer;
}

.like-btn.liked{
    stroke:#ff3564;
    fill:#ff3564;
}

.save-btn.saved{
    stroke:#9d5cff;
}

.likes{
    padding:0 22px;

    font-size:14px;
    font-weight:700;
}

.caption{
    padding:8px 22px 0;

    line-height:22px;

    font-size:14px;
}

.comments-link{
    display:block;

    padding:8px 22px 14px;

    color:#777b88;

    font-size:14px;

    cursor:pointer;
}

.comment-area{
    display:none;

    padding:0 22px 15px;

    gap:8px;
}

.comment-area.active{
    display:flex;
}

.comment-input{
    flex:1;

    height:40px;

    background:#15171e;

    border:1px solid #30323c;

    color:#fff;

    border-radius:20px;

    padding:0 14px;

    outline:none;
}

.comment-send{
    border:0;

    background:#7130ff;

    color:#fff;

    border-radius:20px;

    padding:0 15px;
}


/* ==================================================
                     PROFILE
================================================== */

.profile{
    max-width:650px;
    margin:auto;
}


/* PROFILE HEADER */

.profile-top{
    padding:28px 22px 24px;

    border-bottom:1px solid #292b34;
}


/* PROFILE INFO */

.profile-info{
    display:flex;
    align-items:center;

    gap:25px;
}


/* PROFILE PHOTO */

.profile-photo{
    width:100px;
    height:100px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #7b36ff;

    padding:3px;
}


/* PROFILE DETAILS */

.profile-details{
    flex:1;
}

.profile-username{
    font-size:23px;
    font-weight:800;

    margin-bottom:5px;
}

.profile-handle{
    color:#8b8e9a;
    font-size:14px;
}


/* STATS */

.profile-stats{
    display:flex;

    justify-content:space-between;

    margin-top:28px;

    text-align:center;
}

.stat{
    flex:1;
}

.stat-number{
    font-size:18px;
    font-weight:800;
}

.stat-label{
    margin-top:5px;

    color:#858792;

    font-size:12px;
}


/* BIO */

.profile-bio{
    margin-top:20px;

    color:#d6d7dc;

    font-size:14px;

    line-height:21px;
}


/* EDIT BUTTON */

.edit-profile{
    width:100%;

    height:44px;

    margin-top:18px;

    border:1px solid #3a3c47;

    border-radius:12px;

    background:#15171e;

    color:#fff;

    font-size:14px;

    font-weight:700;

    cursor:pointer;
}


/* PROFILE TABS */

.profile-tabs{
    height:58px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    border-bottom:1px solid #292b34;
}

.profile-tab{
    width:33.33%;

    height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;
}

.profile-tab.active{
    border-bottom:2px solid #fff;
}

.tab-icon{
    width:23px;
    height:23px;

    stroke:#aaaeba;

    stroke-width:1.6;

    fill:none;
}

.profile-tab.active .tab-icon{
    stroke:#fff;
}


/* PROFILE GRID */

.profile-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:2px;

    background:#07080c;
}

.grid-item{
    aspect-ratio:1/1;

    overflow:hidden;

    background:#11131a;

    cursor:pointer;
}

.grid-item img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* ================= CREATE MODAL ================= */

.create-modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(8px);

    display:none;

    align-items:flex-end;

    justify-content:center;

    z-index:1000;
}

.create-modal.active{
    display:flex;
}

.create-box{
    width:100%;
    max-width:650px;

    background:#101117;

    border:1px solid #30323d;

    border-radius:28px 28px 0 0;

    padding:22px;
}

.create-head{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}

.create-title{
    font-size:22px;
    font-weight:700;
}

.close-btn{
    width:35px;
    height:35px;

    border:0;

    border-radius:50%;

    background:#20222b;

    color:#fff;

    font-size:22px;

    cursor:pointer;
}

.upload-area{
    border:1px dashed #555966;

    border-radius:20px;

    min-height:200px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    overflow:hidden;

    background:#0b0c11;
}

.upload-text{
    margin-top:12px;

    color:#aaaeba;

    font-size:14px;
}

.preview{
    width:100%;

    max-height:350px;

    object-fit:contain;

    display:none;
}

.caption-input{
    width:100%;

    height:90px;

    margin-top:15px;

    resize:none;

    outline:none;

    border:1px solid #30323d;

    border-radius:15px;

    background:#0b0c11;

    color:#fff;

    padding:14px;

    font-size:15px;
}

.publish-btn{
    width:100%;

    height:52px;

    margin-top:14px;

    border:0;

    border-radius:15px;

    background:#7434ff;

    color:#fff;

    font-size:16px;

    font-weight:700;
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:76px;

    background:#07080c;

    border-top:1px solid #292b34;

    display:flex;

    align-items:center;

    justify-content:space-around;

    padding:0 18px;

    z-index:500;
}

.nav-icon{
    width:32px;
    height:32px;

    stroke:#858894;

    stroke-width:1.7;

    fill:none;

    cursor:pointer;
}

.nav-icon.active{
    stroke:#fff;
}


/* PLUS */

.create-btn{
    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:transparent;

    color:#fff;

    font-size:38px;

    font-weight:300;

    cursor:pointer;
}


/* ================= TOAST ================= */

.toast{
    position:fixed;

    left:50%;
    bottom:95px;

    transform:translateX(-50%);

    background:#191b23;

    border:1px solid #30323d;

    color:#fff;

    padding:11px 19px;

    border-radius:22px;

    display:none;

    z-index:2000;

    white-space:nowrap;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    .profile-info{
        gap:18px;
    }

    .profile-photo{
        width:90px;
        height:90px;
    }

    .profile-username{
        font-size:20px;
    }

}
</style>
</head>

<script>

/* ================= PAGE SWITCH ================= */

function showPage(page){

    const home =
        document.getElementById("homePage");

    const profile =
        document.getElementById("profilePage");

    const homeNav =
        document.getElementById("homeNav");

    const profileNav =
        document.getElementById("profileNav");


    if(page === "home"){

        home.classList.add("active");

        profile.classList.remove("active");

        homeNav.classList.add("active");

        profileNav.classList.remove("active");

        window.scrollTo(0,0);

    }


    if(page === "profile"){

        profile.classList.add("active");

        home.classList.remove("active");

        profileNav.classList.add("active");

        homeNav.classList.remove("active");

        window.scrollTo(0,0);

    }

}


/* ================= CREATE POST ================= */

function openCreatePost(){

    document
        .getElementById("createModal")
        .classList.add("active");

}


function closeCreatePost(){

    document
        .getElementById("createModal")
        .classList.remove("active");

}


/* ================= MEDIA PREVIEW ================= */

function previewMedia(input){

    const file =
        input.files[0];

    if(!file){
        return;
    }


    const image =
        document.getElementById("previewImage");

    const video =
        document.getElementById("previewVideo");

    const url =
        URL.createObjectURL(file);


    image.style.display="none";

    video.style.display="none";


    if(file.type.startsWith("image/")){

        image.src=url;

        image.style.display="block";

    }


    if(file.type.startsWith("video/")){

        video.src=url;

        video.style.display="block";

    }

}


/* ================= PUBLISH ================= */

function publishPost(){

    const input =
        document.getElementById("mediaInput");

    const caption =
        document
        .getElementById("captionInput")
        .value
        .trim();


    const file =
        input.files[0];


    if(!file){

        showToast("Choose a photo or video");

        return;

    }


    const url =
        URL.createObjectURL(file);


    const post =
        document.createElement("article");

    post.className="post";


    let media="";


    if(file.type.startsWith("image/")){

        media=`
            <img
                class="post-image"
                src="${url}"
            >
        `;

    }


    if(file.type.startsWith("video/")){

        media=`
            <video
                class="post-image"
                src="${url}"
                controls
                playsinline>
            </video>
        `;

    }


    post.innerHTML=`

        <div class="post-header">

            <div class="user-info">

                <img
                    class="avatar"
                    src="https://i.pravatar.cc/150?img=12"
                >

                <div>

                    <div class="username">
                        @Ankaj
                    </div>

                    <div class="location">
                        X-DARK
                    </div>

                </div>

            </div>

            <div class="more">
                •••
            </div>

        </div>


        ${media}


        <div class="actions">

            <div class="left-actions">

                <svg
                    class="post-icon like-btn"
                    onclick="likePost(this)"
                    viewBox="0 0 24 24">

                    <path
                        d="M20.8 8.7
                        c0 5.5-8.8 10.3-8.8 10.3
                        S3.2 14.2 3.2 8.7
                        A4.7 4.7 0 0 1 12 6.1
                        a4.7 4.7 0 0 1 8.8 2.6Z"
                    />

                </svg>


                <svg
                    class="post-icon"
                    onclick="toggleComments(this)"
                    viewBox="0 0 24 24">

                    <path
                        d="M20 11.5a8 8 0 0 1-8 8
                        8.7 8.7 0 0 1-3.4-.7
                        L4 20l1.2-3.5
                        A8 8 0 1 1 20 11.5Z"
                    />

                </svg>


                <svg
                    class="post-icon"
                    onclick="sharePost()"
                    viewBox="0 0 24 24">

                    <path d="M4 12 20 4l-5 16-7-1Z"/>
                    <path d="M11 13 20 4"/>

                </svg>

            </div>


            <svg
                class="post-icon save-btn"
                onclick="savePost(this)"
                viewBox="0 0 24 24">

                <path d="M6 4h12v17l-6-4-6 4V4Z"/>

            </svg>

        </div>


        <div class="likes">

            <span class="like-count">
                0
            </span>

            likes

        </div>


        <div class="caption">

            <b>@Ankaj</b>
            ${escapeHTML(caption)}

        </div>


        <span
            class="comments-link"
            onclick="toggleComments(this)">

            Add a comment

        </span>


        <div class="comment-area">

            <input
                class="comment-input"
                placeholder="Add a comment..."
            >

            <button
                class="comment-send"
                onclick="addComment(this)">

                Post

            </button>

        </div>

    `;


    document
        .getElementById("feed")
        .prepend(post);


    input.value="";

    document
        .getElementById("captionInput")
        .value="";


    document
        .getElementById("previewImage")
        .style.display="none";


    document
        .getElementById("previewVideo")
        .style.display="none";


    closeCreatePost();

    showToast("Post published");

}


/* ================= ESCAPE ================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}


/* ================= LIKE ================= */

function likePost(button){

    const post =
        button.closest(".post");

    const count =
        post.querySelector(".like-count");


    let number =
        parseInt(
            count.textContent.replace(/,/g,"")
        );


    if(button.classList.contains("liked")){

        button.classList.remove("liked");

        number--;

    }else{

        button.classList.add("liked");

        number++;

    }


    count.textContent =
        number.toLocaleString();

}


/* ================= SAVE ================= */

function savePost(button){

    button.classList.toggle("saved");

    showToast(
        button.classList.contains("saved")
        ? "Post saved"
        : "Post unsaved"
    );

}


/* ================= COMMENTS ================= */

function toggleComments(element){

    const post =
        element.closest(".post");

    const area =
        post.querySelector(".comment-area");

    area.classList.toggle("active");

}


/* ================= COMMENT ================= */

function addComment(button){

    const area =
        button.closest(".comment-area");

    const input =
        area.querySelector(".comment-input");


    if(!input.value.trim()){

        showToast("Write a comment first");

        return;

    }


    input.value="";

    showToast("Comment posted");

}


/* ================= SHARE ================= */

function sharePost(){

    if(navigator.share){

        navigator.share({

            title:"X-DARK",

            text:"Check this post on X-DARK"

        });

    }else{

        showToast("Share ready");

    }

}


/* ================= TOAST ================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent=message;

    toast.style.display="block";


    setTimeout(function(){

        toast.style.display="none";

    },1800);

}

</script>
