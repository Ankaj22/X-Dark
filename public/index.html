<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>X-DARK Chat</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07070b;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  max-width:520px;
  height:100vh;
  margin:auto;
  background:#0d0d12;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #24242d;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
}

.header-btn{
  border:0;
  background:none;
  color:white;
  font-size:23px;
}

/* CHAT HEADER */

.chat-header{
  height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 13px;
  border-bottom:1px solid #24242d;
}

.back{
  border:0;
  background:none;
  color:white;
  font-size:32px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7434ff,#c54cff);
  font-weight:900;
}

.user-name{
  font-size:15px;
  font-weight:800;
}

.online{
  font-size:11px;
  color:#51e28a;
  margin-top:3px;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px 12px 100px;
}

.message{
  display:flex;
  margin:9px 0;
}

.sent{
  justify-content:flex-end;
}

.bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  background:#202027;
  word-break:break-word;
}

.sent .bubble{
  background:#7434ff;
  border-bottom-right-radius:5px;
}

.received .bubble{
  border-bottom-left-radius:5px;
}

/* REAL STICKER MESSAGE */

.sticker-message{
  max-width:170px;
  padding:5px;
}

.chat-sticker{
  width:145px;
  height:145px;
  object-fit:contain;
  display:block;
  filter:
    drop-shadow(0 10px 7px rgba(0,0,0,.7))
    drop-shadow(0 0 14px rgba(116,52,255,.22));

  animation:stickerIn .22s ease-out;
}

@keyframes stickerIn{
  from{
    transform:scale(.45) rotate(-8deg);
    opacity:0;
  }
  to{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

/* INPUT AREA */

.input-area{
  position:relative;
  flex-shrink:0;
  padding:9px;
  background:#101015;
  border-top:1px solid #24242d;
}

.input-box{
  height:50px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 7px;
  border-radius:28px;
  background:#1a1a21;
}

.input-box input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
}

.input-btn{
  border:0;
  background:none;
  color:white;
  font-size:21px;
  cursor:pointer;
}

.send{
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  background:#7434ff;
  color:white;
  cursor:pointer;
}

/* PICKER */

.picker{
  position:absolute;
  left:8px;
  right:8px;
  bottom:68px;

  background:#111117;
  border:1px solid #302044;
  border-radius:20px;

  padding:12px;

  box-shadow:
    0 20px 55px rgba(0,0,0,.8);

  display:none;
  z-index:999;
}

.picker.show{
  display:block;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  border-bottom:1px solid #292931;
  padding-bottom:10px;
  margin-bottom:12px;
}

.tab{
  width:48px;
  height:39px;
  border:0;
  border-radius:12px;
  background:#1c1c24;
  color:white;
  cursor:pointer;
  font-size:20px;
}

.tab.active{
  background:#7434ff;
  box-shadow:0 0 18px rgba(116,52,255,.45);
}

/* PANELS */

.panel{
  display:none;
}

.panel.active{
  display:block;
}

/* EMOJI */

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  max-height:220px;
  overflow-y:auto;
}

.emoji-grid button{
  border:0;
  background:none;
  color:white;
  font-size:25px;
  padding:7px;
  border-radius:10px;
  cursor:pointer;
}

.emoji-grid button:hover{
  background:#25252e;
}

/* STICKER HEADER */

.sticker-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.sticker-top strong{
  font-size:14px;
}

.sticker-top span{
  font-size:9px;
  color:#8c8c99;
  letter-spacing:1px;
}

/* REAL 3D STICKER GRID */

.sticker-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  max-height:310px;
  overflow-y:auto;
}

.sticker-card{
  position:relative;
  min-height:108px;

  border:1px solid #2b2b35;
  border-radius:18px;

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(116,52,255,.22),
      transparent 65%
    ),
    #19191f;

  cursor:pointer;
  padding:7px;

  transition:.18s;
}

.sticker-card:hover{
  transform:translateY(-3px) scale(1.03);
  border-color:#7434ff;
  box-shadow:0 9px 25px rgba(116,52,255,.25);
}

.sticker-card:active{
  transform:scale(.9);
}

.sticker-card img{
  width:72px;
  height:72px;
  object-fit:contain;

  filter:
    drop-shadow(0 7px 5px rgba(0,0,0,.8))
    drop-shadow(0 0 10px rgba(255,255,255,.08));
}

.sticker-card .title{
  display:block;
  margin-top:3px;
  color:#aaa;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
}

/* STICKER PREVIEW */

.empty-sticker{
  padding:25px 10px;
  text-align:center;
  color:#777;
  font-size:12px;
}

/* MOBILE */

@media(max-width:400px){

  .emoji-grid{
    grid-template-columns:repeat(6,1fr);
  }

  .sticker-grid{
    gap:7px;
  }

  .sticker-card{
    min-height:98px;
  }

  .sticker-card img{
    width:64px;
    height:64px;
  }

  .chat-sticker{
    width:125px;
    height:125px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP HEADER -->

  <header class="header">
    <div class="logo">X-DARK</div>
    <button class="header-btn">♡</button>
  </header>


  <!-- CHAT HEADER -->

  <div class="chat-header">

    <button
      class="back"
      onclick="history.back()">
      ‹
    </button>

    <div class="avatar">
      D
    </div>

    <div>
      <div class="user-name">
        Darkwing
      </div>

      <div class="online">
        ● Online
      </div>
    </div>

  </div>


  <!-- MESSAGES -->

  <div
    id="messages"
    class="messages">

    <div class="message received">
      <div class="bubble">
        Welcome to X-DARK 👋
      </div>
    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">


    <!-- PICKER -->

    <div
      id="picker"
      class="picker">


      <!-- TABS -->

      <div class="tabs">

        <button
          id="emojiTab"
          class="tab active"
          onclick="openTab('emoji')">
          😊
        </button>

        <button
          id="stickerTab"
          class="tab"
          onclick="openTab('sticker')">
          ✨
        </button>

      </div>


      <!-- EMOJI PANEL -->

      <div
        id="emojiPanel"
        class="panel active">

        <div class="emoji-grid">

          <button onclick="insertEmoji('😀')">😀</button>
          <button onclick="insertEmoji('😂')">😂</button>
          <button onclick="insertEmoji('🤣')">🤣</button>
          <button onclick="insertEmoji('😍')">😍</button>
          <button onclick="insertEmoji('🥰')">🥰</button>
          <button onclick="insertEmoji('😘')">😘</button>
          <button onclick="insertEmoji('😎')">😎</button>

          <button onclick="insertEmoji('🤩')">🤩</button>
          <button onclick="insertEmoji('🥳')">🥳</button>
          <button onclick="insertEmoji('😏')">😏</button>
          <button onclick="insertEmoji('😭')">😭</button>
          <button onclick="insertEmoji('😡')">😡</button>
          <button onclick="insertEmoji('😱')">😱</button>
          <button onclick="insertEmoji('🤔')">🤔</button>

          <button onclick="insertEmoji('🙄')">🙄</button>
          <button onclick="insertEmoji('❤️')">❤️</button>
          <button onclick="insertEmoji('🖤')">🖤</button>
          <button onclick="insertEmoji('💜')">💜</button>
          <button onclick="insertEmoji('💙')">💙</button>
          <button onclick="insertEmoji('🔥')">🔥</button>
          <button onclick="insertEmoji('✨')">✨</button>

          <button onclick="insertEmoji('🎉')">🎉</button>
          <button onclick="insertEmoji('💯')">💯</button>
          <button onclick="insertEmoji('🚀')">🚀</button>
          <button onclick="insertEmoji('⭐')">⭐</button>
          <button onclick="insertEmoji('👍')">👍</button>
          <button onclick="insertEmoji('👏')">👏</button>
          <button onclick="insertEmoji('🙏')">🙏</button>

        </div>

      </div>


      <!-- STICKER PANEL -->

      <div
        id="stickerPanel"
        class="panel">

        <div class="sticker-top">

          <strong>
            3D STICKERS
          </strong>

          <span>
            X-DARK PACK
          </span>

        </div>


        <div class="sticker-grid">


          <button
            class="sticker-card"
            onclick="sendSticker('cool')">

            <img
              src="stickers/cool.webp"
              alt="Cool">

            <span class="title">
              COOL
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('love')">

            <img
              src="stickers/love.webp"
              alt="Love">

            <span class="title">
              LOVE
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('laugh')">

            <img
              src="stickers/laugh.webp"
              alt="Laugh">

            <span class="title">
              LOL
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('fire')">

            <img
              src="stickers/fire.webp"
              alt="Fire">

            <span class="title">
              FIRE
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('wow')">

            <img
              src="stickers/wow.webp"
              alt="Wow">

            <span class="title">
              WOW
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('party')">

            <img
              src="stickers/party.webp"
              alt="Party">

            <span class="title">
              PARTY
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('angry')">

            <img
              src="stickers/angry.webp"
              alt="Angry">

            <span class="title">
              ANGRY
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('rocket')">

            <img
              src="stickers/rocket.webp"
              alt="Rocket">

            <span class="title">
              GO
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('heart')">

            <img
              src="stickers/heart.webp"
              alt="Heart">

            <span class="title">
              HEART
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('money')">

            <img
              src="stickers/money.webp"
              alt="Money">

            <span class="title">
              MONEY
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('omg')">

            <img
              src="stickers/omg.webp"
              alt="OMG">

            <span class="title">
              OMG
            </span>

          </button>


          <button
            class="sticker-card"
            onclick="sendSticker('like')">

            <img
              src="stickers/like.webp"
              alt="Like">

            <span class="title">
              LIKE
            </span>

          </button>

        </div>

      </div>

    </div>


    <!-- MESSAGE BAR -->

    <div class="input-box">

      <button class="input-btn">
        ＋
      </button>

      <input
        id="messageInput"
        placeholder="Message..."
        autocomplete="off">

      <button
        class="input-btn emoji-button"
        onclick="togglePicker()">
        😊
      </button>

      <button
        class="send"
        onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>

</div>


<script>

/* ELEMENTS */

const input =
  document.getElementById("messageInput");

const messages =
  document.getElementById("messages");

const picker =
  document.getElementById("picker");


/* PICKER */

function togglePicker(){

  picker.classList.toggle("show");

}


/* TABS */

function openTab(tab){

  const emojiPanel =
    document.getElementById("emojiPanel");

  const stickerPanel =
    document.getElementById("stickerPanel");

  const emojiTab =
    document.getElementById("emojiTab");

  const stickerTab =
    document.getElementById("stickerTab");


  if(tab === "emoji"){

    emojiPanel.classList.add("active");
    stickerPanel.classList.remove("active");

    emojiTab.classList.add("active");
    stickerTab.classList.remove("active");

  }else{

    emojiPanel.classList.remove("active");
    stickerPanel.classList.add("active");

    emojiTab.classList.remove("active");
    stickerTab.classList.add("active");

  }

}


/* EMOJI */

function insertEmoji(emoji){

  const start =
    input.selectionStart ??
    input.value.length;

  const end =
    input.selectionEnd ??
    input.value.length;

  input.value =
    input.value.substring(0,start) +
    emoji +
    input.value.substring(end);

  const position =
    start + emoji.length;

  input.focus();

  input.setSelectionRange(
    position,
    position
  );

}


/* TEXT MESSAGE */

function sendMessage(){

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  addMessage(text);

  input.value="";

  picker.classList.remove("show");

}


/* ADD TEXT */

function addMessage(text){

  const row =
    document.createElement("div");

  row.className =
    "message sent";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  row.appendChild(bubble);

  messages.appendChild(row);

  messages.scrollTop =
    messages.scrollHeight;

}


/* SEND REAL STICKER */

function sendSticker(name){

  const row =
    document.createElement("div");

  row.className =
    "message sent";


  const wrapper =
    document.createElement("div");

  wrapper.className =
    "sticker-message";


  const image =
    document.createElement("img");

  image.className =
    "chat-sticker";

  image.src =
    "stickers/" +
    name +
    ".webp";

  image.alt =
    name;


  image.onerror =
    function(){

      wrapper.innerHTML =
        "<div style='color:#aaa;font-size:12px;padding:10px'>" +
        "Sticker image missing: " +
        name +
        ".webp" +
        "</div>";

    };


  wrapper.appendChild(image);

  row.appendChild(wrapper);

  messages.appendChild(row);

  messages.scrollTop =
    messages.scrollHeight;


  picker.classList.remove("show");

}


/* ENTER */

input.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* OUTSIDE CLICK */

document.addEventListener(
  "click",
  function(e){

    if(
      !picker.contains(e.target) &&
      !e.target.closest(".emoji-button")
    ){

      picker.classList.remove("show");

    }

  }
);

</script>

</body>
</html>
