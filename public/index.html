<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>X-DARK</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08080c;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  font:inherit;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#0d0d12;
}

/* HEADER */

.header{
  height:62px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #22222b;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
}

.icon{
  background:none;
  border:0;
  color:white;
  font-size:24px;
  cursor:pointer;
}

/* CHAT */

.chat{
  height:calc(100vh - 62px);
  display:flex;
  flex-direction:column;
}

.chat-head{
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #22222b;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(
    135deg,
    #7434ff,
    #c04cff
  );
  display:grid;
  place-items:center;
  font-weight:bold;
}

.name{
  font-weight:bold;
}

.status{
  font-size:11px;
  color:#777;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow:auto;
  padding:16px 12px 90px;
}

.message{
  display:flex;
  margin:9px 0;
}

.message.sent{
  justify-content:flex-end;
}

.bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  background:#202027;
  word-break:break-word;
}

.sent .bubble{
  background:#7434ff;
  border-bottom-right-radius:5px;
}

.received .bubble{
  border-bottom-left-radius:5px;
}

/* MESSAGE BAR */

.message-bar-wrap{
  position:relative;
  padding:9px;
  background:#101015;
  border-top:1px solid #22222b;
}

.message-bar{
  display:flex;
  gap:7px;
  align-items:center;
  background:#1a1a21;
  border-radius:25px;
  padding:5px 7px;
}

.message-bar input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:9px;
  font-size:15px;
}

.send,
.emoji,
.plus{
  border:0;
  background:none;
  color:white;
  cursor:pointer;
}

.send{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#7434ff;
  font-size:17px;
}

.emoji{
  font-size:21px;
}

.plus{
  font-size:21px;
}

/* PICKER */

.picker{
  position:absolute;
  left:8px;
  right:8px;
  bottom:68px;
  background:#111117;
  border:1px solid #302044;
  border-radius:20px;
  padding:12px;
  box-shadow:0 15px 45px #000;
  display:none;
  z-index:9999;
}

.picker.show{
  display:block;
}

/* TABS */

.tabs{
  display:flex;
  gap:7px;
  border-bottom:1px solid #272731;
  padding-bottom:10px;
  margin-bottom:10px;
}

.tab{
  width:48px;
  height:38px;
  border:0;
  border-radius:11px;
  background:#1c1c24;
  color:#fff;
  cursor:pointer;
  font-size:20px;
}

.tab.active{
  background:#7434ff;
  box-shadow:0 0 15px #7434ff66;
}

/* PANELS */

.panel{
  display:none;
}

.panel.active{
  display:block;
}

/* EMOJI */

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  max-height:220px;
  overflow:auto;
}

.emoji-grid button{
  border:0;
  background:none;
  color:#fff;
  font-size:25px;
  padding:7px;
  cursor:pointer;
  border-radius:10px;
}

.emoji-grid button:hover{
  background:#252530;
}

/* STICKER HEADER */

.sticker-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.sticker-head b{
  font-size:14px;
}

.sticker-head span{
  font-size:10px;
  color:#888;
}

/* 3D STICKERS */

.sticker-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  max-height:280px;
  overflow:auto;
}

.sticker{
  height:105px;
  border:1px solid #292934;
  border-radius:18px;

  background:
    radial-gradient(
      circle at 50% 30%,
      #7434ff33,
      transparent 62%
    ),
    #19191f;

  color:white;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  transition:.18s;
}

.sticker:hover{
  transform:translateY(-3px) scale(1.03);
  border-color:#7434ff;
  box-shadow:
    0 8px 25px #7434ff33;
}

.sticker:active{
  transform:scale(.92);
}

.sticker-art{
  font-size:51px;
  line-height:58px;

  filter:
    drop-shadow(0 7px 4px #000)
    drop-shadow(0 0 8px #ffffff18);

  animation:stickerFloat 3s ease-in-out infinite;
}

.sticker label{
  font-size:9px;
  color:#aaa;
  font-weight:bold;
  letter-spacing:1px;
  margin-top:4px;
}

@keyframes stickerFloat{

  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-4px) rotate(2deg);
  }

}

/* SENT STICKER */

.chat-sticker{
  font-size:82px;
  line-height:1;

  filter:
    drop-shadow(0 9px 5px #000)
    drop-shadow(0 0 10px #7434ff55);

  animation:stickerPop .25s ease-out;
}

@keyframes stickerPop{

  from{
    transform:scale(.4);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }

}

/* MOBILE */

@media(max-width:400px){

  .emoji-grid{
    grid-template-columns:repeat(6,1fr);
  }

  .sticker-grid{
    gap:7px;
  }

  .sticker{
    height:94px;
  }

  .sticker-art{
    font-size:44px;
  }

  .chat-sticker{
    font-size:70px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    X-DARK
  </div>

  <button class="icon">
    ♡
  </button>

</header>


<section class="chat">

  <!-- CHAT HEADER -->

  <div class="chat-head">

    <button
      class="icon"
      onclick="history.back()">
      ‹
    </button>

    <div class="avatar">
      D
    </div>

    <div>
      <div class="name">
        Darkwing
      </div>

      <div class="status">
        Online
      </div>
    </div>

  </div>


  <!-- MESSAGES -->

  <div
    id="messages"
    class="messages">

    <div class="message received">

      <div class="bubble">
        Welcome to X-DARK 👋
      </div>

    </div>

  </div>


  <!-- MESSAGE AREA -->

  <div class="message-bar-wrap">


    <!-- PICKER -->

    <div
      id="picker"
      class="picker">


      <!-- TABS -->

      <div class="tabs">

        <button
          id="emojiTab"
          class="tab active"
          onclick="openTab('emoji')">
          😊
        </button>

        <button
          id="stickerTab"
          class="tab"
          onclick="openTab('sticker')">
          ✨
        </button>

      </div>


      <!-- EMOJI PANEL -->

      <div
        id="emojiPanel"
        class="panel active">

        <div class="emoji-grid">

          <button onclick="insertEmoji('😀')">😀</button>
          <button onclick="insertEmoji('😂')">😂</button>
          <button onclick="insertEmoji('🤣')">🤣</button>
          <button onclick="insertEmoji('😍')">😍</button>
          <button onclick="insertEmoji('🥰')">🥰</button>
          <button onclick="insertEmoji('😘')">😘</button>
          <button onclick="insertEmoji('😎')">😎</button>

          <button onclick="insertEmoji('🤩')">🤩</button>
          <button onclick="insertEmoji('🥳')">🥳</button>
          <button onclick="insertEmoji('😏')">😏</button>
          <button onclick="insertEmoji('😭')">😭</button>
          <button onclick="insertEmoji('😡')">😡</button>
          <button onclick="insertEmoji('😱')">😱</button>
          <button onclick="insertEmoji('🤔')">🤔</button>

          <button onclick="insertEmoji('🙄')">🙄</button>
          <button onclick="insertEmoji('❤️')">❤️</button>
          <button onclick="insertEmoji('🖤')">🖤</button>
          <button onclick="insertEmoji('💜')">💜</button>
          <button onclick="insertEmoji('💙')">💙</button>
          <button onclick="insertEmoji('🔥')">🔥</button>
          <button onclick="insertEmoji('✨')">✨</button>

          <button onclick="insertEmoji('🎉')">🎉</button>
          <button onclick="insertEmoji('💯')">💯</button>
          <button onclick="insertEmoji('🚀')">🚀</button>
          <button onclick="insertEmoji('⭐')">⭐</button>
          <button onclick="insertEmoji('👍')">👍</button>
          <button onclick="insertEmoji('👏')">👏</button>
          <button onclick="insertEmoji('🙏')">🙏</button>

        </div>

      </div>


      <!-- STICKER PANEL -->

      <div
        id="stickerPanel"
        class="panel">

        <div class="sticker-head">

          <b>
            3D Stickers
          </b>

          <span>
            MODERN PACK
          </span>

        </div>


        <div class="sticker-grid">


          <button
            class="sticker"
            onclick="sendSticker('😎','COOL')">

            <div class="sticker-art">
              😎
            </div>

            <label>
              COOL
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('🥰','LOVE')">

            <div class="sticker-art">
              🥰
            </div>

            <label>
              LOVE
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('😂','LOL')">

            <div class="sticker-art">
              😂
            </div>

            <label>
              LOL
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('🔥','FIRE')">

            <div class="sticker-art">
              🔥
            </div>

            <label>
              FIRE
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('🤩','WOW')">

            <div class="sticker-art">
              🤩
            </div>

            <label>
              WOW
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('🥳','PARTY')">

            <div class="sticker-art">
              🥳
            </div>

            <label>
              PARTY
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('😡','ANGRY')">

            <div class="sticker-art">
              😡
            </div>

            <label>
              ANGRY
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('🚀','GO')">

            <div class="sticker-art">
              🚀
            </div>

            <label>
              GO
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('❤️','HEART')">

            <div class="sticker-art">
              ❤️
            </div>

            <label>
              HEART
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('🤑','MONEY')">

            <div class="sticker-art">
              🤑
            </div>

            <label>
              MONEY
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('😱','OMG')">

            <div class="sticker-art">
              😱
            </div>

            <label>
              OMG
            </label>

          </button>


          <button
            class="sticker"
            onclick="sendSticker('👍','LIKE')">

            <div class="sticker-art">
              👍
            </div>

            <label>
              LIKE
            </label>

          </button>


        </div>

      </div>

    </div>


    <!-- INPUT -->

    <div class="message-bar">

      <button class="plus">
        ＋
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="Message...">

      <button
        class="emoji"
        onclick="togglePicker()">
        😊
      </button>

      <button
        class="send"
        onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>

</section>

</div>


<script>

/* ELEMENTS */

const input =
  document.getElementById("messageInput");

const messages =
  document.getElementById("messages");

const picker =
  document.getElementById("picker");


/* OPEN / CLOSE PICKER */

function togglePicker(){

  picker.classList.toggle("show");

}


/* SWITCH TAB */

function openTab(tab){

  const emojiPanel =
    document.getElementById("emojiPanel");

  const stickerPanel =
    document.getElementById("stickerPanel");

  const emojiTab =
    document.getElementById("emojiTab");

  const stickerTab =
    document.getElementById("stickerTab");


  if(tab === "emoji"){

    emojiPanel.classList.add("active");

    stickerPanel.classList.remove("active");

    emojiTab.classList.add("active");

    stickerTab.classList.remove("active");

  }

  else{

    emojiPanel.classList.remove("active");

    stickerPanel.classList.add("active");

    emojiTab.classList.remove("active");

    stickerTab.classList.add("active");

  }

}


/* INSERT EMOJI */

function insertEmoji(emoji){

  const start =
    input.selectionStart ??
    input.value.length;

  const end =
    input.selectionEnd ??
    input.value.length;

  const oldText =
    input.value;


  input.value =
    oldText.substring(0,start) +
    emoji +
    oldText.substring(end);


  const position =
    start + emoji.length;


  input.focus();

  input.setSelectionRange(
    position,
    position
  );

}


/* SEND NORMAL MESSAGE */

function sendMessage(){

  const text =
    input.value.trim();


  if(!text){
    return;
  }


  addTextMessage(
    text,
    true
  );


  input.value = "";

  picker.classList.remove("show");

}


/* ADD TEXT MESSAGE */

function addTextMessage(
  text,
  sent
){

  const row =
    document.createElement("div");


  row.className =
    "message " +
    (sent ? "sent" : "received");


  const bubble =
    document.createElement("div");


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  row.appendChild(
    bubble
  );


  messages.appendChild(
    row
  );


  messages.scrollTop =
    messages.scrollHeight;

}


/* SEND STICKER */

function sendSticker(
  sticker,
  name
){

  const row =
    document.createElement("div");


  row.className =
    "message sent";


  const stickerElement =
    document.createElement("div");


  stickerElement.className =
    "chat-sticker";


  stickerElement.textContent =
    sticker;


  stickerElement.title =
    name;


  row.appendChild(
    stickerElement
  );


  messages.appendChild(
    row
  );


  messages.scrollTop =
    messages.scrollHeight;


  picker.classList.remove(
    "show"
  );

}


/* ENTER TO SEND */

input.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* CLOSE PICKER WHEN CLICKING OUTSIDE */

document.addEventListener(
  "click",
  function(e){

    if(
      !picker.contains(e.target) &&
      !e.target.closest(".emoji")
    ){

      picker.classList.remove(
        "show"
      );

    }

  }
);

</script>

</body>
</html>
