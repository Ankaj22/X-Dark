<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-DARK</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#07080c;
  color:#fff;
  padding-bottom:80px;
}

/* TOP BAR */
.topbar{
  height:88px;
  background:#07080c;
  border-bottom:1px solid #292b34;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:30px;
  font-weight:800;
}

.top-icons{
  display:flex;
  gap:24px;
}

.svg-icon{
  width:27px;
  height:27px;
  stroke:#fff;
  stroke-width:1.8;
  fill:none;
  cursor:pointer;
}

/* STORIES */
.stories{
  display:flex;
  gap:24px;
  padding:18px;
  overflow-x:auto;
  border-bottom:1px solid #191b22;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:78px;
  text-align:center;
}

.story-ring{
  width:76px;
  height:76px;
  padding:4px;
  border-radius:50%;
  background:linear-gradient(135deg,#6825ff,#a64cff,#6825ff);
}

.story-ring img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #07080c;
}

.story-name{
  margin-top:8px;
  color:#c9cad1;
  font-size:13px;
}

/* FEED */
.feed{
  max-width:650px;
  margin:auto;
}

.post{
  border-bottom:1px solid #292b34;
  padding-bottom:15px;
}

.post-header{
  height:95px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.user-info{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #7935ff;
  padding:2px;
}

.username{
  font-weight:700;
  font-size:17px;
}

.location{
  color:#858792;
  font-size:13px;
  margin-top:4px;
}

.more{
  font-size:22px;
  letter-spacing:3px;
}

.post-image{
  width:100%;
  display:block;
  max-height:700px;
  object-fit:cover;
}

.actions{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.left-actions{
  display:flex;
  gap:21px;
}

.post-icon{
  width:29px;
  height:29px;
  stroke:#eee;
  stroke-width:1.7;
  fill:none;
  cursor:pointer;
}

.like-btn.liked{
  stroke:#ff3564;
  fill:#ff3564;
}

.save-btn.saved{
  stroke:#9d5cff;
}

.likes{
  padding:0 22px;
  font-weight:bold;
  font-size:14px;
}

.caption{
  padding:8px 22px 0;
  line-height:22px;
  font-size:14px;
}

.comments-link{
  display:block;
  padding:8px 22px 14px;
  color:#777b88;
  font-size:14px;
  cursor:pointer;
}

.comment-area{
  display:none;
  padding:0 22px 15px;
  gap:8px;
}

.comment-area.active{
  display:flex;
}

.comment-input{
  flex:1;
  height:40px;
  background:#15171e;
  border:1px solid #30323c;
  color:#fff;
  border-radius:20px;
  padding:0 14px;
  outline:none;
}

.comment-send{
  border:0;
  background:#7130ff;
  color:#fff;
  border-radius:20px;
  padding:0 15px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  background:#07080c;
  border-top:1px solid #292b34;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:200;
}

.nav-icon{
  width:32px;
  height:32px;
  stroke:#858894;
  stroke-width:1.7;
  fill:none;
  cursor:pointer;
}

.nav-icon.active{
  stroke:#fff;
}

/* PLAIN PLUS */
.create-btn{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  color:#fff;
  font-size:38px;
  font-weight:300;
  cursor:pointer;
}

/* ================= CREATE POST MODAL ================= */

.create-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(8px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:1000;
}

.create-modal.active{
  display:flex;
}

.create-box{
  width:100%;
  max-width:650px;
  background:#101117;
  border:1px solid #30323d;
  border-radius:28px 28px 0 0;
  padding:22px;
  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.create-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.create-title{
  font-size:22px;
  font-weight:700;
}

.close-btn{
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:#20222b;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

/* UPLOAD AREA */
.upload-area{
  border:1px dashed #555966;
  border-radius:20px;
  min-height:220px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  overflow:hidden;
  background:#0b0c11;
}

.upload-icon{
  width:50px;
  height:50px;
  stroke:#9b62ff;
  fill:none;
  stroke-width:1.5;
}

.upload-text{
  margin-top:12px;
  color:#aaaeba;
  font-size:14px;
}

.preview{
  width:100%;
  max-height:360px;
  object-fit:contain;
  display:none;
}

/* CAPTION */
.caption-input{
  width:100%;
  height:95px;
  margin-top:16px;
  resize:none;
  outline:none;
  border:1px solid #30323d;
  border-radius:16px;
  background:#0b0c11;
  color:#fff;
  padding:14px;
  font-size:15px;
}

.caption-input::placeholder{
  color:#686b76;
}

/* POST BUTTON */
.publish-btn{
  width:100%;
  height:52px;
  margin-top:15px;
  border:0;
  border-radius:16px;
  background:#7434ff;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.publish-btn:active{
  transform:scale(.98);
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#191b23;
  border:1px solid #30323d;
  padding:11px 19px;
  border-radius:22px;
  display:none;
  z-index:2000;
  white-space:nowrap;
  font-size:14px;
}

@media(max-width:380px){
  .stories{
    gap:17px;
  }

  .story-ring{
    width:70px;
    height:70px;
  }

  .post-header{
    padding:0 17px;
  }

  .actions,
  .likes,
  .caption,
  .comments-link{
    padding-left:17px;
    padding-right:17px;
  }
}
</style>
</head>

<body>

<!-- ================= TOP BAR ================= -->

<header class="topbar">

  <div class="logo">X-DARK</div>

  <div class="top-icons">

    <!-- CHAT -->
    <svg
      class="svg-icon"
      onclick="showToast('Chat coming next')"
      viewBox="0 0 24 24">

      <path d="M20 11.5a8 8 0 0 1-8 8
      8.7 8.7 0 0 1-3.4-.7
      L4 20l1.2-3.5
      A8 8 0 1 1 20 11.5Z"/>

      <path d="M8 11.5h.01"/>
      <path d="M12 11.5h.01"/>
      <path d="M16 11.5h.01"/>

    </svg>

    <!-- HEART -->
    <svg
      class="svg-icon"
      onclick="showToast('Activity')"
      viewBox="0 0 24 24">

      <path d="M20.8 8.7
      c0 5.5-8.8 10.3-8.8 10.3
      S3.2 14.2 3.2 8.7
      A4.7 4.7 0 0 1 12 6.1
      a4.7 4.7 0 0 1 8.8 2.6Z"/>

    </svg>

    <!-- MENU -->
    <svg
      class="svg-icon"
      onclick="showToast('Menu')"
      viewBox="0 0 24 24">

      <path d="M4 7h16"/>
      <path d="M4 12h16"/>
      <path d="M4 17h16"/>

    </svg>

  </div>

</header>


<!-- ================= STORIES ================= -->

<section class="stories">

  <div class="story">
    <div class="story-ring">
      <img src="https://i.pravatar.cc/150?img=12">
    </div>
    <div class="story-name">Your Story</div>
  </div>

  <div class="story">
    <div class="story-ring">
      <img src="https://i.pravatar.cc/150?img=47">
    </div>
    <div class="story-name">@User</div>
  </div>

  <div class="story">
    <div class="story-ring">
      <img src="https://i.pravatar.cc/150?img=32">
    </div>
    <div class="story-name">@Darkwing</div>
  </div>

  <div class="story">
    <div class="story-ring">
      <img src="https://i.pravatar.cc/150?img=44">
    </div>
    <div class="story-name">@XDark</div>
  </div>

  <div class="story">
    <div class="story-ring">
      <img src="https://i.pravatar.cc/150?img=15">
    </div>
    <div class="story-name">@Nova</div>
  </div>

</section>


<!-- ================= FEED ================= -->

<main class="feed" id="feed">


<!-- POST 1 -->

<article class="post">

  <div class="post-header">

    <div class="user-info">

      <img
        class="avatar"
        src="https://i.pravatar.cc/150?img=12"
      >

      <div>
        <div class="username">@Ankaj</div>
        <div class="location">Maldives</div>
      </div>

    </div>

    <div class="more">•••</div>

  </div>


  <img
    class="post-image"
    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=90"
  >


  <div class="actions">

    <div class="left-actions">

      <!-- LIKE -->

      <svg
        class="post-icon like-btn"
        onclick="likePost(this)"
        viewBox="0 0 24 24">

        <path d="M20.8 8.7
        c0 5.5-8.8 10.3-8.8 10.3
        S3.2 14.2 3.2 8.7
        A4.7 4.7 0 0 1 12 6.1
        a4.7 4.7 0 0 1 8.8 2.6Z"/>

      </svg>


      <!-- COMMENT -->

      <svg
        class="post-icon"
        onclick="toggleComments(this)"
        viewBox="0 0 24 24">

        <path d="M20 11.5a8 8 0 0 1-8 8
        8.7 8.7 0 0 1-3.4-.7
        L4 20l1.2-3.5
        A8 8 0 1 1 20 11.5Z"/>

      </svg>


      <!-- SHARE -->

      <svg
        class="post-icon"
        onclick="sharePost()"
        viewBox="0 0 24 24">

        <path d="M4 12 20 4l-5 16-4-7-7-1Z"/>
        <path d="M11 13 20 4"/>

      </svg>

    </div>


    <!-- SAVE -->

    <svg
      class="post-icon save-btn"
      onclick="savePost(this)"
      viewBox="0 0 24 24">

      <path d="M6 4h12v17l-6-4-6 4V4Z"/>

    </svg>

  </div>


  <div class="likes">
    <span class="like-count">128</span> likes
  </div>


  <div class="caption">
    <b>@Ankaj</b>
    Enjoying the beautiful Maldives 🌊✨
  </div>


  <span
    class="comments-link"
    onclick="toggleComments(this)">

    View all 24 comments

  </span>


  <div class="comment-area">

    <input
      class="comment-input"
      placeholder="Add a comment..."
    >

    <button
      class="comment-send"
      onclick="addComment(this)">

      Post

    </button>

  </div>

</article>

</main>


<!-- ================= CREATE POST MODAL ================= -->

<div
  class="create-modal"
  id="createModal"
  onclick="closeOutside(event)">

  <div class="create-box">

    <div class="create-head">

      <div class="create-title">
        Create Post
      </div>

      <button
        class="close-btn"
        onclick="closeCreatePost()">

        ×

      </button>

    </div>


    <!-- UPLOAD -->

    <label
      class="upload-area"
      for="mediaInput">

      <svg
        class="upload-icon"
        viewBox="0 0 24 24">

        <rect
          x="3"
          y="4"
          width="18"
          height="16"
          rx="2"
        />

        <circle
          cx="8"
          cy="9"
          r="1.5"
        />

        <path
          d="m4 17 5-5 3 3 2-2 6 5"
        />

      </svg>


      <div class="upload-text">
        Choose photo or video
      </div>


      <img
        id="previewImage"
        class="preview"
      >

      <video
        id="previewVideo"
        class="preview"
        controls>
      </video>

    </label>


    <input
      type="file"
      id="mediaInput"
      accept="image/*,video/*"
      style="display:none"
      onchange="previewMedia(this)"
    >


    <!-- CAPTION -->

    <textarea
      id="captionInput"
      class="caption-input"
      placeholder="Write a caption...">
    </textarea>


    <!-- POST -->

    <button
      class="publish-btn"
      onclick="publishPost()">

      Post

    </button>

  </div>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">


  <!-- HOME -->

  <svg
    class="nav-icon active"
    onclick="scrollHome()"
    viewBox="0 0 24 24">

    <path d="M3 10.5 12 3l9 7.5"/>
    <path d="M5 9.5V21h14V9.5"/>

  </svg>


  <!-- SEARCH -->

  <svg
    class="nav-icon"
    onclick="showToast('Search coming next')"
    viewBox="0 0 24 24">

    <circle
      cx="10.8"
      cy="10.8"
      r="6.5"
    />

    <path d="m16 16 5 5"/>

  </svg>


  <!-- PLUS -->

  <div
    class="create-btn"
    onclick="openCreatePost()">

    +

  </div>


  <!-- NOTIFICATION -->

  <svg
    class="nav-icon"
    onclick="showToast('Notifications')"
    viewBox="0 0 24 24">

    <path
      d="M18 9
      a6 6 0 0 0-12 0
      c0 7-3 7-3 9
      h18
      c0-2-3-2-3-9Z"
    />

    <path d="M10 21h4"/>

  </svg>


  <!-- PROFILE -->

  <svg
    class="nav-icon"
    onclick="showToast('Profile coming next')"
    viewBox="0 0 24 24">

    <circle
      cx="12"
      cy="8"
      r="3.5"
    />

    <path
      d="M4.5 21
      c.7-4.2
      3.1-6.5
      7.5-6.5
      s6.8 2.3
      7.5 6.5"
    />

  </svg>

</nav>


<!-- ================= TOAST ================= -->

<div
  class="toast"
  id="toast">
</div>


<script>

/* ================= CREATE POST ================= */

function openCreatePost(){

  document
    .getElementById("createModal")
    .classList.add("active");

}


function closeCreatePost(){

  document
    .getElementById("createModal")
    .classList.remove("active");

}


function closeOutside(event){

  if(event.target.id === "createModal"){

    closeCreatePost();

  }

}


/* ================= MEDIA PREVIEW ================= */

function previewMedia(input){

  const file = input.files[0];

  if(!file){
    return;
  }

  const image =
    document.getElementById("previewImage");

  const video =
    document.getElementById("previewVideo");

  const url =
    URL.createObjectURL(file);


  image.style.display = "none";
  video.style.display = "none";


  if(file.type.startsWith("image/")){

    image.src = url;

    image.style.display = "block";

  }

  else if(file.type.startsWith("video/")){

    video.src = url;

    video.style.display = "block";

  }

}


/* ================= PUBLISH POST ================= */

function publishPost(){

  const input =
    document.getElementById("mediaInput");

  const caption =
    document.getElementById("captionInput").value.trim();

  const file =
    input.files[0];


  if(!file){

    showToast("Please choose a photo or video");

    return;

  }


  const url =
    URL.createObjectURL(file);


  const post =
    document.createElement("article");

  post.className = "post";


  let mediaHTML = "";


  if(file.type.startsWith("image/")){

    mediaHTML = `
      <img
        class="post-image"
        src="${url}"
      >
    `;

  }

  else if(file.type.startsWith("video/")){

    mediaHTML = `
      <video
        class="post-image"
        src="${url}"
        controls
        playsinline>
      </video>
    `;

  }


  post.innerHTML = `

    <div class="post-header">

      <div class="user-info">

        <img
          class="avatar"
          src="https://i.pravatar.cc/150?img=12"
        >

        <div>

          <div class="username">
            @Ankaj
          </div>

          <div class="location">
            X-DARK
          </div>

        </div>

      </div>

      <div class="more">
        •••
      </div>

    </div>


    ${mediaHTML}


    <div class="actions">

      <div class="left-actions">

        <svg
          class="post-icon like-btn"
          onclick="likePost(this)"
          viewBox="0 0 24 24">

          <path d="M20.8 8.7
          c0 5.5-8.8 10.3-8.8 10.3
          S3.2 14.2 3.2 8.7
          A4.7 4.7 0 0 1 12 6.1
          a4.7 4.7 0 0 1 8.8 2.6Z"/>

        </svg>


        <svg
          class="post-icon"
          onclick="toggleComments(this)"
          viewBox="0 0 24 24">

          <path d="M20 11.5a8 8 0 0 1-8 8
          8.7 8.7 0 0 1-3.4-.7
          L4 20l1.2-3.5
          A8 8 0 1 1 20 11.5Z"/>

        </svg>


        <svg
          class="post-icon"
          onclick="sharePost()"
          viewBox="0 0 24 24">

          <path d="M4 12 20 4l-5 16-4-7-7-1Z"/>
          <path d="M11 13 20 4"/>

        </svg>

      </div>


      <svg
        class="post-icon save-btn"
        onclick="savePost(this)"
        viewBox="0 0 24 24">

        <path d="M6 4h12v17l-6-4-6 4V4Z"/>

      </svg>

    </div>


    <div class="likes">

      <span class="like-count">
        0
      </span>

      likes

    </div>


    <div class="caption">

      <b>@Ankaj</b>

      ${escapeHTML(caption)}

    </div>


    <span
      class="comments-link"
      onclick="toggleComments(this)">

      Add a comment

    </span>


    <div class="comment-area">

      <input
        class="comment-input"
        placeholder="Add a comment..."
      >

      <button
        class="comment-send"
        onclick="addComment(this)">

        Post

      </button>

    </div>

  `;


  const feed =
    document.getElementById("feed");

  feed.prepend(post);


  input.value = "";

  document.getElementById("captionInput").value = "";

  document.getElementById("previewImage").style.display = "none";

  document.getElementById("previewVideo").style.display = "none";

  closeCreatePost();

  showToast("Post published successfully");

}


/* ================= SECURITY ================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* ================= LIKE ================= */

function likePost(button){

  const post =
    button.closest(".post");

  const count =
    post.querySelector(".like-count");

  let number =
    parseInt(
      count.textContent.replace(/,/g,"")
    );


  if(button.classList.contains("liked")){

    button.classList.remove("liked");

    number--;

  }

  else{

    button.classList.add("liked");

    number++;

  }


  count.textContent =
    number.toLocaleString();

}


/* ================= SAVE ================= */

function savePost(button){

  if(button.classList.contains("saved")){

    button.classList.remove("saved");

    showToast("Post unsaved");

  }

  else{

    button.classList.add("saved");

    showToast("Post saved");

  }

}


/* ================= COMMENTS ================= */

function toggleComments(element){

  const post =
    element.closest(".post");

  const area =
    post.querySelector(".comment-area");

  area.classList.toggle("active");

}


/* ================= ADD COMMENT ================= */

function addComment(button){

  const area =
    button.closest(".comment-area");

  const input =
    area.querySelector(".comment-input");

  if(!input.value.trim()){

    showToast("Write a comment first");

    return;

  }

  input.value = "";

  showToast("Comment posted");

}


/* ================= SHARE ================= */

function sharePost(){

  if(navigator.share){

    navigator.share({

      title:"X-DARK",
      text:"Check this post on X-DARK"

    });

  }

  else{

    showToast("Share ready");

  }

}


/* ================= HOME ================= */

function scrollHome(){

  window.scrollTo({

    top:0,
    behavior:"smooth"

  });

}


/* ================= TOAST ================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.style.display =
    "block";


  setTimeout(function(){

    toast.style.display =
      "none";

  },1800);

}

</script>

</body>
</html>
