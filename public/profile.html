<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>X-DARK Profile</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:#08090d;

color:white;

font-family:Arial,sans-serif;

padding-bottom:90px;

}

header{

height:75px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

border-bottom:
1px solid #292b35;

}

.logo{

font-size:26px;

font-weight:900;

}

.profile{

text-align:center;

padding:
60px 20px 30px;

}

.avatar{

width:125px;

height:125px;

border-radius:50%;

object-fit:cover;

border:
3px solid #8c52ff;

padding:4px;

}

.name{

font-size:28px;

font-weight:900;

margin-top:20px;

}

.handle{

font-size:20px;

color:#858895;

margin-top:8px;

}

.bio{

font-size:18px;

color:#ccc;

margin-top:20px;

}

.stats{

display:flex;

justify-content:center;

gap:55px;

margin-top:35px;

}

.stat strong{

display:block;

font-size:22px;

}

.stat span{

display:block;

color:#898c99;

margin-top:7px;

}

.buttons{

display:flex;

justify-content:center;

gap:12px;

margin-top:30px;

}

button{

padding:
14px 25px;

border:0;

border-radius:13px;

font-size:16px;

font-weight:bold;

}

.edit{

background:white;

color:black;

}

.settings{

background:#20222b;

color:white;

}


/* NAV */

nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:75px;

background:#090a0e;

border-top:
1px solid #292b35;

display:flex;

justify-content:
space-around;

align-items:center;

font-size:27px;

}

.plus{

background:white;

color:black;

padding:
8px 20px;

border-radius:16px;

}

.active{

color:white;

}

</style>

</head>


<body>


<header>

<div class="logo">
X-DARK
</div>

<div>
☰
</div>

</header>


<section class="profile">


<img
class="avatar"
id="avatar"
src="https://i.pravatar.cc/300?img=12">


<div
class="name"
id="name">

X-Dark User

</div>


<div
class="handle"
id="handle">

@Darkwing2

</div>


<div
class="bio"
id="bio">

Welcome to X-DARK 🚀

</div>


<div class="stats">


<div class="stat">

<strong id="posts">
0
</strong>

<span>
Posts
</span>

</div>


<div class="stat">

<strong>
0
</strong>

<span>
Followers
</span>

</div>


<div class="stat">

<strong>
0
</strong>

<span>
Following
</span>

</div>


</div>


<div class="buttons">


<button
class="edit"
onclick="editProfile()">

Edit profile

</button>


<button
class="settings">

Settings

</button>


</div>


</section>


<nav>


<span
onclick="
window.location.href=
'index.html'
">
⌂
</span>


<span>
⌕
</span>


<span
class="plus"
onclick="
window.location.href=
'create-post.html'
">
+
</span>


<span>
♡
</span>


<span class="active">
◉
</span>


</nav>


<script>


async function loadPostCount(){

try{

const response =
await fetch(
"/api/posts"
);

const posts =
await response.json();

document.getElementById(
"posts"
).innerText =
posts.length;

}

catch(error){

console.log(error);

}

}


function editProfile(){


const currentName =
document.getElementById(
"name"
).innerText;


const currentBio =
document.getElementById(
"bio"
).innerText;


const newName =
prompt(
"Enter your name:",
currentName
);


if(newName){

document.getElementById(
"name"
).innerText =
newName;

localStorage.setItem(
"xdarkName",
newName
);

}


const newBio =
prompt(
"Enter your bio:",
currentBio
);


if(newBio){

document.getElementById(
"bio"
).innerText =
newBio;

localStorage.setItem(
"xdarkBio",
newBio
);

}

}


const savedName =
localStorage.getItem(
"xdarkName"
);


const savedBio =
localStorage.getItem(
"xdarkBio"
);


if(savedName){

document.getElementById(
"name"
).innerText =
savedName;

}


if(savedBio){

document.getElementById(
"bio"
).innerText =
savedBio;

}


loadPostCount();


</script>


</body>

</html>
